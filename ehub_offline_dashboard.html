<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eHub Offline Dashboard</title>
<style>
:root{--blue:#3694fc;--charcoal:#21212b;--indigo:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;
--bg:#f4f6fa;--card:#fff;--line:#e5e8ef;--muted:#8a90a2;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Be Vietnam Pro',-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--charcoal);}
#gate{position:fixed;inset:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center;z-index:1000;}
#gate .card{background:#fff;border-radius:14px;padding:38px 34px;width:340px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4);}
#gate h1{font-size:20px;margin:0 0 6px;color:var(--charcoal);}
#gate p{color:var(--muted);font-size:13px;margin:0 0 20px;}
#gate .logo{font-weight:800;font-size:26px;color:var(--blue);letter-spacing:1px;margin-bottom:14px;}
#gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:12px;}
#gate button{width:100%;padding:11px;background:var(--blue);color:#fff;border:0;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
#gate .err{color:var(--coral);font-size:12px;height:16px;margin-top:6px;}
#app{display:none;padding:22px 26px 60px;max-width:1500px;margin:0 auto;}
header .logo{font-weight:800;color:var(--blue);font-size:15px;letter-spacing:1px;}
header h1{font-size:24px;margin:4px 0 4px;}
header .sub{color:var(--muted);font-size:13px;max-width:900px;line-height:1.5;}
.stats{display:flex;gap:14px;margin:20px 0;flex-wrap:wrap;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:150px;flex:1;}
.stat .n{font-size:24px;font-weight:700;}
.stat .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.layout{display:flex;gap:20px;align-items:flex-start;}
.main{flex:1;min-width:0;}
.side{width:290px;flex-shrink:0;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
.panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.panel .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #f0f2f7;}
.panel .row:last-child{border-bottom:0;}
.panel .row .v{color:var(--muted);font-size:12px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
.filters input{flex:1;min-width:180px;}
.count{color:var(--muted);font-size:12px;margin-bottom:8px;}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
th{background:#fafbfd;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap;}
th .ar{color:var(--blue);}
tr.acct{background:#eef4fe;cursor:pointer;font-weight:600;}
tr.acct:hover{background:#e2edfd;}
tr.acct td{border-bottom:1px solid #d9e5f8;}
tr.deal td:first-child{padding-left:22px;}
a.opp{color:var(--blue);text-decoration:none;}
a.opp:hover{text-decoration:underline;}
.acv .native{color:var(--muted);font-size:11px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.st0,.st1{background:#e3f0ff;color:#1a6fd4;}
.st2,.st3{background:#fff4d6;color:#a5790a;}
.st4{background:#efe4ff;color:#6100FF;}
.st5{background:#dcf7ef;color:#128a6b;}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;margin:1px 2px 1px 0;}
.tAMC{background:#e3f0ff;color:#1a6fd4;}
.tTicketing{background:#fde4ef;color:#c23670;}
.tGeneric{background:#e9e2ff;color:#6100FF;}
.tSmartReach{background:#d9f6f1;color:#0f8f78;}
.fed{background:#efe4ff;color:#6100FF;margin-left:6px;}
.muted{color:var(--muted);}
.dash{color:var(--muted);}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <h1>eHub Offline Dashboard</h1>
    <p>Enter password to continue</p>
    <input id="pw" type="password" placeholder="Password" autofocus>
    <button onclick="checkPw()">Access Dashboard</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">NiCE</div>
    <h1>eHub Offline Dashboard</h1>
    <div class="sub">Engagement Hub Offline &mdash; open opportunities (excl. Closed) from Salesforce CPQ, offline recording SKU 1464-3063, grouped by account. ACV shown in USD (corporate currency).</div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="layout">
    <div class="main">
      <div class="filters">
        <input id="search" placeholder="Search opportunity, account, owner...">
        <select id="fType"><option value="">All Types</option></select>
        <select id="fStage"><option value="">All Stages</option></select>
        <select id="fRegion"><option value="">All Regions</option></select>
      </div>
      <div class="count" id="count"></div>
      <table id="tbl">
        <thead><tr id="hrow"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="side">
      <div class="panel"><h3>By Stage</h3><div id="byStage"></div></div>
      <div class="panel"><h3>By Type</h3><div id="byType"></div></div>
      <div class="panel"><h3>By Region</h3><div id="byRegion"></div></div>
    </div>
  </div>
</div>

async function checkPw(){const v=document.getElementById('pw').value;const h=await sha256hex(v);if(h===STORED){sessionStorage.setItem('ehub_off_ok','1');show();}else{document.getElementById('err').textContent='Incorrect password';}}
function show(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';render();}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();});
if(sessionStorage.getItem('ehub_off_ok')==='1'){show();}

FEDRAMP |  Amendment  | Recording Management", "stageNum": "0", "stageShort": "Prospecting", "close": "2026-12-31", "usd": 0, "native": 0, "cur": "USD", "account": "MEIJI YASUDA LIFE  INSURANCE COMPANY", "owner": "David Young", "region": "Americas", "regionDisplay": "Americas / FSI 2", "types": ["Generic"], "fedramp": true}, {"id": "006Ui00002cjSsUIAU", "name": "SPIRE |  Amendment  | 2026-07-20", "stageNum": "4", "stageShort": "Confirm Value & Agreement", "close": "2026-08-28", "usd": 107100, "native": 107100, "cur": "USD", "account": "Spire Inc.", "owner": "Jason Cates", "region": "Americas", "regionDisplay": "Americas / Commercial Central 3", "types": ["SmartReach"], "fedramp": false}, {"id": "006Ui00002e0dm9IAA", "name": "California Casualty Management Company | Engagement Hub | QM | WFM | 125", "stageNum": "2", "stageShort": "Determining Problem", "close": "2026-12-29", "usd": 139338.6, "native": 139338.6, "cur": "USD", "account": "California Casualty Indemnity Exchange", "owner": "Kevin Ravert", "region": "Americas", "regionDisplay": "Americas / SMB West", "types": ["Generic"], "fedramp": false}, {"id": "006Ui00002f1xOoIAI", "name": "ACCURATE BACKGROUND |  Project Seed  | 2026-07-31", "stageNum": "1", "stageShort": "Identification / Qualification", "close": "2027-03-19", "usd": 117120, "native": 117120, "cur": "USD", "account": "Accurate Background, LLC", "owner": "Michael Ryals", "region": "", "regionDisplay": "Commercial Central 4", "types": [], "fedramp": false}, {"id": "006Ui00002fUr1SIAS", "name": "TDS TELECOM |  Project Seed", "stageNum": "1", "stageShort": "Identification / Qualification", "close": "2027-03-17", "usd": 0, "native": 0, "cur": "USD", "account": "TELEPHONE AND DATA SYSTEMS, INC.", "owner": "Todd Brown", "region": "Americas", "regionDisplay": "Americas / Commercial Central 3", "types": ["SmartReach"], "fedramp": false}];
const LINK="https://niceincontact.lightning.force.com/lightning/r/Opportunity/";
const TYPE_ORDER=["AMC","Ticketing","Generic","SmartReach"];
const COLS=[["opp","Opportunity"],["account","Account"],["type","Type"],["stage","Stage"],["close","Close Date"],["acv","ACV"],["region","Region / Territory"],["owner","Owner"]];
let sortCol=null,sortDir=1; // dir 1 asc, -1 desc, null=grouped
const collapsed={};

function fmtUSD(n){return '$'+Math.round(n).toLocaleString('en-US');}
function fmtNative(n,c){return n.toLocaleString('en-US')+' '+c;}
function stageBadge(d){const num=d.stageNum;const cls=num!==null?('st'+num):'st0';const lbl=num!==null?(num+' · '+d.stageShort):d.stageShort;return '<span class="badge '+cls+'">'+lbl+'</span>';}
function typeCell(d){if(!d.types||!d.types.length)return '<span class="dash">—</span>';return d.types.map(t=>'<span class="pill t'+t+'">'+t+'</span>').join('');}
function oppLink(d){return '<a class="opp" href="'+LINK+d.id+'/view" target="_blank">'+esc(d.name)+'</a>';}
function ownerCell(d){return esc(d.owner)+(d.fedramp?'<span class="badge fed">FedRAMP</span>':'');}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function filtered(){
  const q=document.getElementById('search').value.toLowerCase();
  const ft=document.getElementById('fType').value;
  const fs=document.getElementById('fStage').value;
  const fr=document.getElementById('fRegion').value;
  return DEALS.filter(d=>{
    if(q){const hay=(d.name+' '+d.account+' '+d.owner).toLowerCase();if(!hay.includes(q))return false;}
    if(ft){if(!d.types.includes(ft))return false;}
    if(fs!==''){if(String(d.stageNum)!==fs)return false;}
    if(fr){if(d.region!==fr)return false;}
    return true;
  });
}

function render(){
  const data=filtered();
  // stats
  const totUSD=data.reduce((s,d)=>s+d.usd,0);
  const accts=new Set(data.map(d=>d.account));
  const fed=data.filter(d=>d.fedramp).length;
  document.getElementById('stats').innerHTML=[
    ['Open Deals',data.length],['Accounts',accts.size],
    ['Total Pipeline ACV (USD)',fmtUSD(totUSD)],['FedRAMP',fed]
  ].map(s=>'<div class="stat"><div class="n">'+s[1]+'</div><div class="l">'+s[0]+'</div></div>').join('');
  document.getElementById('count').textContent=data.length+' deals · '+accts.size+' accounts';

  // header
  document.getElementById('hrow').innerHTML=COLS.map(c=>{
    let ar='';if(sortCol===c[0]&&sortDir!==null)ar=' <span class="ar">'+(sortDir===1?'▲':'▼')+'</span>';
    return '<th data-c="'+c[0]+'">'+c[1]+ar+'</th>';
  }).join('');
  document.querySelectorAll('#hrow th').forEach(th=>th.onclick=()=>clickSort(th.dataset.c));

  const tb=document.getElementById('tbody');tb.innerHTML='';
  if(sortCol&&sortDir!==null){
    // flat
    const arr=data.slice().sort(cmp);
    arr.forEach(d=>tb.appendChild(dealRow(d,true)));
  }else{
    // grouped
    const groups={};
    data.forEach(d=>{(groups[d.account]=groups[d.account]||[]).push(d);});
    const order=Object.keys(groups).sort((a,b)=>groups[b].reduce((s,d)=>s+d.usd,0)-groups[a].reduce((s,d)=>s+d.usd,0));
    order.forEach(acc=>{
      const g=groups[acc];const tot=g.reduce((s,d)=>s+d.usd,0);
      const tr=document.createElement('tr');tr.className='acct';
      const isC=collapsed[acc];
      tr.innerHTML='<td colspan="5">'+(isC?'▶':'▼')+' '+esc(acc)+' <span class="muted">('+g.length+' deal'+(g.length>1?'s':'')+')</span></td>'
        +'<td>'+fmtUSD(tot)+'</td><td colspan="2"></td>';
      tr.onclick=()=>{collapsed[acc]=!collapsed[acc];render();};
      tb.appendChild(tr);
      if(!isC){g.slice().sort((a,b)=>a.close<b.close?-1:a.close>b.close?1:0).forEach(d=>tb.appendChild(dealRow(d,false)));}
    });
  }
  renderSidebar(data);
}

function dealRow(d,showAcct){
  const tr=document.createElement('tr');tr.className='deal';
  const acvNative=(d.cur!=='USD')?'<div class="native">'+fmtNative(d.native,d.cur)+'</div>':'';
  const acctCell=showAcct?esc(d.account):'';
  tr.innerHTML='<td>'+oppLink(d)+'</td>'
    +'<td class="muted">'+acctCell+'</td>'
    +'<td>'+typeCell(d)+'</td>'
    +'<td>'+stageBadge(d)+'</td>'
    +'<td>'+d.close+'</td>'
    +'<td class="acv">'+fmtUSD(d.usd)+acvNative+'</td>'
    +'<td>'+esc(d.regionDisplay)+'</td>'
    +'<td>'+ownerCell(d)+'</td>';
  return tr;
}

function cmp(a,b){
  let va,vb;
  switch(sortCol){
    case 'opp':va=a.name.toLowerCase();vb=b.name.toLowerCase();break;
    case 'account':va=a.account.toLowerCase();vb=b.account.toLowerCase();break;
    case 'type':va=a.types.join(',');vb=b.types.join(',');break;
    case 'stage':va=a.stageNum===null?-1:+a.stageNum;vb=b.stageNum===null?-1:+b.stageNum;break;
    case 'close':va=a.close;vb=b.close;break;
    case 'acv':va=a.usd;vb=b.usd;break;
    case 'region':va=a.regionDisplay.toLowerCase();vb=b.regionDisplay.toLowerCase();break;
    case 'owner':va=a.owner.toLowerCase();vb=b.owner.toLowerCase();break;
  }
  if(va<vb)return -1*sortDir;if(va>vb)return 1*sortDir;return 0;
}

function clickSort(c){
  if(sortCol!==c){sortCol=c;sortDir=1;}
  else if(sortDir===1){sortDir=-1;}
  else{sortCol=null;sortDir=null;}
  render();
}

function renderSidebar(data){
  // by stage
  const st={};
  data.forEach(d=>{const k=d.stageNum===null?'?':d.stageNum;(st[k]=st[k]||{c:0,a:0});st[k].c++;st[k].a+=d.usd;});
  document.getElementById('byStage').innerHTML=Object.keys(st).sort().map(k=>{
    const lbl=k==='?'?'Other':(k+' · '+({"0":"Prospecting","1":"Identification","2":"Determining Problem","3":"Aligning Benefits","4":"Confirm Value","5":"Proposal / Neg."}[k]||''));
    return '<div class="row"><span>'+lbl+'</span><span class="v">'+st[k].c+' · '+fmtUSD(st[k].a)+'</span></div>';
  }).join('');
  // by type
  const ty={};TYPE_ORDER.forEach(t=>ty[t]={c:0,a:0});ty['None']={c:0,a:0};
  data.forEach(d=>{if(d.types.length){d.types.forEach(t=>{ty[t].c++;ty[t].a+=d.usd;});}else{ty['None'].c++;ty['None'].a+=d.usd;}});
  document.getElementById('byType').innerHTML=TYPE_ORDER.concat(['None']).map(t=>
    '<div class="row"><span>'+t+'</span><span class="v">'+ty[t].c+' · '+fmtUSD(ty[t].a)+'</span></div>').join('');
  // by region
  const rg={};data.forEach(d=>{const k=d.region||'—';rg[k]=(rg[k]||0)+1;});
  document.getElementById('byRegion').innerHTML=Object.keys(rg).sort().map(k=>
    '<div class="row"><span>'+esc(k)+'</span><span class="v">'+rg[k]+'</span></div>').join('');
}

// populate filter dropdowns
(function(){
  const types=TYPE_ORDER.filter(t=>DEALS.some(d=>d.types.includes(t)));
  document.getElementById('fType').innerHTML='<option value="">All Types</option>'+types.map(t=>'<option>'+t+'</option>').join('');
  const stages=[...new Set(DEALS.map(d=>d.stageNum).filter(x=>x!==null))].sort();
  document.getElementById('fStage').innerHTML='<option value="">All Stages</option>'+stages.map(s=>'<option value="'+s+'">'+s+' · '+(DEALS.find(d=>d.stageNum===s).stageShort)+'</option>').join('');
  const regions=[...new Set(DEALS.map(d=>d.region).filter(x=>x))].sort();
  document.getElementById('fRegion').innerHTML='<option value="">All Regions</option>'+regions.map(r=>'<option>'+r+'</option>').join('');
  ['search','fType','fStage','fRegion'].forEach(id=>document.getElementById(id).addEventListener('input',render));
})();
</script>
