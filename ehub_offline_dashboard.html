<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Offline Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --nice-blue: #3694fc;
    --nice-charcoal: #21212b;
    --nice-indigo: #6100FF;
    --amc-color: #3694fc;
    --ticketing-color: #36EAD0;
    --generic-color: #FF9F43;
    --smartreach-color: #6100FF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    background: #f4f6fa;
    color: var(--nice-charcoal);
  }
  /* Password overlay */
  #pwOverlay {
    position: fixed; inset: 0; background: var(--nice-charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #pwCard {
    background: #fff; border-radius: 12px; padding: 40px 36px; width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4); text-align: center;
  }
  #pwCard h2 { margin: 0 0 4px; color: var(--nice-charcoal); font-size: 20px; }
  #pwCard p { margin: 0 0 20px; color: #6b6b76; font-size: 13px; }
  #pwCard .brand-bar { height: 4px; width: 48px; background: var(--nice-blue); border-radius: 2px; margin: 0 auto 16px; }
  #pwInput {
    width: 100%; padding: 10px 12px; border: 1px solid #d8d8e0; border-radius: 8px;
    font-size: 14px; margin-bottom: 12px;
  }
  #pwBtn {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
    background: var(--nice-blue); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #pwBtn:hover { background: #2680e0; }
  #pwError { color: #e0245e; font-size: 12px; margin-top: 10px; min-height: 14px; }
  #app { display: none; }

  .header {
    background: var(--nice-charcoal); color: #fff; padding: 24px 32px;
  }
  .header h1 { margin: 0 0 4px; font-size: 22px; }
  .header p { margin: 0; font-size: 13px; color: #b8b8c4; }
  .header .note { color: var(--nice-blue); font-weight: 600; margin-top: 4px; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    padding: 20px 32px; background: #fff; border-bottom: 1px solid #e6e6ec;
  }
  .stat-tile {
    background: #f8f9fc; border-radius: 10px; padding: 16px 18px; border: 1px solid #eceef4;
  }
  .stat-tile .label { font-size: 12px; color: #7a7a86; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .stat-tile .value { font-size: 24px; font-weight: 700; color: var(--nice-charcoal); }

  .layout { display: flex; gap: 20px; padding: 20px 32px; align-items: flex-start; }
  .main { flex: 1; min-width: 0; }
  .sidebar { width: 280px; flex-shrink: 0; }

  .filters {
    background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border: 1px solid #eceef4;
  }
  .filters input[type=text] {
    flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid #d8d8e0; border-radius: 8px; font-size: 13px;
  }
  .filters select {
    padding: 8px 10px; border: 1px solid #d8d8e0; border-radius: 8px; font-size: 13px; background: #fff;
  }
  .filters .count { font-size: 12px; color: #7a7a86; margin-left: auto; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; color: #7a7a86; border-bottom: 2px solid #eceef4; cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--nice-blue); }
  thead th.sorted { color: var(--nice-blue); }
  tbody td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #f1f1f5; vertical-align: middle; }
  tbody tr.deal-row:hover { background: #f8faff; }
  tbody tr.deal-row td.indent { padding-left: 28px; }
  a.opp-link { color: var(--nice-blue); text-decoration: none; font-weight: 500; }
  a.opp-link:hover { text-decoration: underline; }

  tr.account-header { background: #f0f3fa; cursor: pointer; }
  tr.account-header:hover { background: #e6ecf9; }
  tr.account-header td { font-weight: 600; font-size: 13px; padding: 10px 12px; }
  tr.account-header .acct-name { display: flex; align-items: center; gap: 8px; }
  tr.account-header .caret { display: inline-block; transition: transform 0.15s; font-size: 10px; color: #7a7a86; }
  tr.account-header.collapsed .caret { transform: rotate(-90deg); }
  tr.account-header .deal-count { font-weight: 400; color: #7a7a86; font-size: 12px; }
  tr.account-header .acct-acv { font-weight: 700; }

  .stage-badge {
    display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .stage-blue { background: #e8f2ff; color: #1a6fd6; }
  .stage-yellow { background: #fff6dd; color: #9a7b00; }
  .stage-purple { background: #f0e6ff; color: var(--nice-indigo); }
  .stage-green { background: #e3f9ef; color: #12875a; }

  .type-pill {
    display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px;
    font-weight: 600; color: #fff; margin-right: 4px; white-space: nowrap;
  }
  .type-amc { background: var(--amc-color); }
  .type-ticketing { background: #1cae9b; }
  .type-generic { background: var(--generic-color); }
  .type-smartreach { background: var(--smartreach-color); }
  .type-none { color: #a8a8b4; font-size: 13px; }

  .fedramp-badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px;
    font-weight: 700; color: #fff; background: var(--nice-indigo); margin-left: 6px; vertical-align: middle;
  }

  .acv-cell { font-weight: 600; }
  .acv-sub { display: block; font-size: 11px; color: #9a9aa6; font-weight: 400; }

  .sidebar-panel {
    background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid #eceef4;
  }
  .sidebar-panel h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: #7a7a86; }
  .sidebar-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 1px solid #f4f4f8; }
  .sidebar-row:last-child { border-bottom: none; }
  .sidebar-row .name { color: var(--nice-charcoal); }
  .sidebar-row .metric { color: #7a7a86; font-size: 12px; text-align: right; }
  .sidebar-row .metric .count-n { font-weight: 700; color: var(--nice-charcoal); }
</style>
</head>
<body>

<div id="pwOverlay">
  <div id="pwCard">
    <div class="brand-bar"></div>
    <h2>eHub Offline Dashboard</h2>
    <p>Enter password to continue</p>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <button id="pwBtn">Access Dashboard</button>
    <div id="pwError"></div>
  </div>
</div>

<div id="app">
  <div class="header">
    <h1>eHub Offline Dashboard</h1>
    <p>Engagement Hub Offline &middot; open opportunities (excl. Closed) &middot; Salesforce CPQ SKU 1464-3063</p>
    <p class="note">ACV shown in USD (corporate currency)</p>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="layout">
    <div class="main">
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search opportunity, account, owner...">
        <select id="typeFilter"><option value="">All Types</option></select>
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <span class="count" id="resultCount"></span>
      </div>
      <table id="dealTable">
        <thead>
          <tr>
            <th data-key="name">Opportunity</th>
            <th data-key="account">Account</th>
            <th data-key="typeStr">Type</th>
            <th data-key="stageNum">Stage</th>
            <th data-key="closeDate">Close Date</th>
            <th data-key="usdACV">ACV</th>
            <th data-key="region">Region / Territory</th>
            <th data-key="owner">Owner</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="sidebar" id="sidebar"></div>
  </div>
</div>

const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";
const TYPE_ORDER = ["AMC","Ticketing","Generic","SmartReach"];
const TYPE_CLASS = {AMC:"type-amc", Ticketing:"type-ticketing", Generic:"type-generic", SmartReach:"type-smartreach"};

let sortKey = null;
let sortDir = 1; // 1 asc, -1 desc
let collapsedAccounts = new Set();

function fmtUSD(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtNative(n, cur) {
  return n.toLocaleString('en-US', {maximumFractionDigits:0}) + ' ' + cur;
}

function renderStats(filtered) {
  const totalACV = filtered.reduce((s,d)=>s+d.usdACV,0);
  const accounts = new Set(filtered.map(d=>d.account));
  const fedrampCount = filtered.filter(d=>d.fedramp).length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-tile"><div class="label">Open Deals</div><div class="value">${filtered.length}</div></div>
    <div class="stat-tile"><div class="label">Accounts</div><div class="value">${accounts.size}</div></div>
    <div class="stat-tile"><div class="label">Total Pipeline ACV (USD)</div><div class="value">${fmtUSD(totalACV)}</div></div>
    <div class="stat-tile"><div class="label">FedRAMP</div><div class="value">${fedrampCount}</div></div>
  `;
}

function renderSidebar(filtered) {
  // By Stage
  const stageMap = {};
  filtered.forEach(d => {
    const key = d.stageLabel;
    if (!stageMap[key]) stageMap[key] = {count:0, acv:0, order: d.stageNum};
    stageMap[key].count++;
    stageMap[key].acv += d.usdACV;
  });
  const stageRows = Object.entries(stageMap).sort((a,b)=> (a[1].order||'').localeCompare(b[1].order||''))
    .map(([label, v]) => `<div class="sidebar-row"><span class="name">${label}</span><span class="metric"><span class="count-n">${v.count}</span> &middot; ${fmtUSD(v.acv)}</span></div>`).join('');

  // By Type
  const typeMap = {};
  TYPE_ORDER.forEach(t => typeMap[t] = {count:0, acv:0});
  typeMap['None'] = {count:0, acv:0};
  filtered.forEach(d => {
    if (d.types.length === 0) {
      typeMap['None'].count++;
      typeMap['None'].acv += d.usdACV;
    } else {
      d.types.forEach(t => {
        typeMap[t].count++;
        typeMap[t].acv += d.usdACV;
      });
    }
  });
  const typeRows = [...TYPE_ORDER, 'None'].map(t => {
    const v = typeMap[t];
    return `<div class="sidebar-row"><span class="name">${t}</span><span class="metric"><span class="count-n">${v.count}</span> &middot; ${fmtUSD(v.acv)}</span></div>`;
  }).join('');

  // By Region
  const regionMap = {};
  filtered.forEach(d => {
    const key = d.regionRaw || 'Unspecified';
    regionMap[key] = (regionMap[key]||0) + 1;
  });
  const regionRows = Object.entries(regionMap).sort((a,b)=>b[1]-a[1])
    .map(([r,c]) => `<div class="sidebar-row"><span class="name">${r}</span><span class="metric"><span class="count-n">${c}</span></span></div>`).join('');

  document.getElementById('sidebar').innerHTML = `
    <div class="sidebar-panel"><h3>By Stage</h3>${stageRows}</div>
    <div class="sidebar-panel"><h3>By Type</h3>${typeRows}</div>
    <div class="sidebar-panel"><h3>By Region</h3>${regionRows}</div>
  `;
}

function typePillsHtml(types) {
  if (!types || types.length === 0) return '<span class="type-none">—</span>';
  return types.map(t => `<span class="type-pill ${TYPE_CLASS[t]}">${t}</span>`).join('');
}

function dealRowHtml(d, showAccount, indent) {
  const acvSub = d.currency !== 'USD' ? `<span class="acv-sub">${fmtNative(d.nativeACV, d.currency)}</span>` : '';
  const fedrampBadge = d.fedramp ? '<span class="fedramp-badge">FedRAMP</span>' : '';
  return `<tr class="deal-row">
    <td class="${indent?'indent':''}"><a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank" rel="noopener">${d.name}</a></td>
    <td>${showAccount ? d.account : ''}</td>
    <td>${typePillsHtml(d.types)}</td>
    <td><span class="stage-badge stage-${d.stageClass}">${d.stageLabel}</span></td>
    <td>${d.closeDate}</td>
    <td class="acv-cell">${fmtUSD(d.usdACV)}${acvSub}</td>
    <td>${d.region}</td>
    <td>${d.owner}${fedrampBadge}</td>
  </tr>`;
}

function renderTable(filtered) {
  const tbody = document.getElementById('tableBody');
  if (sortKey) {
    const sorted = [...filtered].sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });
    tbody.innerHTML = sorted.map(d => dealRowHtml(d, true, false)).join('');
  } else {
    // group by account, sorted by total ACV desc
    const groups = {};
    filtered.forEach(d => {
      if (!groups[d.account]) groups[d.account] = [];
      groups[d.account].push(d);
    });
    const accountList = Object.entries(groups).map(([acct, deals]) => {
      const total = deals.reduce((s,d)=>s+d.usdACV,0);
      return {acct, deals, total};
    }).sort((a,b) => b.total - a.total);

    let html = '';
    accountList.forEach(({acct, deals, total}) => {
      const sortedDeals = [...deals].sort((a,b) => a.closeDate.localeCompare(b.closeDate));
      const collapsed = collapsedAccounts.has(acct);
      html += `<tr class="account-header ${collapsed?'collapsed':''}" data-acct="${encodeURIComponent(acct)}">
        <td colspan="5"><span class="acct-name"><span class="caret">&#9660;</span>${acct} <span class="deal-count">(${deals.length} deal${deals.length!==1?'s':''})</span></span></td>
        <td class="acct-acv">${fmtUSD(total)}</td>
        <td colspan="2"></td>
      </tr>`;
      if (!collapsed) {
        sortedDeals.forEach(d => { html += dealRowHtml(d, false, true); });
      }
    });
    tbody.innerHTML = html;

    tbody.querySelectorAll('tr.account-header').forEach(row => {
      row.addEventListener('click', () => {
        const acct = decodeURIComponent(row.getAttribute('data-acct'));
        if (collapsedAccounts.has(acct)) collapsedAccounts.delete(acct);
        else collapsedAccounts.add(acct);
        renderTable(getFiltered());
      });
    });
  }
}

function getFiltered() {
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  const typeF = document.getElementById('typeFilter').value;
  const stageF = document.getElementById('stageFilter').value;
  const regionF = document.getElementById('regionFilter').value;
  return DATA.filter(d => {
    if (q) {
      const hay = (d.name + ' ' + d.account + ' ' + d.owner).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (typeF && !d.types.includes(typeF)) return false;
    if (stageF && d.stageLabel !== stageF) return false;
    if (regionF && d.regionRaw !== regionF) return false;
    return true;
  });
}

function updateAll() {
  const filtered = getFiltered();
  renderStats(filtered);
  renderSidebar(filtered);
  renderTable(filtered);
  const accounts = new Set(filtered.map(d=>d.account));
  document.getElementById('resultCount').textContent = `${filtered.length} deals · ${accounts.size} accounts`;
}

function populateFilters() {
  const typeSel = document.getElementById('typeFilter');
  TYPE_ORDER.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSel.appendChild(opt);
  });

  const stages = [...new Set(DATA.map(d=>d.stageLabel))].sort((a,b)=>a.localeCompare(b));
  const stageSel = document.getElementById('stageFilter');
  stages.sort((a,b) => (a.match(/^\d+/)||[''])[0].localeCompare((b.match(/^\d+/)||[''])[0]));
  stages.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    stageSel.appendChild(opt);
  });

  const regions = [...new Set(DATA.map(d=>d.regionRaw).filter(r=>r))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });
}

function setupSorting() {
  document.querySelectorAll('#dealTable thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-key');
      if (sortKey !== key) {
        sortKey = key; sortDir = 1;
      } else if (sortDir === 1) {
        sortDir = -1;
      } else {
        sortKey = null; sortDir = 1;
      }
      document.querySelectorAll('#dealTable thead th').forEach(t => { t.classList.remove('sorted'); t.innerHTML = t.textContent.replace(/ [▲▼]$/,''); });
      if (sortKey) {
        th.classList.add('sorted');
        th.innerHTML = th.textContent + (sortDir === 1 ? ' ▲' : ' ▼');
      }
      updateAll();
    });
  });
}

function init() {
  populateFilters();
  setupSorting();
  document.getElementById('searchBox').addEventListener('input', updateAll);
  document.getElementById('typeFilter').addEventListener('change', updateAll);
  document.getElementById('stageFilter').addEventListener('change', updateAll);
  document.getElementById('regionFilter').addEventListener('change', updateAll);
  updateAll();
}

// Password gate
const STORED_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";
async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const hash = await sha256Hex(val);
  if (hash === STORED_HASH) {
    sessionStorage.setItem('ehubOfflineAuthed', '1');
    document.getElementById('pwOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pwError').textContent = 'Incorrect password.';
  }
}
document.getElementById('pwBtn').addEventListener('click', checkPw);
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

if (sessionStorage.getItem('ehubOfflineAuthed') === '1') {
  document.getElementById('pwOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  init();
}
</script>
</body>
</html>
