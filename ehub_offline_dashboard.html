<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Offline Dashboard</title>
<style>
  :root {
    --blue: #3694fc;
    --charcoal: #21212b;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
    --purple: #8a3ffc;
    --green: #1fb37a;
    --yellow: #f5a623;
    --bg: #f4f6fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--charcoal);
  }

  /* Password gate */
  #gate {
    position: fixed; inset: 0; background: var(--charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 14px; padding: 40px 36px; width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4); text-align: center;
  }
  #gate .logo { font-weight: 800; font-size: 22px; color: var(--blue); margin-bottom: 4px; letter-spacing: 0.5px; }
  #gate .sub { color: #777; font-size: 13px; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #ddd;
    font-size: 14px; margin-bottom: 14px; outline: none;
  }
  #gate input:focus { border-color: var(--blue); }
  #gate button {
    width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: var(--blue); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #gate button:hover { background: var(--indigo); }
  #gate .err { color: var(--coral); font-size: 12px; margin-top: 10px; min-height: 14px; }

  #app { display: none; }

  header.top {
    background: var(--charcoal); color: #fff; padding: 22px 32px;
  }
  header.top h1 { margin: 0 0 4px; font-size: 22px; }
  header.top p { margin: 0; color: #b7bac4; font-size: 13px; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    padding: 20px 32px 0;
  }
  .stat {
    background: #fff; border-radius: 10px; padding: 16px 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat .label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .stat .value { font-size: 24px; font-weight: 700; color: var(--charcoal); }

  .layout {
    display: grid; grid-template-columns: 1fr 280px; gap: 20px;
    padding: 20px 32px 40px; align-items: start;
  }

  .panel {
    background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    padding: 18px 20px;
  }

  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center;
  }
  .filters input, .filters select {
    padding: 8px 10px; border-radius: 7px; border: 1px solid #ddd; font-size: 13px;
  }
  .filters input { flex: 1; min-width: 160px; }
  .count-badge { font-size: 12px; color: #666; margin-left: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
  th .arrow { font-size: 10px; margin-left: 3px; color: var(--blue); }
  tr.account-header td {
    background: #eef3fc; font-weight: 700; cursor: pointer;
  }
  tr.account-header:hover td { background: #e2ecfa; }
  tr.deal-row td.name-cell { padding-left: 24px; }
  tr.deal-row a { color: var(--blue); text-decoration: none; }
  tr.deal-row a:hover { text-decoration: underline; }
  .native-sub { display: block; font-size: 10px; color: #999; }

  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px;
    font-weight: 600; color: #fff; margin-right: 4px; margin-bottom: 2px;
  }
  .pill-AMC { background: var(--indigo); }
  .pill-Ticketing { background: var(--coral); }
  .pill-Generic { background: #888; }
  .pill-SmartReach { background: var(--teal); color: #21212b; }
  .pill-none { color: #aaa; font-size: 12px; }

  .badge-fedramp {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px;
    font-weight: 700; color: #fff; background: var(--purple); margin-left: 6px;
  }

  .stage-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap;
  }
  .stage-0, .stage-1 { background: var(--blue); }
  .stage-2, .stage-3 { background: var(--yellow); color: #3a2c00; }
  .stage-4 { background: var(--purple); }
  .stage-5 { background: var(--green); }
  .stage-other { background: #999; }

  .sidebar h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.4px; color: #888; margin: 0 0 10px; }
  .side-panel { margin-bottom: 22px; }
  .side-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
  .side-row .k { color: var(--charcoal); }
  .side-row .v { color: #666; font-variant-numeric: tabular-nums; }

  .collapse-icon { display: inline-block; width: 12px; transition: transform 0.15s; }
  .collapsed .collapse-icon { transform: rotate(-90deg); }
  tr.deal-row.hidden-row { display: none; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <div class="sub">eHub Offline Dashboard</div>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>eHub Offline Dashboard</h1>
    <p>Engagement Hub Offline &middot; open opportunities (excl. Closed) &middot; Salesforce CPQ &middot; SKU 1464-3063. ACV shown in USD (corporate currency).</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="label">Open Deals</div><div class="value" id="statDeals">0</div></div>
    <div class="stat"><div class="label">Accounts</div><div class="value" id="statAccounts">0</div></div>
    <div class="stat"><div class="label">Total Pipeline ACV (USD)</div><div class="value" id="statACV">$0</div></div>
    <div class="stat"><div class="label">FedRAMP</div><div class="value" id="statFedramp">0</div></div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search opportunity, account, owner...">
        <select id="typeFilter"><option value="">All Types</option></select>
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <span class="count-badge" id="countBadge"></span>
      </div>
      <table>
        <thead>
          <tr id="headerRow"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="sidebar">
      <div class="panel side-panel">
        <h3>By Stage</h3>
        <div id="byStage"></div>
      </div>
      <div class="panel side-panel">
        <h3>By Type</h3>
        <div id="byType"></div>
      </div>
      <div class="panel side-panel">
        <h3>By Region</h3>
        <div id="byRegion"></div>
      </div>
    </div>
  </div>
</div>

<script>
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const hash = await sha256Hex(val);
  if (hash === "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621") {
    sessionStorage.setItem('ehub_offline_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}
document.getElementById('pwBtn').addEventListener('click', checkPw);
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
if (sessionStorage.getItem('ehub_offline_auth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.addEventListener('DOMContentLoaded', init);
}

tageNum": "5", "stageLabel": "Proposal / Negotiation", "stageFull": "5 - Proposal / Negotiation", "closeDate": "2026-09-30", "usdACV": 36000, "nativeACV": 36000, "currency": "USD", "region": "Americas / Enterprise West", "owner": "Vanessa Crook", "fedramp": false}];
const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";
const TYPE_ORDER = ["AMC","Ticketing","Generic","SmartReach"];
const STAGE_ORDER = ["0","1","2","3","4","5"];

const COLUMNS = [
  {key:'name', label:'Opportunity'},
  {key:'account', label:'Account'},
  {key:'type', label:'Type'},
  {key:'stageFull', label:'Stage'},
  {key:'closeDate', label:'Close Date'},
  {key:'usdACV', label:'ACV'},
  {key:'region', label:'Region / Territory'},
  {key:'owner', label:'Owner'},
];

let sortState = { key: null, dir: 0 }; // dir: 0 none, 1 asc, -1 desc
let collapsedAccounts = new Set();

function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function fmtUSD(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}
function stageBadge(d) {
  const num = d.stageNum;
  const cls = num === null ? 'stage-other' : (num <= 1 ? 'stage-0' : num <= 3 ? 'stage-2' : num == '4' ? 'stage-4' : 'stage-5');
  const label = num !== null ? `${num} &middot; ${d.stageLabel}` : d.stageFull;
  return `<span class="stage-badge ${cls}">${label}</span>`;
}
function typePills(typeStr) {
  if (typeStr === '—' || !typeStr) return '<span class="pill-none">—</span>';
  return typeStr.split(', ').map(t => `<span class="pill pill-${t}">${t}</span>`).join('');
}
function accountKey(d) { return d.topParent || d.account; }

function getFiltered() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const typeF = document.getElementById('typeFilter').value;
  const stageF = document.getElementById('stageFilter').value;
  const regionF = document.getElementById('regionFilter').value;
  return DEALS.filter(d => {
    if (q) {
      const hay = (d.name + ' ' + d.account + ' ' + d.owner).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (typeF) {
      const types = d.type === '—' ? [] : d.type.split(', ');
      if (!types.includes(typeF)) return false;
    }
    if (stageF && d.stageFull !== stageF) return false;
    if (regionF && d.region !== regionF) return false;
    return true;
  });
}

function renderHeader() {
  const tr = document.getElementById('headerRow');
  tr.innerHTML = '';
  COLUMNS.forEach(col => {
    const th = document.createElement('th');
    let arrow = '';
    if (sortState.key === col.key) arrow = `<span class="arrow">${sortState.dir === 1 ? '▲' : '▼'}</span>`;
    th.innerHTML = col.label + arrow;
    th.addEventListener('click', () => {
      if (sortState.key !== col.key) { sortState.key = col.key; sortState.dir = 1; }
      else if (sortState.dir === 1) { sortState.dir = -1; }
      else { sortState.key = null; sortState.dir = 0; }
      render();
    });
    tr.appendChild(th);
  });
}

function sortDeals(deals) {
  if (!sortState.key) return deals;
  const key = sortState.key;
  const dir = sortState.dir;
  return [...deals].sort((a,b) => {
    let av = a[key], bv = b[key];
    if (key === 'usdACV') { av = a.usdACV; bv = b.usdACV; }
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}

function render() {
  renderHeader();
  const filtered = getFiltered();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  const accountsInScope = new Set(filtered.map(accountKey));
  document.getElementById('countBadge').textContent = `${filtered.length} deals · ${accountsInScope.size} accounts`;

  if (sortState.key) {
    // flat sorted list
    const sorted = sortDeals(filtered);
    sorted.forEach(d => tbody.appendChild(dealRow(d, true)));
  } else {
    // grouped by account, sorted by total ACV desc
    const groups = {};
    filtered.forEach(d => {
      const k = accountKey(d);
      if (!groups[k]) groups[k] = [];
      groups[k].push(d);
    });
    const groupList = Object.entries(groups).map(([k, arr]) => ({
      key: k,
      deals: arr.sort((a,b) => a.closeDate.localeCompare(b.closeDate)),
      total: arr.reduce((s,d) => s + d.usdACV, 0)
    })).sort((a,b) => b.total - a.total);

    groupList.forEach(g => {
      const headerTr = document.createElement('tr');
      headerTr.className = 'account-header' + (collapsedAccounts.has(g.key) ? ' collapsed' : '');
      headerTr.innerHTML = `
        <td colspan="5"><span class="collapse-icon">▾</span> ${g.key} <span style="font-weight:400;color:#777;">(${g.deals.length} deal${g.deals.length>1?'s':''})</span></td>
        <td>${fmtUSD(g.total)}</td>
        <td colspan="2"></td>
      `;
      headerTr.addEventListener('click', () => {
        if (collapsedAccounts.has(g.key)) collapsedAccounts.delete(g.key);
        else collapsedAccounts.add(g.key);
        render();
      });
      tbody.appendChild(headerTr);
      if (!collapsedAccounts.has(g.key)) {
        g.deals.forEach(d => tbody.appendChild(dealRow(d, false)));
      }
    });
  }

  renderStats(filtered);
  renderSidebar(filtered);
}

function dealRow(d, showAccount) {
  const tr = document.createElement('tr');
  tr.className = 'deal-row';
  const nativeSub = d.currency !== 'USD' ? `<span class="native-sub">${d.nativeACV.toLocaleString('en-US')} ${d.currency}</span>` : '';
  tr.innerHTML = `
    <td class="name-cell"><a href="${SF_BASE}${d.id}/view" target="_blank">${d.name}</a></td>
    <td>${showAccount ? d.account : ''}</td>
    <td>${typePills(d.type)}</td>
    <td>${stageBadge(d)}</td>
    <td>${fmtDate(d.closeDate)}</td>
    <td>${fmtUSD(d.usdACV)}${nativeSub}</td>
    <td>${d.region}</td>
    <td>${d.owner}${d.fedramp ? '<span class="badge-fedramp">FedRAMP</span>' : ''}</td>
  `;
  return tr;
}

function renderStats(filtered) {
  document.getElementById('statDeals').textContent = filtered.length;
  document.getElementById('statAccounts').textContent = new Set(filtered.map(accountKey)).size;
  document.getElementById('statACV').textContent = fmtUSD(filtered.reduce((s,d)=>s+d.usdACV,0));
  document.getElementById('statFedramp').textContent = filtered.filter(d=>d.fedramp).length;
}

function renderSidebar(filtered) {
  // By Stage
  const stageMap = {};
  filtered.forEach(d => {
    const k = d.stageFull;
    if (!stageMap[k]) stageMap[k] = {count:0, acv:0, num:d.stageNum};
    stageMap[k].count++; stageMap[k].acv += d.usdACV;
  });
  const stageEntries = Object.entries(stageMap).sort((a,b) => {
    const an = a[1].num === null ? 99 : parseInt(a[1].num);
    const bn = b[1].num === null ? 99 : parseInt(b[1].num);
    return an - bn;
  });
  document.getElementById('byStage').innerHTML = stageEntries.map(([k,v]) =>
    `<div class="side-row"><span class="k">${k}</span><span class="v">${v.count} · ${fmtUSD(v.acv)}</span></div>`
  ).join('') || '<div class="side-row"><span class="k">No data</span></div>';

  // By Type
  const typeMap = {};
  TYPE_ORDER.forEach(t => typeMap[t] = {count:0, acv:0});
  typeMap['None'] = {count:0, acv:0};
  filtered.forEach(d => {
    if (d.type === '—') { typeMap['None'].count++; typeMap['None'].acv += d.usdACV; }
    else d.type.split(', ').forEach(t => { typeMap[t].count++; typeMap[t].acv += d.usdACV; });
  });
  document.getElementById('byType').innerHTML = [...TYPE_ORDER, 'None'].map(t =>
    `<div class="side-row"><span class="k">${t}</span><span class="v">${typeMap[t].count} · ${fmtUSD(typeMap[t].acv)}</span></div>`
  ).join('');

  // By Region
  const regionMap = {};
  filtered.forEach(d => { regionMap[d.region] = (regionMap[d.region]||0) + 1; });
  const regionEntries = Object.entries(regionMap).sort((a,b) => b[1]-a[1]);
  document.getElementById('byRegion').innerHTML = regionEntries.map(([k,v]) =>
    `<div class="side-row"><span class="k">${k}</span><span class="v">${v}</span></div>`
  ).join('') || '<div class="side-row"><span class="k">No data</span></div>';
}

function populateFilterOptions() {
  const typeSel = document.getElementById('typeFilter');
  TYPE_ORDER.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSel.appendChild(opt);
  });

  const stages = [...new Set(DEALS.map(d => d.stageFull))].sort((a,b) => {
    const an = DEALS.find(d=>d.stageFull===a).stageNum;
    const bn = DEALS.find(d=>d.stageFull===b).stageNum;
    const ann = an === null ? 99 : parseInt(an);
    const bnn = bn === null ? 99 : parseInt(bn);
    return ann - bnn;
  });
  const stageSel = document.getElementById('stageFilter');
  stages.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    stageSel.appendChild(opt);
  });

  const regions = [...new Set(DEALS.map(d => d.region))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });
}

function init() {
  populateFilterOptions();
  ['searchBox','typeFilter','stageFilter','regionFilter'].forEach(id => {
    document.getElementById(id).addEventListener('input', render);
    document.getElementById(id).addEventListener('change', render);
  });
  render();
}
</script>
