<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Offline Dashboard</title>
<style>
  :root {
    --nice-blue: #3694fc;
    --nice-charcoal: #21212b;
    --nice-indigo: #6100FF;
    --nice-teal: #36EAD0;
    --nice-coral: #FF5B8A;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --border: #e2e5ec;
    --text: #21212b;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Password gate */
  #gate {
    position: fixed; inset: 0; background: var(--nice-charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 40px 36px; width: 340px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #gate .logo { font-weight: 800; font-size: 22px; color: var(--nice-blue); margin-bottom: 4px; letter-spacing: 0.5px; }
  #gate .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: none;
    background: var(--nice-blue); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #gate button:hover { background: #2a7fe0; }
  #gate .err { color: var(--nice-coral); font-size: 12px; margin-top: 8px; min-height: 16px; }

  #app { display: none; max-width: 1400px; margin: 0 auto; padding: 24px; }

  header.top { margin-bottom: 20px; }
  header.top h1 { margin: 0 0 4px; font-size: 26px; color: var(--nice-charcoal); }
  header.top .subtitle { color: var(--text-muted); font-size: 13.5px; line-height: 1.5; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat-tile {
    background: var(--card-bg); border-radius: 10px; padding: 16px 18px; border: 1px solid var(--border);
  }
  .stat-tile .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .stat-tile .value { font-size: 24px; font-weight: 700; color: var(--nice-charcoal); }

  .layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; }

  .filters {
    display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
  }
  .filters input[type=text] {
    flex: 1; min-width: 200px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13.5px;
  }
  .filters select {
    padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13.5px; background: #fff;
  }
  .result-count { font-size: 12.5px; color: var(--text-muted); margin-bottom: 10px; }

  table.dash-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  table.dash-table th, table.dash-table td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
  table.dash-table th {
    background: #f8f9fc; font-weight: 600; color: var(--nice-charcoal); cursor: pointer; user-select: none;
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.3px; white-space: nowrap;
  }
  table.dash-table th:hover { background: #eef1f8; }
  table.dash-table th .arrow { font-size: 10px; margin-left: 4px; color: var(--nice-blue); }
  table.dash-table tbody tr.deal-row:hover { background: #f8faff; }
  table.dash-table tbody tr.deal-row td.opp-cell a { color: var(--nice-blue); text-decoration: none; font-weight: 500; }
  table.dash-table tbody tr.deal-row td.opp-cell a:hover { text-decoration: underline; }
  table.dash-table tbody tr.deal-row.indented td.opp-cell { padding-left: 28px; }

  tr.account-header { background: #eef3fd; cursor: pointer; }
  tr.account-header:hover { background: #e3ecfb; }
  tr.account-header td { font-weight: 700; color: var(--nice-charcoal); padding: 11px 12px; }
  tr.account-header .acct-name { display: flex; align-items: center; gap: 8px; }
  tr.account-header .caret { display: inline-block; transition: transform 0.15s ease; font-size: 11px; color: var(--nice-blue); }
  tr.account-header.collapsed .caret { transform: rotate(-90deg); }
  tr.account-header .deal-count { font-weight: 500; color: var(--text-muted); font-size: 12px; }

  .native-sub { display: block; font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 100px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .stage-0, .stage-1 { background: #dbeafe; color: #1d4ed8; }
  .stage-2, .stage-3 { background: #fef3c7; color: #92400e; }
  .stage-4 { background: #ede9fe; color: #6100FF; }
  .stage-5 { background: #d1fae5; color: #065f46; }
  .stage-none { background: #e5e7eb; color: #374151; }

  .fedramp-badge {
    display: inline-block; margin-left: 6px; padding: 3px 8px; border-radius: 100px;
    background: #ede9fe; color: #6100FF; font-size: 10.5px; font-weight: 700; letter-spacing: 0.3px;
  }

  .type-pill { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 10.5px; font-weight: 700; margin-right: 4px; margin-bottom: 2px; color: #fff; white-space: nowrap; }
  .type-AMC { background: #3694fc; }
  .type-Ticketing { background: #0d9488; }
  .type-Generic { background: #6b7280; }
  .type-SmartReach { background: #FF5B8A; }
  .type-none { color: var(--text-muted); font-size: 13px; }

  .sidebar { display: flex; flex-direction: column; gap: 14px; }
  .side-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .side-card h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); }
  .side-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; }
  .side-row:last-child { border-bottom: none; }
  .side-row .side-label { display: flex; align-items: center; gap: 6px; }
  .side-row .side-count { color: var(--text-muted); }
  .side-row .side-acv { font-weight: 600; color: var(--nice-charcoal); }

  .empty-state { padding: 40px; text-align: center; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <div class="sub">eHub Offline Dashboard</div>
    <input type="password" id="pw-input" placeholder="Enter password" autocomplete="off">
    <button id="pw-btn">Access Dashboard</button>
    <div class="err" id="pw-err"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>eHub Offline Dashboard</h1>
    <div class="subtitle">
      Engagement Hub Offline &mdash; open opportunities (excl. Closed) &middot; sourced from Salesforce CPQ, SKU 1464-3063.<br>
      ACV shown in USD (corporate currency).
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="layout">
    <div class="main-col">
      <div class="filters">
        <input type="text" id="search" placeholder="Search opportunity, account, owner...">
        <select id="filter-type"><option value="">All Types</option></select>
        <select id="filter-stage"><option value="">All Stages</option></select>
        <select id="filter-region"><option value="">All Regions</option></select>
      </div>
      <div class="result-count" id="result-count"></div>
      <table class="dash-table">
        <thead>
          <tr id="table-head"></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div class="sidebar">
      <div class="side-card">
        <h3>By Stage</h3>
        <div id="side-stage"></div>
      </div>
      <div class="side-card">
        <h3>By Type</h3>
        <div id="side-type"></div>
      </div>
      <div class="side-card">
        <h3>By Region</h3>
        <div id="side-region"></div>
      </div>
    </div>
  </div>
</div>

const STORED_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

// ---------- Password gate ----------
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pw-input').value;
  const hash = await sha256Hex(val);
  if (hash === STORED_HASH) {
    sessionStorage.setItem('ehub_offline_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('pw-err').textContent = 'Incorrect password.';
  }
}

document.getElementById('pw-btn').addEventListener('click', checkPw);
document.getElementById('pw-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPw(); });

if (sessionStorage.getItem('ehub_offline_auth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initDashboard();
}

// ---------- Dashboard logic ----------
let sortState = { col: null, dir: null }; // dir: 'asc' | 'desc' | null

const COLUMNS = [
  { key: 'name', label: 'Opportunity' },
  { key: 'account', label: 'Account' },
  { key: 'type', label: 'Type' },
  { key: 'stageNum', label: 'Stage' },
  { key: 'closeDate', label: 'Close Date' },
  { key: 'usdACV', label: 'ACV' },
  { key: 'region', label: 'Region / Territory' },
  { key: 'owner', label: 'Owner' },
];

function fmtUSD(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtNative(n, cur) {
  return n.toLocaleString('en-US', {maximumFractionDigits: 0}) + ' ' + cur;
}
function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
function stageClass(num) {
  if (num === null || num === undefined) return 'stage-none';
  return 'stage-' + num;
}
function stageBadge(d) {
  const cls = stageClass(d.stageNum);
  const numPart = (d.stageNum === null || d.stageNum === undefined) ? '' : (d.stageNum + ' · ');
  return `<span class="badge ${cls}">${numPart}${d.stageLabel}</span>`;
}
function typePills(d) {
  if (!d.typeList || d.typeList.length === 0) return '<span class="type-none">&mdash;</span>';
  return d.typeList.map(t => `<span class="type-pill type-${t}">${t}</span>`).join('');
}
function acvCell(d) {
  let html = fmtUSD(d.usdACV);
  if (d.currency !== 'USD') {
    html += `<span class="native-sub">${fmtNative(d.nativeACV, d.currency)}</span>`;
  }
  return html;
}
function oppLink(d) {
  return `<a href="${SF_BASE}${d.id}/view" target="_blank" rel="noopener">${d.name}</a>`;
}

function getFilters() {
  return {
    search: document.getElementById('search').value.trim().toLowerCase(),
    type: document.getElementById('filter-type').value,
    stage: document.getElementById('filter-stage').value,
    region: document.getElementById('filter-region').value,
  };
}

function applyFilters(deals) {
  const f = getFilters();
  return deals.filter(d => {
    if (f.search) {
      const hay = (d.name + ' ' + d.account + ' ' + d.groupAccount + ' ' + d.owner).toLowerCase();
      if (!hay.includes(f.search)) return false;
    }
    if (f.type && !(d.typeList || []).includes(f.type)) return false;
    if (f.stage && String(d.stageNum) !== f.stage) return false;
    if (f.region && d.region !== f.region) return false;
    return true;
  });
}

function renderHead() {
  const tr = document.getElementById('table-head');
  tr.innerHTML = COLUMNS.map(c => {
    let arrow = '';
    if (sortState.col === c.key) {
      arrow = `<span class="arrow">${sortState.dir === 'asc' ? '▲' : '▼'}</span>`;
    }
    return `<th data-col="${c.key}">${c.label}${arrow}</th>`;
  }).join('');
  tr.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.getAttribute('data-col');
      if (sortState.col !== col) {
        sortState = { col, dir: 'asc' };
      } else if (sortState.dir === 'asc') {
        sortState = { col, dir: 'desc' };
      } else {
        sortState = { col: null, dir: null };
      }
      render();
    });
  });
}

function sortValue(d, col) {
  if (col === 'type') return d.type === '—' ? '' : d.type;
  return d[col];
}

function renderFlatSorted(deals) {
  const col = sortState.col;
  const dir = sortState.dir;
  const sorted = [...deals].sort((a, b) => {
    let av = sortValue(a, col), bv = sortValue(b, col);
    if (av === null || av === undefined) av = '';
    if (bv === null || bv === undefined) bv = '';
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = sorted.map(d => `
    <tr class="deal-row">
      <td class="opp-cell">${oppLink(d)}</td>
      <td>${d.account}</td>
      <td>${typePills(d)}</td>
      <td>${stageBadge(d)}</td>
      <td>${fmtDate(d.closeDate)}</td>
      <td>${acvCell(d)}</td>
      <td>${d.region}</td>
      <td>${d.owner}${d.fedramp === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : ''}</td>
    </tr>
  `).join('');
}

function renderGrouped(deals) {
  const groups = {};
  deals.forEach(d => {
    const key = d.groupAccount;
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  const accountKeys = Object.keys(groups).sort((a, b) => {
    const totalA = groups[a].reduce((s, d) => s + d.usdACV, 0);
    const totalB = groups[b].reduce((s, d) => s + d.usdACV, 0);
    return totalB - totalA;
  });

  const tbody = document.getElementById('table-body');
  let html = '';
  accountKeys.forEach((acct, idx) => {
    const rows = groups[acct].slice().sort((a, b) => (a.closeDate < b.closeDate ? -1 : 1));
    const total = rows.reduce((s, d) => s + d.usdACV, 0);
    const groupId = 'grp-' + idx;
    html += `
      <tr class="account-header" data-target="${groupId}">
        <td colspan="5"><span class="acct-name"><span class="caret">▼</span>${acct} <span class="deal-count">(${rows.length} deal${rows.length !== 1 ? 's' : ''})</span></span></td>
        <td>${fmtUSD(total)}</td>
        <td colspan="2"></td>
      </tr>
    `;
    rows.forEach(d => {
      html += `
        <tr class="deal-row indented" data-group="${groupId}">
          <td class="opp-cell">${oppLink(d)}</td>
          <td></td>
          <td>${typePills(d)}</td>
          <td>${stageBadge(d)}</td>
          <td>${fmtDate(d.closeDate)}</td>
          <td>${acvCell(d)}</td>
          <td>${d.region}</td>
          <td>${d.owner}${d.fedramp === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : ''}</td>
        </tr>
      `;
    });
  });
  tbody.innerHTML = html || '';

  tbody.querySelectorAll('tr.account-header').forEach(header => {
    header.addEventListener('click', () => {
      const gid = header.getAttribute('data-target');
      header.classList.toggle('collapsed');
      tbody.querySelectorAll(`tr[data-group="${gid}"]`).forEach(r => {
        r.style.display = header.classList.contains('collapsed') ? 'none' : '';
      });
    });
  });

  return accountKeys.length;
}

function renderStats(deals) {
  const totalUSD = deals.reduce((s, d) => s + d.usdACV, 0);
  const accounts = new Set(deals.map(d => d.groupAccount));
  const fedrampCount = deals.filter(d => d.fedramp === 'Yes').length;
  const stats = [
    { label: 'Open Deals', value: deals.length },
    { label: 'Accounts', value: accounts.size },
    { label: 'Total Pipeline ACV (USD)', value: fmtUSD(totalUSD) },
    { label: 'FedRAMP', value: fedrampCount },
  ];
  document.getElementById('stats').innerHTML = stats.map(s => `
    <div class="stat-tile"><div class="label">${s.label}</div><div class="value">${s.value}</div></div>
  `).join('');
}

function renderSidebar(deals) {
  // By stage
  const stageMap = {};
  deals.forEach(d => {
    const key = (d.stageNum === null || d.stageNum === undefined) ? d.stageLabel : (d.stageNum + ' · ' + d.stageLabel);
    if (!stageMap[key]) stageMap[key] = { count: 0, acv: 0, num: d.stageNum };
    stageMap[key].count++;
    stageMap[key].acv += d.usdACV;
  });
  const stageKeys = Object.keys(stageMap).sort((a, b) => {
    const na = stageMap[a].num, nb = stageMap[b].num;
    if (na === null || na === undefined) return 1;
    if (nb === null || nb === undefined) return -1;
    return na - nb;
  });
  document.getElementById('side-stage').innerHTML = stageKeys.map(k => `
    <div class="side-row"><span class="side-label">${k}</span><span><span class="side-count">${stageMap[k].count}</span> &middot; <span class="side-acv">${fmtUSD(stageMap[k].acv)}</span></span></div>
  `).join('');

  // By type
  const typeMap = {};
  TYPE_ORDER.forEach(t => typeMap[t] = { count: 0, acv: 0 });
  typeMap['None'] = { count: 0, acv: 0 };
  deals.forEach(d => {
    if (!d.typeList || d.typeList.length === 0) {
      typeMap['None'].count++;
      typeMap['None'].acv += d.usdACV;
    } else {
      d.typeList.forEach(t => {
        typeMap[t].count++;
        typeMap[t].acv += d.usdACV;
      });
    }
  });
  const typeKeys = [...TYPE_ORDER, 'None'];
  document.getElementById('side-type').innerHTML = typeKeys.map(k => `
    <div class="side-row"><span class="side-label">${k}</span><span><span class="side-count">${typeMap[k].count}</span> &middot; <span class="side-acv">${fmtUSD(typeMap[k].acv)}</span></span></div>
  `).join('');

  // By region
  const regionMap = {};
  deals.forEach(d => {
    if (!regionMap[d.region]) regionMap[d.region] = 0;
    regionMap[d.region]++;
  });
  const regionKeys = Object.keys(regionMap).sort((a, b) => regionMap[b] - regionMap[a]);
  document.getElementById('side-region').innerHTML = regionKeys.map(k => `
    <div class="side-row"><span class="side-label">${k}</span><span class="side-count">${regionMap[k]}</span></div>
  `).join('');
}

function populateFilterOptions() {
  const typeSel = document.getElementById('filter-type');
  TYPE_ORDER.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    typeSel.appendChild(opt);
  });

  const stageSel = document.getElementById('filter-stage');
  const stages = [...new Map(DEALS.map(d => [d.stageNum, d.stageLabel])).entries()]
    .sort((a, b) => (a[0] === null ? 1 : b[0] === null ? -1 : a[0] - b[0]));
  stages.forEach(([num, label]) => {
    const opt = document.createElement('option');
    opt.value = String(num);
    opt.textContent = (num === null || num === undefined) ? label : `${num} · ${label}`;
    stageSel.appendChild(opt);
  });

  const regionSel = document.getElementById('filter-region');
  const regions = [...new Set(DEALS.map(d => d.region))].sort();
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });
}

function render() {
  renderHead();
  const filtered = applyFilters(DEALS);
  let accountCount;
  if (sortState.col) {
    renderFlatSorted(filtered);
    accountCount = new Set(filtered.map(d => d.groupAccount)).size;
  } else {
    accountCount = renderGrouped(filtered);
  }
  document.getElementById('result-count').textContent = `${filtered.length} deal${filtered.length !== 1 ? 's' : ''} · ${accountCount} account${accountCount !== 1 ? 's' : ''}`;
  if (filtered.length === 0) {
    document.getElementById('table-body').innerHTML = `<tr><td colspan="8" class="empty-state">No deals match the current filters.</td></tr>`;
  }
  renderStats(filtered);
  renderSidebar(filtered);
}

function initDashboard() {
  populateFilterOptions();
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('filter-type').addEventListener('change', render);
  document.getElementById('filter-stage').addEventListener('change', render);
  document.getElementById('filter-region').addEventListener('change', render);
  render();
}
</script>

</body>
</html>
