<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Offline Dashboard</title>
<style>
  :root {
    --blue: #3694fc;
    --charcoal: #21212b;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
    --purple: #8b3fe8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    background: #f4f6fb;
    color: var(--charcoal);
  }
  /* Password gate */
  #gate {
    position: fixed; inset: 0; background: var(--charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 40px 36px; width: 340px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  #gate h1 { font-size: 20px; margin: 0 0 4px; color: var(--charcoal); }
  #gate p { font-size: 13px; color: #666; margin: 0 0 20px; }
  #gate input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #ccc;
    font-size: 14px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: var(--blue); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #gate button:hover { background: var(--indigo); }
  #gate .err { color: var(--coral); font-size: 12px; height: 16px; margin-top: 6px; }
  #gate .logo { font-weight: 800; letter-spacing: 1px; color: var(--blue); font-size: 22px; margin-bottom: 6px; }

  #app { display: none; }
  header {
    background: var(--charcoal); color: #fff; padding: 24px 32px;
  }
  header h1 { margin: 0 0 4px; font-size: 24px; }
  header p { margin: 0; font-size: 13px; color: #b8bcc8; }
  header .note { color: var(--teal); font-size: 12px; margin-top: 4px; }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    padding: 20px 32px 0;
  }
  .stat {
    background: #fff; border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .stat .val { font-size: 26px; font-weight: 700; color: var(--charcoal); }
  .stat .lbl { font-size: 12px; color: #888; margin-top: 2px; }

  .main { display: grid; grid-template-columns: 1fr 280px; gap: 20px; padding: 20px 32px 40px; align-items: start; }

  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .filters input, .filters select {
    padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 13px;
  }
  .filters input { flex: 1; min-width: 180px; }
  .count { font-size: 12px; color: #777; margin-bottom: 10px; }

  table {
    width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px;
    overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  thead th {
    background: var(--charcoal); color: #fff; text-align: left; padding: 10px 12px;
    font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { background: #33333f; }
  tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #eee; vertical-align: middle; }
  tbody tr.deal-row:hover { background: #f8faff; }
  tbody tr.acct-row { background: #eef2fb; cursor: pointer; font-weight: 600; }
  tbody tr.acct-row:hover { background: #e2e9f9; }
  tbody tr.deal-row td.indent { padding-left: 28px; }
  a.opp-link { color: var(--blue); text-decoration: none; font-weight: 500; }
  a.opp-link:hover { text-decoration: underline; }

  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px;
    font-weight: 600; color: #fff; margin-right: 4px; white-space: nowrap;
  }
  .pill.AMC { background: var(--indigo); }
  .pill.Ticketing { background: var(--teal); color: #21212b; }
  .pill.Generic { background: #999; }
  .pill.SmartReach { background: var(--coral); }
  .muted-dash { color: #bbb; }

  .badge-stage {
    display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; color: #fff;
  }
  .stage-0, .stage-1 { background: var(--blue); }
  .stage-2, .stage-3 { background: #e0a92c; }
  .stage-4 { background: var(--indigo); }
  .stage-5 { background: #2eb872; }

  .fedramp-badge {
    display: inline-block; background: var(--purple); color: #fff; font-size: 10px;
    font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-left: 6px;
  }

  .acv-cell { font-weight: 700; }
  .acv-sub { display: block; font-size: 10px; color: #999; font-weight: 400; }

  .sidebar .panel {
    background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .sidebar h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: #666; }
  .sidebar .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
  .sidebar .row:last-child { border-bottom: none; }
  .sidebar .row .n { color: #888; }

  .sort-arrow { margin-left: 3px; }
  .collapse-icon { display: inline-block; width: 14px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <h1>eHub Offline Dashboard</h1>
    <p>Enter password to continue</p>
    <input type="password" id="pwInput" placeholder="Password" />
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>eHub Offline Dashboard</h1>
    <p>Engagement Hub Offline &middot; open opportunities (excl. Closed) &middot; sourced from Salesforce CPQ, SKU 1464-3063</p>
    <p class="note">ACV shown in USD (corporate currency)</p>
  </header>

  <div class="stats" id="statsBar"></div>

  <div class="main">
    <div>
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search opportunity, account, owner..." />
        <select id="typeFilter"><option value="">All Types</option></select>
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
      </div>
      <div class="count" id="countLine"></div>
      <table>
        <thead><tr id="headerRow"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="sidebar">
      <div class="panel">
        <h3>By Stage</h3>
        <div id="byStage"></div>
      </div>
      <div class="panel">
        <h3>By Type</h3>
        <div id="byType"></div>
      </div>
      <div class="panel">
        <h3>By Region</h3>
        <div id="byRegion"></div>
      </div>
    </div>
  </div>
</div>

const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";
const TYPE_ORDER = ["AMC","Ticketing","Generic","SmartReach"];
const STAGE_ORDER = ["0","1","2","3","4","5"];

function stageNum(stageLabel){
  const m = stageLabel.match(/^(\d+)/);
  return m ? m[1] : null;
}

function fmtUSD(v){
  return '$' + Math.round(v).toLocaleString('en-US');
}

// ---------- Password gate ----------
const STORED_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";
async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkPw(){
  const val = document.getElementById('pwInput').value;
  const hash = await sha256Hex(val);
  if (hash === STORED_HASH){
    sessionStorage.setItem('ehub_auth','1');
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password';
  }
}
document.getElementById('pwBtn').addEventListener('click', checkPw);
document.getElementById('pwInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPw(); });

if (sessionStorage.getItem('ehub_auth') === '1'){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  window.addEventListener('DOMContentLoaded', init);
} 

// ---------- App state ----------
let sortState = { col: null, dir: 0 }; // dir: 0=grouped,1=asc,2=desc
const COLUMNS = [
  {key:'name', label:'Opportunity'},
  {key:'account', label:'Account'},
  {key:'type', label:'Type'},
  {key:'stageLabel', label:'Stage'},
  {key:'closeDate', label:'Close Date'},
  {key:'usdACV', label:'ACV'},
  {key:'region', label:'Region / Territory'},
  {key:'owner', label:'Owner'},
];

function init(){
  populateFilters();
  renderHeader();
  attachFilterEvents();
  renderAll();
}

function populateFilters(){
  const typeSel = document.getElementById('typeFilter');
  TYPE_ORDER.forEach(t=>{
    const o = document.createElement('option'); o.value=t; o.textContent=t; typeSel.appendChild(o);
  });
  const stages = [...new Set(DEALS.map(d=>d.stageLabel))].sort();
  const stageSel = document.getElementById('stageFilter');
  stages.forEach(s=>{
    const o = document.createElement('option'); o.value=s; o.textContent=s; stageSel.appendChild(o);
  });
  const regions = [...new Set(DEALS.map(d=>d.region))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r=>{
    const o = document.createElement('option'); o.value=r; o.textContent=r; regionSel.appendChild(o);
  });
}

function attachFilterEvents(){
  document.getElementById('searchBox').addEventListener('input', renderAll);
  document.getElementById('typeFilter').addEventListener('change', renderAll);
  document.getElementById('stageFilter').addEventListener('change', renderAll);
  document.getElementById('regionFilter').addEventListener('change', renderAll);
}

function renderHeader(){
  const row = document.getElementById('headerRow');
  row.innerHTML = '';
  COLUMNS.forEach(col=>{
    const th = document.createElement('th');
    th.textContent = col.label;
    th.dataset.key = col.key;
    if (sortState.col === col.key){
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = sortState.dir === 1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
    th.addEventListener('click', ()=>{
      if (sortState.col !== col.key){ sortState = {col: col.key, dir: 1}; }
      else if (sortState.dir === 1){ sortState.dir = 2; }
      else if (sortState.dir === 2){ sortState = {col: null, dir: 0}; }
      renderHeader();
      renderAll();
    });
    row.appendChild(th);
  });
}

function applyFilters(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const type = document.getElementById('typeFilter').value;
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  return DEALS.filter(d=>{
    if (q && !(d.name.toLowerCase().includes(q) || d.account.toLowerCase().includes(q) || d.owner.toLowerCase().includes(q))) return false;
    if (type && !d.types.includes(type)) return false;
    if (stage && d.stageLabel !== stage) return false;
    if (region && d.region !== region) return false;
    return true;
  });
}

function typePillsHtml(d){
  if (!d.types.length) return '<span class="muted-dash">—</span>';
  return d.types.map(t=>`<span class="pill ${t}">${t}</span>`).join('');
}

function stageBadgeHtml(d){
  const n = stageNum(d.stageLabel);
  const cls = n ? 'stage-'+n : '';
  return `<span class="badge-stage ${cls}">${d.stageLabel}</span>`;
}

function acvCellHtml(d){
  let sub = '';
  if (d.currency !== 'USD'){
    sub = `<span class="acv-sub">${d.nativeACV.toLocaleString('en-US',{maximumFractionDigits:0})} ${d.currency}</span>`;
  }
  return `<span class="acv-cell">${fmtUSD(d.usdACV)}</span>${sub}`;
}

function dealRowHtml(d, showAccount, indent){
  const acct = showAccount ? `<td>${d.account}</td>` : `<td></td>`;
  const fedramp = d.fedramp === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : '';
  return `<tr class="deal-row">
    <td class="${indent?'indent':''}"><a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank">${d.name}</a></td>
    ${acct}
    <td>${typePillsHtml(d)}</td>
    <td>${stageBadgeHtml(d)}</td>
    <td>${d.closeDate}</td>
    <td>${acvCellHtml(d)}</td>
    <td>${d.region}</td>
    <td>${d.owner}${fedramp}</td>
  </tr>`;
}

function renderTable(filtered){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (sortState.col){
    const key = sortState.col;
    const dir = sortState.dir;
    const sorted = [...filtered].sort((a,b)=>{
      let av = a[key], bv = b[key];
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return dir === 1 ? -1 : 1;
      if (av > bv) return dir === 1 ? 1 : -1;
      return 0;
    });
    sorted.forEach(d=>{
      tbody.insertAdjacentHTML('beforeend', dealRowHtml(d, true, false));
    });
    return;
  }

  // grouped by account
  const groups = {};
  filtered.forEach(d=>{
    (groups[d.account] = groups[d.account] || []).push(d);
  });
  const accountList = Object.keys(groups).map(acct=>{
    const dealsArr = groups[acct];
    const total = dealsArr.reduce((s,d)=>s+d.usdACV,0);
    return {acct, dealsArr, total};
  }).sort((a,b)=>b.total-a.total);

  accountList.forEach(({acct, dealsArr, total}, idx)=>{
    const groupId = 'grp'+idx;
    const sortedDeals = [...dealsArr].sort((a,b)=> new Date(a.closeDate) - new Date(b.closeDate));
    const headerRow = document.createElement('tr');
    headerRow.className = 'acct-row';
    headerRow.dataset.group = groupId;
    headerRow.innerHTML = `
      <td colspan="5"><span class="collapse-icon">▼</span> ${acct} <span style="font-weight:400;color:#777;">(${dealsArr.length} deal${dealsArr.length>1?'s':''})</span></td>
      <td class="acv-cell">${fmtUSD(total)}</td>
      <td colspan="2"></td>
    `;
    headerRow.addEventListener('click', ()=>{
      const rows = document.querySelectorAll(`tr[data-parent="${groupId}"]`);
      const icon = headerRow.querySelector('.collapse-icon');
      const hidden = rows[0] && rows[0].style.display === 'none';
      rows.forEach(r=> r.style.display = hidden ? '' : 'none');
      icon.textContent = hidden ? '▼' : '▶';
    });
    tbody.appendChild(headerRow);
    sortedDeals.forEach(d=>{
      const tr = document.createElement('tr');
      tr.className = 'deal-row';
      tr.dataset.parent = groupId;
      tr.innerHTML = dealRowHtml(d, false, true).replace('<tr class="deal-row">','').replace('</tr>','');
      tbody.appendChild(tr);
    });
  });
}

function renderStats(filtered){
  const totalACV = filtered.reduce((s,d)=>s+d.usdACV,0);
  const accounts = new Set(filtered.map(d=>d.account)).size;
  const fedrampCount = filtered.filter(d=>d.fedramp==='Yes').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="val">${filtered.length}</div><div class="lbl">Open Deals</div></div>
    <div class="stat"><div class="val">${accounts}</div><div class="lbl">Accounts</div></div>
    <div class="stat"><div class="val">${fmtUSD(totalACV)}</div><div class="lbl">Total Pipeline ACV (USD)</div></div>
    <div class="stat"><div class="val">${fedrampCount}</div><div class="lbl">FedRAMP</div></div>
  `;
}

function renderSidebar(filtered){
  // By Stage
  const stageMap = {};
  filtered.forEach(d=>{
    const k = d.stageLabel;
    stageMap[k] = stageMap[k] || {count:0, acv:0};
    stageMap[k].count++; stageMap[k].acv += d.usdACV;
  });
  const stageKeys = Object.keys(stageMap).sort();
  document.getElementById('byStage').innerHTML = stageKeys.map(k=>`
    <div class="row"><span>${k}</span><span class="n">${stageMap[k].count} &middot; ${fmtUSD(stageMap[k].acv)}</span></div>
  `).join('') || '<div class="row">No data</div>';

  // By Type
  const typeMap = {};
  TYPE_ORDER.forEach(t=> typeMap[t] = {count:0, acv:0});
  typeMap['None'] = {count:0, acv:0};
  filtered.forEach(d=>{
    if (d.types.length){
      d.types.forEach(t=>{ typeMap[t].count++; typeMap[t].acv += d.usdACV; });
    } else {
      typeMap['None'].count++; typeMap['None'].acv += d.usdACV;
    }
  });
  const typeKeysOrdered = [...TYPE_ORDER, 'None'];
  document.getElementById('byType').innerHTML = typeKeysOrdered.map(k=>`
    <div class="row"><span>${k}</span><span class="n">${typeMap[k].count} &middot; ${fmtUSD(typeMap[k].acv)}</span></div>
  `).join('');

  // By Region
  const regionMap = {};
  filtered.forEach(d=>{
    regionMap[d.region] = (regionMap[d.region]||0) + 1;
  });
  const regionKeys = Object.keys(regionMap).sort((a,b)=>regionMap[b]-regionMap[a]);
  document.getElementById('byRegion').innerHTML = regionKeys.map(k=>`
    <div class="row"><span>${k}</span><span class="n">${regionMap[k]}</span></div>
  `).join('') || '<div class="row">No data</div>';
}

function renderAll(){
  const filtered = applyFilters();
  const accountsCount = new Set(filtered.map(d=>d.account)).size;
  document.getElementById('countLine').textContent = `${filtered.length} deals · ${accountsCount} accounts`;
  renderTable(filtered);
  renderStats(filtered);
  renderSidebar(filtered);
}
</script>
