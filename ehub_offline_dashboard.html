<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Offline Dashboard</title>
<style>
  :root {
    --nice-blue: #3694fc;
    --charcoal: #21212b;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
    --purple: #8b5cf6;
    --green: #22c55e;
    --amber: #f5a623;
    --slate: #8a8fa3;
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e3e7f0;
    --text: #21212b;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Password gate */
  #gate-overlay {
    position: fixed; inset: 0; background: var(--charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate-card {
    background: #fff; border-radius: 14px; padding: 40px 36px; width: 340px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #gate-card .logo {
    font-weight: 800; font-size: 22px; letter-spacing: 0.5px; color: var(--charcoal); margin-bottom: 4px;
  }
  #gate-card .logo span { color: var(--nice-blue); }
  #gate-card h2 { margin: 4px 0 20px; font-size: 16px; color: var(--muted); font-weight: 500; }
  #gate-card input {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; margin-bottom: 12px; outline: none;
  }
  #gate-card input:focus { border-color: var(--nice-blue); }
  #gate-card button {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: none;
    background: var(--nice-blue); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #gate-card button:hover { background: #2a7fe0; }
  #gate-error { color: var(--coral); font-size: 13px; height: 16px; margin-bottom: 8px; }

  #app { display: none; padding: 24px 28px 60px; max-width: 1500px; margin: 0 auto; }

  header.top { margin-bottom: 20px; }
  header.top h1 { margin: 0 0 4px; font-size: 24px; color: var(--charcoal); }
  header.top p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  header.top .note { font-size: 12px; color: var(--nice-blue); margin-top: 4px; font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat-tile {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px;
  }
  .stat-tile .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
  .stat-tile .value { font-size: 24px; font-weight: 700; color: var(--charcoal); }
  .stat-tile.fedramp .value { color: var(--purple); }

  .layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; }

  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center;
  }
  .filters input[type="text"] {
    flex: 1 1 220px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13.5px;
  }
  .filters select {
    padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13.5px; background: #fff;
  }
  .result-count { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }

  .table-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; background: #f8f9fc; border-bottom: 1px solid var(--border);
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted);
    cursor: pointer; white-space: nowrap; user-select: none;
  }
  thead th:hover { color: var(--charcoal); }
  thead th .arrow { font-size: 10px; margin-left: 3px; color: var(--nice-blue); }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr.deal-row:hover { background: #f8faff; }
  tbody tr.deal-row td.opp-cell { padding-left: 26px; }
  tbody tr.deal-row.flat td.opp-cell { padding-left: 12px; }

  tr.account-row { background: #eef3fc; cursor: pointer; }
  tr.account-row:hover { background: #e4ecfb; }
  tr.account-row td { font-weight: 700; color: var(--charcoal); padding: 11px 12px; }
  tr.account-row .acct-name { display: flex; align-items: center; gap: 8px; }
  tr.account-row .caret { display: inline-block; transition: transform 0.15s; font-size: 10px; color: var(--nice-blue); }
  tr.account-row.collapsed .caret { transform: rotate(-90deg); }
  tr.account-row .count-pill {
    font-weight: 600; font-size: 11px; color: var(--muted); background: #fff; border: 1px solid var(--border);
    border-radius: 20px; padding: 2px 9px;
  }

  a.opp-link { color: var(--nice-blue); text-decoration: none; font-weight: 600; }
  a.opp-link:hover { text-decoration: underline; }

  .sub-currency { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }

  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700;
    color: #fff; margin: 1px 3px 1px 0;
  }
  .pill.amc { background: var(--nice-blue); }
  .pill.ticketing { background: #0aa896; }
  .pill.generic { background: var(--slate); }
  .pill.smartreach { background: var(--indigo); }
  .pill.none { background: transparent; color: var(--muted); font-weight: 500; }

  .badge-stage { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; color: #fff; }
  .badge-stage .num { font-weight: 800; }
  .stage-0, .stage-1 { background: var(--nice-blue); }
  .stage-2, .stage-3 { background: var(--amber); }
  .stage-4 { background: var(--purple); }
  .stage-5 { background: var(--green); }

  .badge-fedramp {
    display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 20px; font-size: 10.5px;
    font-weight: 700; color: #fff; background: var(--purple); vertical-align: middle;
  }

  .sidebar { display: flex; flex-direction: column; gap: 14px; }
  .side-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
  }
  .side-card h3 { margin: 0 0 12px; font-size: 13px; color: var(--charcoal); text-transform: uppercase; letter-spacing: 0.4px; }
  .side-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .side-row:last-child { border-bottom: none; }
  .side-row .k { color: var(--text); font-weight: 600; }
  .side-row .v { color: var(--muted); font-size: 12px; text-align: right; }
  .side-row .v .cnt { color: var(--charcoal); font-weight: 700; }

  footer.foot { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 30px; }
</style>
</head>
<body>

<div id="gate-overlay">
  <div id="gate-card">
    <div class="logo">ni<span>CE</span></div>
    <h2>eHub Offline Dashboard</h2>
    <div id="gate-error"></div>
    <input type="password" id="gate-pw" placeholder="Enter password" autofocus />
    <button id="gate-btn" onclick="handleGateSubmit()">Access Dashboard</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>eHub Offline Dashboard</h1>
    <p>Engagement Hub Offline &middot; open opportunities (excl. Closed) &middot; sourced from Salesforce CPQ, SKU 1464-3063</p>
    <p class="note">ACV shown in USD (corporate currency)</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="layout">
    <div>
      <div class="filters">
        <input type="text" id="f-search" placeholder="Search opportunity, account, or owner..." oninput="render()" />
        <select id="f-type" onchange="render()"><option value="all">All Types</option></select>
        <select id="f-stage" onchange="render()"><option value="all">All Stages</option></select>
        <select id="f-region" onchange="render()"><option value="all">All Regions</option></select>
      </div>
      <div class="result-count" id="result-count"></div>
      <div class="table-card">
        <table>
          <thead>
            <tr id="table-head"></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <div class="sidebar">
      <div class="side-card">
        <h3>By Stage</h3>
        <div id="side-stage"></div>
      </div>
      <div class="side-card">
        <h3>By Type</h3>
        <div id="side-type"></div>
      </div>
      <div class="side-card">
        <h3>By Region</h3>
        <div id="side-region"></div>
      </div>
    </div>
  </div>

  <footer class="foot">eHub Offline Dashboard &middot; rebuilt automatically &middot; NiCE internal use only</footer>
</div>

const TYPE_ORDER = ["AMC", "Ticketing", "Generic", "SmartReach"];
const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

const STAGE_LABELS = {
  0: "Prospecting",
  1: "Identification / Qualification",
  2: "Determining Problem",
  3: "Aligning Benefits & Value",
  4: "Confirm Value & Agreement",
  5: "Proposal / Negotiation"
};

const COLUMNS = [
  { key: "name", label: "Opportunity", sortable: true },
  { key: "account", label: "Account", sortable: true },
  { key: "typeStr", label: "Type", sortable: true },
  { key: "stageNum", label: "Stage", sortable: true },
  { key: "closeDate", label: "Close Date", sortable: true },
  { key: "usdACV", label: "ACV", sortable: true },
  { key: "regionDisplay", label: "Region / Territory", sortable: true },
  { key: "owner", label: "Owner", sortable: true }
];

let sortState = { key: null, dir: 0 }; // dir: 0 none, 1 asc, -1 desc
let collapsedAccounts = new Set();

function fmtUSD(n) {
  return "$" + Math.round(n).toLocaleString("en-US");
}
function fmtNative(n, cur) {
  return cur + " " + Math.round(n).toLocaleString("en-US");
}

function typePills(types) {
  if (!types || types.length === 0) return '<span class="pill none">&mdash;</span>';
  return types.map(t => `<span class="pill ${t.toLowerCase()}">${t}</span>`).join("");
}

function stageBadge(d) {
  if (d.stageNum === null || d.stageNum === undefined) {
    return `<span class="badge-stage" style="background:var(--slate)">${d.stageRaw}</span>`;
  }
  return `<span class="badge-stage stage-${d.stageNum}"><span class="num">${d.stageNum}</span> &middot; ${d.stageLabel}</span>`;
}

function populateFilterOptions() {
  const typeSel = document.getElementById("f-type");
  TYPE_ORDER.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t; opt.textContent = t;
    typeSel.appendChild(opt);
  });

  const stageSel = document.getElementById("f-stage");
  const stageNums = Array.from(new Set(DEALS.map(d => d.stageNum).filter(n => n !== null && n !== undefined))).sort((a,b)=>a-b);
  stageNums.forEach(n => {
    const opt = document.createElement("option");
    opt.value = n; opt.textContent = n + " · " + (STAGE_LABELS[n] || "");
    stageSel.appendChild(opt);
  });

  const regionSel = document.getElementById("f-region");
  const regions = Array.from(new Set(DEALS.map(d => d.regionDisplay))).sort();
  regions.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });
}

function getFiltered() {
  const search = document.getElementById("f-search").value.trim().toLowerCase();
  const type = document.getElementById("f-type").value;
  const stage = document.getElementById("f-stage").value;
  const region = document.getElementById("f-region").value;

  return DEALS.filter(d => {
    if (search) {
      const hay = (d.name + " " + d.account + " " + d.owner).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    if (type !== "all" && !d.types.includes(type)) return false;
    if (stage !== "all" && String(d.stageNum) !== stage) return false;
    if (region !== "all" && d.regionDisplay !== region) return false;
    return true;
  });
}

function renderStats(filtered) {
  const el = document.getElementById("stats");
  const accounts = new Set(filtered.map(d => d.account)).size;
  const totalACV = filtered.reduce((s, d) => s + d.usdACV, 0);
  const fedrampCount = filtered.filter(d => d.fedramp).length;
  el.innerHTML = `
    <div class="stat-tile"><div class="label">Open Deals</div><div class="value">${filtered.length}</div></div>
    <div class="stat-tile"><div class="label">Accounts</div><div class="value">${accounts}</div></div>
    <div class="stat-tile"><div class="label">Total Pipeline ACV (USD)</div><div class="value">${fmtUSD(totalACV)}</div></div>
    <div class="stat-tile fedramp"><div class="label">FedRAMP</div><div class="value">${fedrampCount}</div></div>
  `;
}

function renderSidebar(filtered) {
  // By stage
  const stageMap = {};
  filtered.forEach(d => {
    const key = d.stageNum !== null && d.stageNum !== undefined ? d.stageNum : -1;
    if (!stageMap[key]) stageMap[key] = { count: 0, acv: 0, label: d.stageNum !== null ? (d.stageNum + " · " + d.stageLabel) : d.stageRaw };
    stageMap[key].count++;
    stageMap[key].acv += d.usdACV;
  });
  const stageKeys = Object.keys(stageMap).sort((a,b)=>Number(a)-Number(b));
  document.getElementById("side-stage").innerHTML = stageKeys.map(k => {
    const s = stageMap[k];
    return `<div class="side-row"><span class="k">${s.label}</span><span class="v"><span class="cnt">${s.count}</span> &middot; ${fmtUSD(s.acv)}</span></div>`;
  }).join("") || '<div class="side-row"><span class="k">No data</span></div>';

  // By type (fixed order + None)
  const typeMap = {};
  TYPE_ORDER.forEach(t => typeMap[t] = { count: 0, acv: 0 });
  typeMap["None"] = { count: 0, acv: 0 };
  filtered.forEach(d => {
    if (d.types.length === 0) {
      typeMap["None"].count++;
      typeMap["None"].acv += d.usdACV;
    } else {
      d.types.forEach(t => {
        typeMap[t].count++;
        typeMap[t].acv += d.usdACV;
      });
    }
  });
  const typeOrderDisplay = [...TYPE_ORDER, "None"];
  document.getElementById("side-type").innerHTML = typeOrderDisplay.map(t => {
    const s = typeMap[t];
    return `<div class="side-row"><span class="k">${t}</span><span class="v"><span class="cnt">${s.count}</span> &middot; ${fmtUSD(s.acv)}</span></div>`;
  }).join("");

  // By region
  const regionMap = {};
  filtered.forEach(d => {
    regionMap[d.regionDisplay] = (regionMap[d.regionDisplay] || 0) + 1;
  });
  const regionKeys = Object.keys(regionMap).sort((a,b) => regionMap[b]-regionMap[a]);
  document.getElementById("side-region").innerHTML = regionKeys.map(r => {
    return `<div class="side-row"><span class="k">${r}</span><span class="v"><span class="cnt">${regionMap[r]}</span></span></div>`;
  }).join("") || '<div class="side-row"><span class="k">No data</span></div>';
}

function renderHead() {
  const tr = document.getElementById("table-head");
  tr.innerHTML = COLUMNS.map(c => {
    let arrow = "";
    if (sortState.key === c.key) {
      arrow = `<span class="arrow">${sortState.dir === 1 ? "▲" : "▼"}</span>`;
    }
    return `<th onclick="handleSort('${c.key}')">${c.label}${arrow}</th>`;
  }).join("");
}

function handleSort(key) {
  if (sortState.key !== key) {
    sortState = { key, dir: 1 };
  } else if (sortState.dir === 1) {
    sortState.dir = -1;
  } else {
    sortState = { key: null, dir: 0 };
  }
  render();
}

function dealRowHtml(d, showAccount, indent) {
  const acvSub = d.currency !== "USD" ? `<span class="sub-currency">${fmtNative(d.nativeACV, d.currency)}</span>` : "";
  const fedrampBadge = d.fedramp ? '<span class="badge-fedramp">FedRAMP</span>' : "";
  return `
    <tr class="deal-row${indent ? "" : " flat"}">
      <td class="opp-cell"><a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank" rel="noopener">${escapeHtml(d.name)}</a></td>
      <td>${showAccount ? escapeHtml(d.account) : ""}</td>
      <td>${typePills(d.types)}</td>
      <td>${stageBadge(d)}</td>
      <td>${d.closeDateDisp}</td>
      <td>${fmtUSD(d.usdACV)}${acvSub}</td>
      <td>${escapeHtml(d.regionDisplay)}</td>
      <td>${escapeHtml(d.owner)}${fedrampBadge}</td>
    </tr>
  `;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderBody(filtered) {
  const tbody = document.getElementById("table-body");

  if (sortState.key) {
    const sorted = [...filtered].sort((a, b) => {
      let av = a[sortState.key], bv = b[sortState.key];
      if (sortState.key === "closeDate") { av = av || ""; bv = bv || ""; }
      if (sortState.key === "stageNum") { av = av === null || av === undefined ? -1 : av; bv = bv === null || bv === undefined ? -1 : bv; }
      if (typeof av === "string") av = av.toLowerCase();
      if (typeof bv === "string") bv = bv.toLowerCase();
      if (av < bv) return sortState.dir === 1 ? -1 : 1;
      if (av > bv) return sortState.dir === 1 ? 1 : -1;
      return 0;
    });
    tbody.innerHTML = sorted.map(d => dealRowHtml(d, true, false)).join("");
    document.getElementById("result-count").textContent =
      `${filtered.length} deals · ${new Set(filtered.map(d=>d.account)).size} accounts`;
    return;
  }

  // grouped by account
  const groups = {};
  filtered.forEach(d => {
    if (!groups[d.account]) groups[d.account] = [];
    groups[d.account].push(d);
  });
  const accountNames = Object.keys(groups).sort((a, b) => {
    const totalA = groups[a].reduce((s, d) => s + d.usdACV, 0);
    const totalB = groups[b].reduce((s, d) => s + d.usdACV, 0);
    return totalB - totalA;
  });

  let html = "";
  accountNames.forEach(acct => {
    const dealsInAcct = [...groups[acct]].sort((a, b) => (a.closeDate || "").localeCompare(b.closeDate || ""));
    const total = dealsInAcct.reduce((s, d) => s + d.usdACV, 0);
    const isCollapsed = collapsedAccounts.has(acct);
    html += `
      <tr class="account-row${isCollapsed ? " collapsed" : ""}" onclick="toggleAccount('${acct.replace(/'/g, "\'")}')">
        <td colspan="5"><div class="acct-name"><span class="caret">&#9660;</span> ${escapeHtml(acct)} <span class="count-pill">${dealsInAcct.length} deal${dealsInAcct.length === 1 ? "" : "s"}</span></div></td>
        <td>${fmtUSD(total)}</td>
        <td colspan="2"></td>
      </tr>
    `;
    if (!isCollapsed) {
      dealsInAcct.forEach(d => {
        html += dealRowHtml(d, false, true);
      });
    }
  });
  tbody.innerHTML = html || `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:30px;">No deals match the current filters.</td></tr>`;
  document.getElementById("result-count").textContent =
    `${filtered.length} deals · ${accountNames.length} accounts`;
}

function toggleAccount(acct) {
  if (collapsedAccounts.has(acct)) collapsedAccounts.delete(acct);
  else collapsedAccounts.add(acct);
  render();
}

function render() {
  const filtered = getFiltered();
  renderStats(filtered);
  renderSidebar(filtered);
  renderHead();
  renderBody(filtered);
}

// ---- Password gate ----
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function checkPw(val) {
  const hash = await sha256Hex(val);
  return hash === STORED_HASH;
}

async function handleGateSubmit() {
  const val = document.getElementById("gate-pw").value;
  const ok = await checkPw(val);
  if (ok) {
    sessionStorage.setItem("ehub_offline_authed", "1");
    unlockDashboard();
  } else {
    document.getElementById("gate-error").textContent = "Incorrect password.";
  }
}

function unlockDashboard() {
  document.getElementById("gate-overlay").style.display = "none";
  document.getElementById("app").style.display = "block";
  init();
}

function init() {
  populateFilterOptions();
  render();
}

document.getElementById("gate-pw").addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleGateSubmit();
});

if (sessionStorage.getItem("ehub_offline_authed") === "1") {
  unlockDashboard();
}
</script>
</body>
</html>
