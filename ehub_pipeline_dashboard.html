<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
  :root {
    --nice-blue: #3694fc;
    --charcoal: #21212b;
    --indigo: #6100FF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6fb;
    color: #21212b;
  }

  /* Password gate */
  #gate {
    position: fixed; inset: 0; z-index: 9999;
    background: #21212b;
    display: flex; align-items: center; justify-content: center;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 40px 36px;
    width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #gate .logo { font-size: 22px; font-weight: 700; color: var(--nice-blue); margin-bottom: 4px; }
  #gate .sub { color: #666; font-size: 13px; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px;
    font-size: 14px; margin-bottom: 14px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
    background: var(--nice-blue); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #gate button:hover { background: #2a7fe0; }
  #gate .err { color: #d93025; font-size: 12px; margin-top: 10px; min-height: 16px; }

  #app { display: none; }

  header {
    background: var(--charcoal); color: #fff; padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .brand { color: var(--nice-blue); font-weight: 700; }
  header .updated { font-size: 12px; color: #aaa; }

  .stats {
    display: flex; gap: 14px; padding: 16px 28px; flex-wrap: wrap; background: #fff;
    border-bottom: 1px solid #e3e6ee;
  }
  .stat {
    background: #f4f6fb; border-radius: 10px; padding: 12px 18px; min-width: 140px;
    border-left: 4px solid var(--nice-blue);
  }
  .stat .val { font-size: 20px; font-weight: 700; color: var(--charcoal); }
  .stat .lbl { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: .03em; }

  .layout { display: flex; gap: 0; align-items: flex-start; }
  .sidebar {
    width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid #e3e6ee;
    padding: 16px; min-height: calc(100vh - 160px);
  }
  .sidebar h3 { font-size: 12px; text-transform: uppercase; color: #888; margin: 18px 0 8px; }
  .sidebar h3:first-child { margin-top: 0; }
  .sidebar .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid #f0f0f3; }
  .sidebar .row .n { color: #555; }
  .sidebar .row .v { font-weight: 600; }

  .main { flex: 1; padding: 16px 24px; min-width: 0; }

  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center;
  }
  .filters input[type=text] {
    padding: 8px 12px; border: 1px solid #d3d6e0; border-radius: 8px; font-size: 13px; width: 220px;
  }
  .filters select {
    padding: 8px 10px; border: 1px solid #d3d6e0; border-radius: 8px; font-size: 13px; background: #fff;
  }
  .filters .count { font-size: 12.5px; color: #666; margin-left: auto; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  thead th {
    background: #eef1f8; text-align: left; font-size: 11.5px; text-transform: uppercase;
    color: #555; padding: 10px 12px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--nice-blue); }
  tbody td { padding: 9px 12px; font-size: 13px; border-top: 1px solid #f0f1f6; vertical-align: middle; }
  tr.acct-header { background: #f8f9fd; cursor: pointer; }
  tr.acct-header td { font-weight: 700; padding: 11px 12px; }
  tr.acct-header .chev { display:inline-block; width:14px; transition: transform .15s; }
  tr.acct-header.collapsed .chev { transform: rotate(-90deg); }
  tr.deal-row td.indent { padding-left: 28px; }
  tr.deal-row.hidden { display: none; }
  a.opp-link { color: var(--nice-blue); text-decoration: none; font-weight: 500; }
  a.opp-link:hover { text-decoration: underline; }
  .muted { color: #9aa; font-size: 12px; }

  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
    color: #fff; white-space: nowrap;
  }
  .stage-badge {
    display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
  }
  .stage-01 { background: #d9e8ff; color: #1255a8; }
  .stage-23 { background: #fff3cd; color: #8a6300; }
  .stage-4 { background: #ece0ff; color: #5a1fb8; }
  .stage-5 { background: #d6f5e3; color: #176b3a; }
  .fedramp-badge {
    display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700;
    background: #efe0ff; color: #6100FF; margin-left: 6px;
  }
  .sort-ind { font-size: 10px; margin-left: 3px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <div class="sub">eHub Pipeline Dashboard</div>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1><span class="brand">NiCE</span> &nbsp;eHub Pipeline Dashboard</h1>
    <div class="updated">Last rebuilt: Oct 09, 2026</div>
  </header>

  <div class="stats" id="statsBar"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search opportunity, account, owner...">
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <select id="acdFilter"><option value="">All ACDs</option></select>
        <span class="count" id="resultCount"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th data-key="name">Opportunity</th>
            <th data-key="account">Account</th>
            <th data-key="stage">Stage</th>
            <th data-key="closeDate">Close Date</th>
            <th data-key="usdACV">ACV (USD)</th>
            <th data-key="acd">ACD</th>
            <th data-key="regionDisplay">Region / Territory</th>
            <th data-key="owner">Owner</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

const ACD_COLORS = {"Genesys Engage": "#6100FF", "Genesys SIPREC": "#9457ff", "Genesys CX": "#43009e", "Genesys": "#8a7cff", "Five9": "#00a887", "MS Teams": "#5059c9", "Amazon Connect": "#ff9900", "Cisco Systems": "#1ba0d7", "Cisco": "#1ba0d7", "Avaya": "#da291c", "NICE CXone Mpower": "#3694fc", "UJET": "#f4511e", "Unknown": "#9aa0a6"};

const PW_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

async function checkPw(val) {
  const enc = new TextEncoder().encode(val);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  return hex === PW_HASH;
}

(function initGate(){
  try {
    if (sessionStorage.getItem('ehub_auth') === '1') {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initApp();
      return;
    }
  } catch(e) {}

  const btn = document.getElementById('pwBtn');
  const input = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');

  async function attempt() {
    const ok = await checkPw(input.value);
    if (ok) {
      try { sessionStorage.setItem('ehub_auth', '1'); } catch(e) {}
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initApp();
    } else {
      err.textContent = 'Incorrect password';
    }
  }
  btn.addEventListener('click', attempt);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
})();

function fmtMoney(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function stageBadgeClass(stage) {
  if (stage === '0' || stage === '1') return 'stage-01';
  if (stage === '2' || stage === '3') return 'stage-23';
  if (stage === '4') return 'stage-4';
  if (stage === '5') return 'stage-5';
  return '';
}
function acdPill(acd) {
  const color = ACD_COLORS[acd] || '#9aa0a6';
  return `<span class="pill" style="background:${color}">${acd}</span>`;
}

let sortState = { key: null, dir: 1, step: 0 }; // step 0 = grouped, 1=asc,2=desc

function initApp() {
  populateFilterOptions();
  renderStats();
  renderSidebar();
  render();

  document.getElementById('searchBox').addEventListener('input', render);
  document.getElementById('stageFilter').addEventListener('change', render);
  document.getElementById('regionFilter').addEventListener('change', render);
  document.getElementById('acdFilter').addEventListener('change', render);

  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-key');
      if (sortState.key !== key) {
        sortState = { key, dir: 1, step: 1 };
      } else {
        sortState.step = (sortState.step + 1) % 3;
        if (sortState.step === 0) { sortState.key = null; }
        else { sortState.dir = sortState.step === 1 ? 1 : -1; }
      }
      render();
    });
  });
}

function populateFilterOptions() {
  const stages = [...new Set(DATA.map(d => d.stage))].sort();
  const stageSel = document.getElementById('stageFilter');
  stages.forEach(s => {
    const label = DATA.find(d => d.stage === s).stageLabel;
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = `${s} - ${label}`;
    stageSel.appendChild(opt);
  });

  const regions = [...new Set(DATA.map(d => d.regionDisplay))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });

  const acds = [...new Set(DATA.map(d => d.acd))].sort();
  const acdSel = document.getElementById('acdFilter');
  acds.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    acdSel.appendChild(opt);
  });
}

function renderStats() {
  const totalACV = DATA.reduce((s,d) => s + d.usdACV, 0);
  const accounts = new Set(DATA.map(d => d.topParent));
  const fedramp = DATA.filter(d => d.fedramp === 'Yes').length;
  const acds = new Set(DATA.map(d => d.acd));
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `
    <div class="stat"><div class="val">${DATA.length}</div><div class="lbl">Open Deals</div></div>
    <div class="stat"><div class="val">${accounts.size}</div><div class="lbl">Accounts</div></div>
    <div class="stat"><div class="val">${fmtMoney(totalACV)}</div><div class="lbl">Total Pipeline ACV</div></div>
    <div class="stat"><div class="val">${fedramp}</div><div class="lbl">FedRAMP Deals</div></div>
    <div class="stat"><div class="val">${acds.size}</div><div class="lbl">Distinct ACDs</div></div>
  `;
}

function renderSidebar() {
  const byStage = {};
  const byAcd = {};
  const byRegion = {};
  DATA.forEach(d => {
    const sKey = `${d.stage} · ${d.stageLabel}`;
    byStage[sKey] = byStage[sKey] || {count:0, acv:0};
    byStage[sKey].count++; byStage[sKey].acv += d.usdACV;

    byAcd[d.acd] = byAcd[d.acd] || {count:0, acv:0};
    byAcd[d.acd].count++; byAcd[d.acd].acv += d.usdACV;

    byRegion[d.regionDisplay] = byRegion[d.regionDisplay] || {count:0};
    byRegion[d.regionDisplay].count++;
  });

  function section(title, obj, showAcv=true) {
    const entries = Object.entries(obj).sort((a,b) => b[1].count - a[1].count);
    let rows = entries.map(([k,v]) => `
      <div class="row"><span class="n">${k}</span><span class="v">${v.count}${showAcv ? ' · ' + fmtMoney(v.acv) : ''}</span></div>
    `).join('');
    return `<h3>${title}</h3>${rows}`;
  }

  document.getElementById('sidebar').innerHTML =
    section('By Stage', byStage) +
    section('By ACD', byAcd) +
    section('By Region', byRegion, false);
}

function filteredData() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;

  return DATA.filter(d => {
    if (stage && d.stage !== stage) return false;
    if (region && d.regionDisplay !== region) return false;
    if (acd && d.acd !== acd) return false;
    if (q) {
      const hay = (d.name + ' ' + d.account + ' ' + d.topParent + ' ' + d.owner).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const rows = filteredData();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  // update sort indicators
  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.innerHTML = th.textContent.replace(/[\s]*[▲▼]$/,'');
  });
  if (sortState.key) {
    const th = document.querySelector(`thead th[data-key="${sortState.key}"]`);
    if (th) th.innerHTML += (sortState.dir === 1 ? ' ▲' : ' ▼');
  }

  const accountsSet = new Set(rows.map(r => r.topParent));
  document.getElementById('resultCount').textContent = `${rows.length} deals · ${accountsSet.size} accounts`;

  if (sortState.key) {
    const key = sortState.key, dir = sortState.dir;
    rows.sort((a,b) => {
      let av = a[key], bv = b[key];
      if (key === 'stage') { av = parseInt(av); bv = parseInt(bv); }
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return -1*dir;
      if (av > bv) return 1*dir;
      return 0;
    });
    // flat list, show account column
    rows.forEach(d => tbody.appendChild(buildDealRow(d, true)));
    return;
  }

  // grouped by account, sorted by total ACV desc
  const groups = {};
  rows.forEach(d => {
    groups[d.topParent] = groups[d.topParent] || { deals: [], acv: 0 };
    groups[d.topParent].deals.push(d);
    groups[d.topParent].acv += d.usdACV;
  });
  const groupKeys = Object.keys(groups).sort((a,b) => groups[b].acv - groups[a].acv);

  groupKeys.forEach(acctName => {
    const g = groups[acctName];
    g.deals.sort((a,b) => (a.closeDate || '').localeCompare(b.closeDate || ''));
    const acdSet = [...new Set(g.deals.map(d => d.acd))];
    const acdBadges = acdSet.map(acdPill).join(' ');

    const headerRow = document.createElement('tr');
    headerRow.className = 'acct-header';
    headerRow.innerHTML = `
      <td colspan="8"><span class="chev">▾</span> ${acctName} &nbsp; <span class="muted">(${g.deals.length} deals)</span> &nbsp; ${acdBadges} &nbsp; <strong>${fmtMoney(g.acv)}</strong></td>
    `;
    headerRow.addEventListener('click', () => {
      headerRow.classList.toggle('collapsed');
      let el = headerRow.nextElementSibling;
      while (el && el.classList.contains('deal-row')) {
        el.classList.toggle('hidden');
        el = el.nextElementSibling;
      }
    });
    tbody.appendChild(headerRow);

    g.deals.forEach(d => {
      const showAccount = d.account !== acctName;
      tbody.appendChild(buildDealRow(d, false, showAccount));
    });
  });
}

function buildDealRow(d, flat, showAccountMuted) {
  const tr = document.createElement('tr');
  tr.className = 'deal-row';
  const acctCell = flat
    ? `<td>${d.account}</td>`
    : (showAccountMuted ? `<td class="muted">${d.account}</td>` : `<td></td>`);
  tr.innerHTML = `
    <td class="indent"><a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank" rel="noopener">${d.name}</a>${d.fedramp === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : ''}</td>
    ${acctCell}
    <td><span class="stage-badge ${stageBadgeClass(d.stage)}">${d.stage} · ${d.stageLabel}</span></td>
    <td>${fmtDate(d.closeDate)}</td>
    <td>${fmtMoney(d.usdACV)}${d.currency !== 'USD' ? `<div class="muted">${d.nativeACV.toLocaleString()} ${d.currency}</div>` : ''}</td>
    <td>${acdPill(d.acd)}</td>
    <td>${d.regionDisplay}</td>
    <td>${d.owner}</td>
  `;
  return tr;
}
