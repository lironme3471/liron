<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Pipeline Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --nice-blue: #3694fc;
    --charcoal: #21212b;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --border: #e2e5ec;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--charcoal);
  }

  /* Password gate */
  #gate {
    position: fixed; inset: 0; background: var(--charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 14px; padding: 40px 36px; width: 340px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #gate .logo { font-weight: 800; font-size: 22px; color: var(--indigo); letter-spacing: 1px; margin-bottom: 4px;}
  #gate .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; margin-bottom: 14px; outline: none;
  }
  #gate input:focus { border-color: var(--nice-blue); }
  #gate button {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: none;
    background: var(--indigo); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #gate button:hover { background: #4f00cc; }
  #gate .err { color: var(--coral); font-size: 12.5px; margin-top: 10px; min-height: 16px; }

  #app { display: none; padding: 20px 28px 60px; max-width: 1500px; margin: 0 auto; }

  header.top { display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; }
  header.top h1 { font-size: 21px; margin:0; color: var(--charcoal); }
  header.top .meta { color: var(--text-muted); font-size: 12.5px; }
  #reload-note { color: var(--text-muted); font-size: 12px; }

  .stats-bar {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px;
  }
  .stat {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px;
  }
  .stat .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 6px;}
  .stat .value { font-size: 22px; font-weight: 700; color: var(--charcoal); }

  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 18px; align-items: start; }

  .sidebar { background: var(--card-bg); border:1px solid var(--border); border-radius: 12px; padding: 16px; position: sticky; top: 16px;}
  .sidebar h3 { font-size: 12.5px; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; letter-spacing:.03em;}
  .sidebar .block { margin-bottom: 20px; }
  .sidebar .row { display:flex; justify-content:space-between; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .sidebar .row:last-child { border-bottom: none; }
  .sidebar .row .l { color: var(--charcoal); }
  .sidebar .row .r { color: var(--text-muted); }

  .main { background: var(--card-bg); border:1px solid var(--border); border-radius: 12px; overflow: hidden;}

  .filters { display:flex; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items:center;}
  .filters input[type=text] {
    flex: 1 1 220px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px;
  }
  .filters select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; background:#fff;
  }
  .filters .count { margin-left: auto; font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; background: #f9fafc; border-bottom: 1px solid var(--border);
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--charcoal); }
  tbody tr.deal-row td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr.deal-row:hover { background: #f7f9ff; }
  tbody tr.account-row td {
    padding: 10px 12px; background: #eef2fb; font-weight: 700; cursor: pointer; border-bottom: 1px solid var(--border);
  }
  tbody tr.account-row:hover { background: #e4ebfa; }
  tbody tr.account-row .acct-name { font-size: 13.5px; }
  tbody tr.account-row .acct-meta { font-weight: 500; color: var(--text-muted); font-size: 12px; margin-left: 8px;}
  .caret { display:inline-block; width: 14px; transition: transform .15s; }
  .collapsed .caret { transform: rotate(-90deg); }

  a.opp-link { color: var(--nice-blue); text-decoration: none; font-weight: 600; }
  a.opp-link:hover { text-decoration: underline; }
  .muted { color: var(--text-muted); font-size: 12px; }

  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; color: #fff;
    white-space: nowrap;
  }
  .stage-badge {
    display:inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 700; color: #fff; white-space:nowrap;
  }
  .fedramp-badge {
    display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
    background: #ede2ff; color: #6100FF; margin-left: 6px; border: 1px solid #d9c2ff;
  }
  .sort-arrow { font-size: 10px; margin-left: 3px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <div class="sub">eHub Pipeline Dashboard</div>
    <input type="password" id="pw" placeholder="Password" autocomplete="off">
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <h1>eHub Pipeline Dashboard</h1>
      <div class="meta">Engagement Hub open pipeline (stages 0&ndash;5) &middot; Real-Time Recording SKUs &middot; updated Sep 24, 2026</div>
    </div>
    <div id="reload-note" class="meta">Refresh the page to rebuild tomorrow</div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="layout">
    <div class="sidebar">
      <div class="block">
        <h3>By Stage</h3>
        <div id="sideStage"></div>
      </div>
      <div class="block">
        <h3>By ACD</h3>
        <div id="sideAcd"></div>
      </div>
      <div class="block">
        <h3>By Region</h3>
        <div id="sideRegion"></div>
      </div>
    </div>

    <div class="main">
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search opportunity or account...">
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <select id="acdFilter"><option value="">All ACDs</option></select>
        <div class="count" id="resultCount"></div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th data-key="name">Opportunity</th>
              <th data-key="account_name">Account</th>
              <th data-key="stage_num">Stage</th>
              <th data-key="close_date">Close Date</th>
              <th data-key="usd_acv">ACV</th>
              <th data-key="acd">ACD</th>
              <th data-key="region">Region / Territory</th>
              <th data-key="owner">Owner</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";
const STORED_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

const ACD_COLORS = {
  "MS Teams": "#6264A7",
  "Cisco Systems": "#049fd9",
  "Cisco": "#027ea6",
  "Avaya": "#e2233c",
  "Amazon Connect": "#FF9900",
  "Genesys": "#a566ff",
  "Genesys Engage": "#6100FF",
  "Genesys SIPREC": "#9457ff",
  "Genesys CX": "#43009e",
  "Five9": "#00a887",
  "NICE CXone Mpower": "#3694fc",
  "UJET": "#21212b",
  "MS Teams / Cisco Systems": "#4a6fa5",
  "Other": "#8a8f98",
  "Unknown": "#8a8f98"
};
function acdColor(acd) { return ACD_COLORS[acd] || "#8a8f98"; }

const STAGE_COLORS = {
  "0": "#3694fc", "1": "#1f6fd1",
  "2": "#f5a623", "3": "#e08e00",
  "4": "#6100FF",
  "5": "#1fa876"
};

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pw').value;
  const hash = await sha256Hex(val);
  if (hash === STORED_HASH) {
    sessionStorage.setItem('ehub_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}
document.getElementById('pwBtn').addEventListener('click', checkPw);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

if (sessionStorage.getItem('ehub_auth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.addEventListener('DOMContentLoaded', init);
}

function fmtUSD(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

let sortState = { key: null, dir: 1 }; // dir: 1 asc, -1 desc, 0 -> grouped
let collapsedAccounts = new Set();

function regionLabel(d) {
  if (d.region && d.territory) return d.region + ' / ' + d.territory;
  if (d.region) return d.region;
  if (d.territory) return d.territory;
  return '';
}

function applyFilters() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;
  return DEALS.filter(d => {
    if (stage && d.stage_num !== stage) return false;
    if (region && (d.region || '') !== region) return false;
    if (acd && d.acd !== acd) return false;
    if (q) {
      const hay = (d.name + ' ' + d.account_name + ' ' + d.top_parent_name).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderStats(filtered) {
  const accounts = new Set(filtered.map(d => d.top_parent_name));
  const totalAcv = filtered.reduce((s, d) => s + (d.usd_acv || 0), 0);
  const fedrampCount = filtered.filter(d => d.fedramp === 'Yes').length;
  const acds = new Set(filtered.map(d => d.acd));
  const stats = [
    ['Open Deals', filtered.length],
    ['Accounts', accounts.size],
    ['Total Pipeline ACV', fmtUSD(totalAcv)],
    ['FedRAMP Deals', fedrampCount],
    ['Distinct ACDs', acds.size],
  ];
  document.getElementById('statsBar').innerHTML = stats.map(([label, value]) =>
    `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div></div>`
  ).join('');
}

function renderSidebar(filtered) {
  // By stage
  const stageMap = {};
  filtered.forEach(d => {
    stageMap[d.stage_num] = stageMap[d.stage_num] || { count: 0, acv: 0, label: d.stage_label };
    stageMap[d.stage_num].count++;
    stageMap[d.stage_num].acv += d.usd_acv || 0;
  });
  const stageHtml = Object.keys(stageMap).sort().map(k => {
    const s = stageMap[k];
    return `<div class="row"><span class="l">${k} &middot; ${s.label}</span><span class="r">${s.count} &middot; ${fmtUSD(s.acv)}</span></div>`;
  }).join('') || '<div class="muted">No data</div>';
  document.getElementById('sideStage').innerHTML = stageHtml;

  // By ACD
  const acdMap = {};
  filtered.forEach(d => {
    acdMap[d.acd] = acdMap[d.acd] || { count: 0, acv: 0 };
    acdMap[d.acd].count++;
    acdMap[d.acd].acv += d.usd_acv || 0;
  });
  const acdHtml = Object.entries(acdMap).sort((a,b) => b[1].acv - a[1].acv).map(([k, s]) => {
    return `<div class="row"><span class="l">${k}</span><span class="r">${s.count} &middot; ${fmtUSD(s.acv)}</span></div>`;
  }).join('') || '<div class="muted">No data</div>';
  document.getElementById('sideAcd').innerHTML = acdHtml;

  // By Region
  const regionMap = {};
  filtered.forEach(d => {
    const r = d.region || 'Unspecified';
    regionMap[r] = (regionMap[r] || 0) + 1;
  });
  const regionHtml = Object.entries(regionMap).sort((a,b) => b[1]-a[1]).map(([k, c]) => {
    return `<div class="row"><span class="l">${k}</span><span class="r">${c}</span></div>`;
  }).join('') || '<div class="muted">No data</div>';
  document.getElementById('sideRegion').innerHTML = regionHtml;
}

function dealRowHtml(d, showAccount) {
  const acctCell = showAccount
    ? `<span class="${d.account_name !== d.top_parent_name ? 'muted' : ''}">${d.account_name}</span>`
    : '';
  const fedrampBadge = d.fedramp === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : '';
  return `<tr class="deal-row">
    <td><a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank" rel="noopener">${d.name}</a>${fedrampBadge}</td>
    <td>${acctCell}</td>
    <td><span class="stage-badge" style="background:${STAGE_COLORS[d.stage_num]}">${d.stage_num} &middot; ${d.stage_label}</span></td>
    <td>${fmtDate(d.close_date)}</td>
    <td>${fmtUSD(d.usd_acv)}${d.currency && d.currency !== 'USD' ? '<div class="muted">' + d.native_acv.toLocaleString('en-US', {maximumFractionDigits:0}) + ' ' + d.currency + '</div>' : ''}</td>
    <td><span class="pill" style="background:${acdColor(d.acd)}">${d.acd}</span></td>
    <td>${regionLabel(d)}</td>
    <td>${d.owner || ''}</td>
  </tr>`;
}

function renderFlat(filtered) {
  const sorted = [...filtered].sort((a, b) => {
    let av = a[sortState.key], bv = b[sortState.key];
    if (sortState.key === 'usd_acv') { av = av || 0; bv = bv || 0; }
    if (av === null || av === undefined) av = '';
    if (bv === null || bv === undefined) bv = '';
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return -1 * sortState.dir;
    if (av > bv) return 1 * sortState.dir;
    return 0;
  });
  document.getElementById('tbody').innerHTML = sorted.map(d => dealRowHtml(d, true)).join('');
}

function renderGrouped(filtered) {
  const groups = {};
  filtered.forEach(d => {
    const key = d.top_parent_name || d.account_name;
    groups[key] = groups[key] || [];
    groups[key].push(d);
  });
  const groupArr = Object.entries(groups).map(([name, deals]) => {
    const totalAcv = deals.reduce((s, d) => s + (d.usd_acv || 0), 0);
    const acdSet = [...new Set(deals.map(d => d.acd))];
    deals.sort((a, b) => (a.close_date || '').localeCompare(b.close_date || ''));
    return { name, deals, totalAcv, acdSet };
  }).sort((a, b) => b.totalAcv - a.totalAcv);

  let html = '';
  groupArr.forEach((g, idx) => {
    const gid = 'grp' + idx;
    const collapsed = collapsedAccounts.has(g.name);
    const badges = g.acdSet.map(a => `<span class="pill" style="background:${acdColor(a)}">${a}</span>`).join(' ');
    html += `<tr class="account-row ${collapsed ? 'collapsed' : ''}" data-gid="${gid}">
      <td colspan="8"><span class="caret">&#9660;</span>
        <span class="acct-name">${g.name}</span>
        <span class="acct-meta">${g.deals.length} deal${g.deals.length === 1 ? '' : 's'} &middot; ${badges} &middot; ${fmtUSD(g.totalAcv)}</span>
      </td>
    </tr>`;
    g.deals.forEach(d => {
      html += collapsed ? '' : dealRowHtml(d, d.account_name !== g.name).replace('<tr class="deal-row">', `<tr class="deal-row" data-parent="${gid}">`);
    });
  });
  document.getElementById('tbody').innerHTML = html;

  document.querySelectorAll('tr.account-row').forEach(row => {
    row.addEventListener('click', () => {
      const name = groupArr.find((g, i) => 'grp' + i === row.dataset.gid).name;
      if (collapsedAccounts.has(name)) collapsedAccounts.delete(name);
      else collapsedAccounts.add(name);
      renderTable();
    });
  });
}

function renderTable() {
  const filtered = applyFilters();
  renderStats(filtered);
  renderSidebar(filtered);

  const accounts = new Set(filtered.map(d => d.top_parent_name));
  document.getElementById('resultCount').textContent = `${filtered.length} deals · ${accounts.size} accounts`;

  if (sortState.key) {
    renderFlat(filtered);
  } else {
    renderGrouped(filtered);
  }

  document.querySelectorAll('thead th').forEach(th => {
    th.querySelector('.sort-arrow') && th.querySelector('.sort-arrow').remove();
    if (th.dataset.key === sortState.key) {
      const span = document.createElement('span');
      span.className = 'sort-arrow';
      span.textContent = sortState.dir === 1 ? '▲' : '▼';
      th.appendChild(span);
    }
  });
}

function setupSorting() {
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortState.key !== key) {
        sortState = { key, dir: 1 };
      } else if (sortState.dir === 1) {
        sortState.dir = -1;
      } else {
        sortState = { key: null, dir: 1 };
      }
      renderTable();
    });
  });
}

function populateFilterOptions() {
  const stageSel = document.getElementById('stageFilter');
  const stages = [...new Set(DEALS.map(d => d.stage_num))].sort();
  stages.forEach(s => {
    const label = DEALS.find(d => d.stage_num === s).stage_label;
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s + ' · ' + label;
    stageSel.appendChild(opt);
  });

  const regionSel = document.getElementById('regionFilter');
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });

  const acdSel = document.getElementById('acdFilter');
  const acds = [...new Set(DEALS.map(d => d.acd))].sort();
  acds.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    acdSel.appendChild(opt);
  });
}

function init() {
  populateFilterOptions();
  setupSorting();
  document.getElementById('searchBox').addEventListener('input', renderTable);
  document.getElementById('stageFilter').addEventListener('change', renderTable);
  document.getElementById('regionFilter').addEventListener('change', renderTable);
  document.getElementById('acdFilter').addEventListener('change', renderTable);
  renderTable();
}
</script>
