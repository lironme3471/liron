<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Pipeline Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --nice-blue: #3694fc;
    --nice-charcoal: #21212b;
    --nice-indigo: #6100FF;
    --border: #e2e5ea;
    --bg: #f5f6f8;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--nice-charcoal);
  }

  /* Password gate */
  #gate {
    position: fixed; inset: 0; background: #21212b;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 40px 36px;
    width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  #gate .logo { font-weight: 800; font-size: 22px; color: var(--nice-blue); letter-spacing: 1px; margin-bottom: 4px;}
  #gate h1 { font-size: 16px; margin: 0 0 20px; color: var(--muted); font-weight: 500;}
  #gate input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
    background: var(--nice-blue); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #gate button:hover { background: #2a7fe0; }
  #gate .err { color: #e0245e; font-size: 12px; height: 16px; margin-bottom: 8px; }

  #app { display: none; }

  header.top {
    background: var(--nice-charcoal); color: #fff; padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header.top .title { font-size: 18px; font-weight: 700; }
  header.top .title span { color: var(--nice-blue); }
  header.top .meta { font-size: 12px; color: #9aa0ab; }

  .container { max-width: 1400px; margin: 0 auto; padding: 24px 20px 60px; }

  .stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 22px;
  }
  .stat-card {
    background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
  }
  .stat-card .num { font-size: 24px; font-weight: 800; color: var(--nice-charcoal); }
  .stat-card .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .04em;}

  .layout { display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start; }

  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 14px;
  }
  .filters input[type=text] {
    flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
  }
  .filters select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff;
  }
  .count-line { font-size: 12px; color: var(--muted); margin: 6px 2px 12px; }

  table.deals { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table.deals th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    padding: 10px 12px; border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap;
    background: #fafbfc;
  }
  table.deals th:hover { color: var(--nice-blue); }
  table.deals td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  table.deals tr.account-row { background: #eef4fe; cursor: pointer; }
  table.deals tr.account-row td { font-weight: 700; padding: 12px; }
  table.deals tr.account-row:hover { background: #e2edfd; }
  table.deals tr.deal-row td.name-cell { padding-left: 28px; }
  table.deals tr.deal-row.hidden-collapsed { display: none; }
  table.deals a.opp-link { color: var(--nice-blue); text-decoration: none; }
  table.deals a.opp-link:hover { text-decoration: underline; }
  .muted-acct { color: var(--muted); font-size: 12px; }

  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap;
  }
  .stage-badge {
    display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap;
  }
  .fedramp-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; color: #fff; background: #6100FF; margin-left: 6px;
  }

  .sidebar { display: flex; flex-direction: column; gap: 16px; }
  .side-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .side-card h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .side-row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f0f1f3; }
  .side-row:last-child { border-bottom: none; }
  .side-row .side-lbl { display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .side-row .side-val { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

  .sort-arrow { font-size: 10px; margin-left: 3px; }

  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <h1>eHub Pipeline Dashboard</h1>
    <div class="err" id="gateErr"></div>
    <input type="password" id="pw" placeholder="Password" />
    <button onclick="checkPw()">Access Dashboard</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="title">eHub Pipeline <span>Dashboard</span></div>
    <div class="meta">Real-Time Recording pipeline &middot; open stages 0&ndash;5 &middot; generated 2026-09-14 10:35 UTC</div>
  </header>

  <div class="container">
    <div class="stats" id="statsBar"></div>

    <div class="layout">
      <div>
        <div class="filters">
          <input type="text" id="searchBox" placeholder="Search opportunity, account, owner...">
          <select id="stageFilter"><option value="">All Stages</option></select>
          <select id="regionFilter"><option value="">All Regions</option></select>
          <select id="acdFilter"><option value="">All ACDs</option></select>
        </div>
        <div class="count-line" id="countLine"></div>
        <table class="deals">
          <thead>
            <tr>
              <th data-key="name">Opportunity</th>
              <th data-key="account">Account</th>
              <th data-key="stageNum">Stage</th>
              <th data-key="closeDate">Close Date</th>
              <th data-key="usdAcv">ACV</th>
              <th data-key="acd">ACD</th>
              <th data-key="region">Region / Territory</th>
              <th data-key="owner">Owner</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="sidebar">
        <div class="side-card">
          <h3>By Stage</h3>
          <div id="byStage"></div>
        </div>
        <div class="side-card">
          <h3>By ACD</h3>
          <div id="byAcd"></div>
        </div>
        <div class="side-card">
          <h3>By Region</h3>
          <div id="byRegion"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const PW_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

async function checkPw() {
  const val = document.getElementById('pw').value;
  const enc = new TextEncoder().encode(val);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  const hex = Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hex === PW_HASH) {
    sessionStorage.setItem('ehub_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('gateErr').textContent = 'Incorrect password';
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

if (sessionStorage.getItem('ehub_auth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.addEventListener('DOMContentLoaded', initApp);
}

const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

const ACD_COLORS = {
  'Cisco Systems': '#049fd9',
  'Cisco': '#049fd9',
  'Avaya': '#ff4b1f',
  'Amazon Connect': '#ff9900',
  'Genesys': '#6100FF',
  'Genesys Engage': '#6100FF',
  'Genesys SIPREC': '#9457ff',
  'Genesys CX': '#43009e',
  'Five9': '#00a887',
  'NICE CXone Mpower': '#3694fc',
  'MS Teams': '#5059c9',
  'UJET': '#00b3a4',
  'Other': '#8a8f98',
  'Unknown': '#8a8f98',
};
function acdColor(a) { return ACD_COLORS[a] || '#556'; }

function stageColor(n) {
  n = String(n);
  if (n === '0' || n === '1') return '#3694fc';
  if (n === '2' || n === '3') return '#e6a700';
  if (n === '4') return '#6100FF';
  if (n === '5') return '#1aa260';
  return '#8a8f98';
}

let sortState = { key: null, dir: 'grouped' }; // 'grouped' | 'asc' | 'desc'

function fmtUsd(n) {
  return '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits: 0});
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function populateFilterOptions() {
  const stages = [...new Set(DEALS.map(d => d.stageNum))].sort();
  const stageSel = document.getElementById('stageFilter');
  const stageLabelMap = {};
  DEALS.forEach(d => stageLabelMap[d.stageNum] = d.stageLabel);
  stages.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = stageLabelMap[s];
    stageSel.appendChild(opt);
  });

  const regions = [...new Set(DEALS.map(d => d.region))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });

  const acds = [...new Set(DEALS.map(d => d.acd))].sort();
  const acdSel = document.getElementById('acdFilter');
  acds.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    acdSel.appendChild(opt);
  });
}

function getFiltered() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;
  return DEALS.filter(d => {
    if (stage && d.stageNum !== stage) return false;
    if (region && d.region !== region) return false;
    if (acd && d.acd !== acd) return false;
    if (q) {
      const hay = (d.name + ' ' + d.account + ' ' + d.parent + ' ' + d.owner).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

const collapsedAccounts = new Set();

function render() {
  const filtered = getFiltered();
  renderStats(filtered);
  renderSidebar(filtered);
  renderTable(filtered);
  renderCountLine(filtered);
  renderSortArrows();
}

function renderCountLine(filtered) {
  const accts = new Set(filtered.map(d => d.parent));
  document.getElementById('countLine').textContent = `${filtered.length} deals · ${accts.size} accounts`;
}

function renderStats(filtered) {
  const totalAcv = filtered.reduce((s,d) => s + d.usdAcv, 0);
  const accts = new Set(filtered.map(d => d.parent));
  const fedrampCount = filtered.filter(d => d.fedramp === 'Yes').length;
  const acdCount = new Set(filtered.map(d => d.acd)).size;
  const cards = [
    { num: filtered.length, lbl: 'Open Deals' },
    { num: accts.size, lbl: 'Accounts' },
    { num: fmtUsd(totalAcv), lbl: 'Total Pipeline ACV' },
    { num: fedrampCount, lbl: 'FedRAMP Deals' },
    { num: acdCount, lbl: 'Distinct ACDs' },
  ];
  document.getElementById('statsBar').innerHTML = cards.map(c =>
    `<div class="stat-card"><div class="num">${c.num}</div><div class="lbl">${c.lbl}</div></div>`
  ).join('');
}

function renderSidebar(filtered) {
  const byStage = {}, byAcd = {}, byRegionCount = {};
  filtered.forEach(d => {
    byStage[d.stageNum] = byStage[d.stageNum] || { count: 0, acv: 0, label: d.stageLabel };
    byStage[d.stageNum].count++; byStage[d.stageNum].acv += d.usdAcv;

    byAcd[d.acd] = byAcd[d.acd] || { count: 0, acv: 0 };
    byAcd[d.acd].count++; byAcd[d.acd].acv += d.usdAcv;

    const regionKey = d.region.split(' / ')[0];
    byRegionCount[regionKey] = (byRegionCount[regionKey] || 0) + 1;
  });

  const stageHtml = Object.keys(byStage).sort().map(k => {
    const v = byStage[k];
    return `<div class="side-row"><div class="side-lbl"><span class="dot" style="background:${stageColor(k)}"></span>${escapeHtml(v.label)}</div><div class="side-val">${v.count} · ${fmtUsd(v.acv)}</div></div>`;
  }).join('') || '<div class="side-row">No data</div>';
  document.getElementById('byStage').innerHTML = stageHtml;

  const acdHtml = Object.keys(byAcd).sort((a,b)=>byAcd[b].acv-byAcd[a].acv).map(k => {
    const v = byAcd[k];
    return `<div class="side-row"><div class="side-lbl"><span class="dot" style="background:${acdColor(k)}"></span>${escapeHtml(k)}</div><div class="side-val">${v.count} · ${fmtUsd(v.acv)}</div></div>`;
  }).join('') || '<div class="side-row">No data</div>';
  document.getElementById('byAcd').innerHTML = acdHtml;

  const regionHtml = Object.keys(byRegionCount).sort((a,b)=>byRegionCount[b]-byRegionCount[a]).map(k => {
    return `<div class="side-row"><div class="side-lbl">${escapeHtml(k)}</div><div class="side-val">${byRegionCount[k]}</div></div>`;
  }).join('') || '<div class="side-row">No data</div>';
  document.getElementById('byRegion').innerHTML = regionHtml;
}

function dealRowHtml(d, showAccount) {
  const stage = `<span class="stage-badge" style="background:${stageColor(d.stageNum)}">${d.stageNum} · ${escapeHtml(d.stageLabel.split('· ')[1] || d.stageLabel)}</span>`;
  const acd = `<span class="pill" style="background:${acdColor(d.acd)}">${escapeHtml(d.acd)}</span>`;
  const fedramp = d.fedramp === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : '';
  const acctCell = showAccount ? escapeHtml(d.account) : (d.account !== d.parent ? `<span class="muted-acct">${escapeHtml(d.account)}</span>` : '');
  return `<tr class="deal-row" data-parent="${escapeHtml(d.parent)}">
    <td class="name-cell"><a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank" rel="noopener">${escapeHtml(d.name)}</a>${fedramp}</td>
    <td>${acctCell}</td>
    <td>${stage}</td>
    <td>${d.closeDate || ''}</td>
    <td>${fmtUsd(d.usdAcv)}${d.currency && d.currency !== 'USD' ? `<div class="muted-acct">${Number(d.nativeAcv).toLocaleString()} ${d.currency}</div>` : ''}</td>
    <td>${acd}</td>
    <td>${escapeHtml(d.region)}</td>
    <td>${escapeHtml(d.owner || '')}</td>
  </tr>`;
}

function renderTable(filtered) {
  const tbody = document.getElementById('tbody');

  if (sortState.dir !== 'grouped' && sortState.key) {
    const sorted = [...filtered].sort((a,b) => {
      let av = a[sortState.key], bv = b[sortState.key];
      if (sortState.key === 'usdAcv' || sortState.key === 'stageNum') { av = Number(av); bv = Number(bv); }
      if (av < bv) return sortState.dir === 'asc' ? -1 : 1;
      if (av > bv) return sortState.dir === 'asc' ? 1 : -1;
      return 0;
    });
    tbody.innerHTML = sorted.map(d => dealRowHtml(d, true)).join('');
    return;
  }

  // grouped by account (parent), sorted by total ACV desc
  const groups = {};
  filtered.forEach(d => {
    groups[d.parent] = groups[d.parent] || { deals: [], acv: 0 };
    groups[d.parent].deals.push(d);
    groups[d.parent].acv += d.usdAcv;
  });
  const groupKeys = Object.keys(groups).sort((a,b) => groups[b].acv - groups[a].acv);

  let rows = '';
  groupKeys.forEach(gk => {
    const g = groups[gk];
    g.deals.sort((a,b) => (a.closeDate||'').localeCompare(b.closeDate||''));
    const acdSet = [...new Set(g.deals.map(d => d.acd))];
    const acdBadges = acdSet.map(a => `<span class="pill" style="background:${acdColor(a)}">${escapeHtml(a)}</span>`).join(' ');
    const collapsed = collapsedAccounts.has(gk);
    rows += `<tr class="account-row" data-account="${escapeHtml(gk)}" onclick="toggleAccount('${escapeHtml(gk).replace(/'/g,"\'")}')">
      <td colspan="4">${collapsed ? '▶' : '▼'} ${escapeHtml(gk)} <span class="muted-acct">(${g.deals.length} deal${g.deals.length>1?'s':''})</span></td>
      <td>${fmtUsd(g.acv)}</td>
      <td colspan="3">${acdBadges}</td>
    </tr>`;
    g.deals.forEach(d => {
      const hiddenClass = collapsed ? ' hidden-collapsed' : '';
      rows += dealRowHtml(d, false).replace('class="deal-row"', `class="deal-row${hiddenClass}"`);
    });
  });
  tbody.innerHTML = rows || '<tr><td colspan="8" style="text-align:center;padding:24px;color:#888;">No deals match filters</td></tr>';
}

function toggleAccount(name) {
  if (collapsedAccounts.has(name)) collapsedAccounts.delete(name);
  else collapsedAccounts.add(name);
  renderTable(getFiltered());
}

function renderSortArrows() {
  document.querySelectorAll('table.deals th').forEach(th => {
    th.querySelectorAll('.sort-arrow').forEach(e => e.remove());
    if (th.dataset.key === sortState.key && sortState.dir !== 'grouped') {
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = sortState.dir === 'asc' ? '▲' : '▼';
      th.appendChild(arrow);
    }
  });
}

document.querySelectorAll('table.deals th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortState.key !== key) {
      sortState = { key, dir: 'asc' };
    } else if (sortState.dir === 'asc') {
      sortState = { key, dir: 'desc' };
    } else if (sortState.dir === 'desc') {
      sortState = { key: null, dir: 'grouped' };
    }
    renderTable(getFiltered());
    renderSortArrows();
  });
});

['searchBox'].forEach(id => document.getElementById(id).addEventListener('input', render));
['stageFilter','regionFilter','acdFilter'].forEach(id => document.getElementById(id).addEventListener('change', render));

function initApp() {
  populateFilterOptions();
  render();
}
</script>
