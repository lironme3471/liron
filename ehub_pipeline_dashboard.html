<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>eHub Pipeline Dashboard</title>
<style>
:root{--blue:#3694fc;--charcoal:#21212b;--indigo:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;
--bg:#f5f6fa;--card:#fff;--line:#e6e8ef;--muted:#8a8f9c;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Be Vietnam Pro','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--charcoal);}
#gate{position:fixed;inset:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center;z-index:1000;}
#gate .card{background:#fff;border-radius:16px;padding:40px 36px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
#gate h1{color:var(--blue);font-size:22px;margin:0 0 4px;}
#gate p{color:var(--muted);font-size:13px;margin:0 0 22px;}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;font-size:15px;margin-bottom:12px;}
#gate button{width:100%;padding:12px;background:var(--blue);color:#fff;border:0;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;}
#gate button:hover{background:#227ae0;}
#gate .err{color:var(--coral);font-size:12px;height:16px;margin-top:8px;}
#app{display:none;padding:22px 28px 60px;}
header.top{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;}
header.top h1{font-size:24px;margin:0;color:var(--charcoal);}
header.top .badge{background:var(--blue);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.sub{color:var(--muted);font-size:12px;margin-bottom:18px;}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:140px;flex:1;}
.stat .n{font-size:24px;font-weight:700;color:var(--charcoal);}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
.layout{display:flex;gap:20px;align-items:flex-start;}
.main{flex:1;min-width:0;}
.side{width:260px;flex-shrink:0;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.filters input,.filters select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
.filters input{flex:1;min-width:180px;}
.count{font-size:12px;color:var(--muted);margin-bottom:10px;}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);}
th{background:#fafbfd;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:11px 12px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);white-space:nowrap;}
th:hover{color:var(--charcoal);}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:top;}
tr.acct{background:#f0f4fb;cursor:pointer;}
tr.acct td{font-weight:600;color:var(--charcoal);}
tr.acct .caret{display:inline-block;width:14px;color:var(--blue);}
tr.deal td:first-child{padding-left:26px;}
a.opp{color:var(--blue);text-decoration:none;}
a.opp:hover{text-decoration:underline;}
.muted{color:var(--muted);font-size:11px;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;}
.stg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;}
.fr{background:var(--indigo);color:#fff;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700;margin-left:5px;}
.side .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 10px;}
.side .row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #f0f1f5;}
.side .row:last-child{border-bottom:0;}
.side .row .v{color:var(--muted);}
.acdbadges{display:inline-flex;gap:4px;margin-left:8px;}
.acdbadges .pill{font-size:9px;padding:1px 6px;}
.tot{color:var(--blue);}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h1>eHub Pipeline</h1>
    <p>NiCE Engagement Hub &middot; Real-Time Recording</p>
    <input type="password" id="pw" placeholder="Password" autofocus/>
    <button id="go">Access Dashboard</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>eHub Pipeline Dashboard</h1>
    <span class="badge">OPEN PIPELINE</span>
  </header>
  <div class="sub">Engagement Hub (Real-Time Recording) &middot; open stages 0&ndash;5 &middot; ACV in USD &middot; generated 2026-08-06</div>

  <div class="stats" id="stats"></div>

  <div class="layout">
    <div class="main">
      <div class="filters">
        <input type="text" id="q" placeholder="Search opportunity, account, owner..."/>
        <select id="fStage"><option value="">All stages</option></select>
        <select id="fRegion"><option value="">All regions</option></select>
        <select id="fAcd"><option value="">All ACD</option></select>
      </div>
      <div class="count" id="count"></div>
      <table>
        <thead><tr>
          <th data-k="name">Opportunity</th>
          <th data-k="account">Account</th>
          <th data-k="stage">Stage</th>
          <th data-k="close">Close Date</th>
          <th data-k="usdACV">ACV (USD)</th>
          <th data-k="acd">ACD</th>
          <th data-k="region">Region / Territory</th>
          <th data-k="owner">Owner</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="side">
      <div class="box"><h3>By Stage</h3><div id="byStage"></div></div>
      <div class="box"><h3>By ACD</h3><div id="byAcd"></div></div>
      <div class="box"><h3>By Region</h3><div id="byRegion"></div></div>
    </div>
  </div>
</div>

const LINKBASE="https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

async function checkPw(){
  const val=document.getElementById('pw').value;
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(val));
  const hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hex===STAGE_HASH){sessionStorage.setItem('ehub_ok','1');reveal();}
  else{document.getElementById('err').textContent='Incorrect password';}
}
function reveal(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';render();}
document.getElementById('go').addEventListener('click',checkPw);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();});
if(sessionStorage.getItem('ehub_ok')==='1')reveal();

const fmt=n=>'$'+Math.round(n).toLocaleString();
function stageNum(s){const m=s.match(/^(\d)/);return m?parseInt(m[1]):9;}
function stageShort(s){return s.replace(/^\d+\s*-\s*/,'');}
function stageColor(n){if(n<=1)return'#e3f0ff';if(n<=3)return'#fff4d6';if(n===4)return'#ece0ff';return'#dcf7ec';}
function stageText(n){if(n<=1)return'#1e6fd0';if(n<=3)return'#a67c00';if(n===4)return'#6100FF';return'#12915a';}
const ACD_COLORS={'Cisco Systems':'#1BA0D7','Genesys':'#FF4F1F','Amazon Connect':'#FF9900','Avaya':'#CC0000','MS Teams':'#5059C9','NICE CXone Mpower':'#3694fc','UJET':'#6c5ce7','Other':'#8a8f9c','Unknown':'#b0b4bf'};
const acdColor=a=>ACD_COLORS[a]||'#8a8f9c';

let sortKey=null, sortDir=1; // null = grouped

function regionLabel(r){return r.territory?r.region+' / '+r.territory:(r.region||'—');}

function getFiltered(){
  const q=document.getElementById('q').value.toLowerCase();
  const fs=document.getElementById('fStage').value;
  const fr=document.getElementById('fRegion').value;
  const fa=document.getElementById('fAcd').value;
  return DATA.filter(r=>{
    if(fs && String(stageNum(r.stage))!==fs)return false;
    if(fr && r.region!==fr)return false;
    if(fa && r.acd!==fa)return false;
    if(q){const hay=(r.name+' '+r.account+' '+r.group+' '+r.owner).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}

function dealRow(r,showAcct){
  const n=stageNum(r.stage);
  const acct=showAcct?('<td>'+r.account+'</td>'):('<td>'+(r.account&&r.account!==r.group?'<span class="muted">'+r.account+'</span>':'')+'</td>');
  return '<tr class="deal">'+
    '<td><a class="opp" href="'+LINKBASE+r.id+'/view" target="_blank">'+r.name+'</a>'+(r.fedramp==='Yes'?'<span class="fr">FedRAMP</span>':'')+'</td>'+
    acct+
    '<td><span class="stg" style="background:'+stageColor(n)+';color:'+stageText(n)+'"><b>'+n+'</b> &middot; '+stageShort(r.stage)+'</span></td>'+
    '<td>'+(r.close||'—')+'</td>'+
    '<td>'+fmt(r.usdACV)+(r.curr&&r.curr!=='USD'?'<div class="muted">'+Math.round(r.nativeACV).toLocaleString()+' '+r.curr+'</div>':'')+'</td>'+
    '<td><span class="pill" style="background:'+acdColor(r.acd)+'">'+r.acd+'</span></td>'+
    '<td>'+regionLabel(r)+'</td>'+
    '<td>'+r.owner+'</td>'+
  '</tr>';
}

const collapsed={};
function renderTable(){
  const rows=getFiltered();
  const tb=document.getElementById('tbody');
  let html='';
  if(sortKey===null){
    // group by account
    const groups={};
    rows.forEach(r=>{(groups[r.group]=groups[r.group]||[]).push(r);});
    const gk=Object.keys(groups).sort((a,b)=>{
      const ta=groups[a].reduce((s,r)=>s+r.usdACV,0), tb2=groups[b].reduce((s,r)=>s+r.usdACV,0);
      return tb2-ta;});
    gk.forEach(g=>{
      const gr=groups[g].slice().sort((a,b)=>(a.close||'').localeCompare(b.close||''));
      const tot=gr.reduce((s,r)=>s+r.usdACV,0);
      const acds=[...new Set(gr.map(r=>r.acd))];
      const badges='<span class="acdbadges">'+acds.map(a=>'<span class="pill" style="background:'+acdColor(a)+'">'+a+'</span>').join('')+'</span>';
      const isC=collapsed[g];
      html+='<tr class="acct" data-g="'+g.replace(/"/g,'&quot;')+'"><td colspan="4"><span class="caret">'+(isC?'▸':'▾')+'</span>'+g+' <span class="muted">('+gr.length+' deal'+(gr.length>1?'s':'')+')</span>'+badges+'</td><td class="tot">'+fmt(tot)+'</td><td colspan="3"></td></tr>';
      if(!isC)gr.forEach(r=>{html+=dealRow(r,false);});
    });
    document.getElementById('count').textContent=rows.length+' deals · '+gk.length+' accounts';
  } else {
    const sorted=rows.slice().sort((a,b)=>{
      let x=a[sortKey],y=b[sortKey];
      if(sortKey==='usdACV'){x=a.usdACV;y=b.usdACV;}
      else if(sortKey==='stage'){x=stageNum(a.stage);y=stageNum(b.stage);}
      else{x=(x||'').toString().toLowerCase();y=(y||'').toString().toLowerCase();}
      if(x<y)return -1*sortDir;if(x>y)return 1*sortDir;return 0;});
    sorted.forEach(r=>{html+=dealRow(r,true);});
    const accts=new Set(rows.map(r=>r.group));
    document.getElementById('count').textContent=rows.length+' deals · '+accts.size+' accounts';
  }
  tb.innerHTML=html;
  tb.querySelectorAll('tr.acct').forEach(tr=>{tr.addEventListener('click',()=>{const g=tr.getAttribute('data-g');collapsed[g]=!collapsed[g];renderTable();});});
}

function renderSide(){
  const rows=getFiltered();
  const byS={},byA={},byR={};
  rows.forEach(r=>{
    const sn=stageNum(r.stage);
    byS[sn]=byS[sn]||{c:0,v:0};byS[sn].c++;byS[sn].v+=r.usdACV;
    byA[r.acd]=byA[r.acd]||{c:0,v:0};byA[r.acd].c++;byA[r.acd].v+=r.usdACV;
    const rg=r.region||'—';byR[rg]=(byR[rg]||0)+1;
  });
  document.getElementById('byStage').innerHTML=Object.keys(byS).sort().map(k=>'<div class="row"><span>'+k+' · '+stageShort(DATA.find(r=>stageNum(r.stage)==k).stage)+'</span><span class="v">'+byS[k].c+' · '+fmt(byS[k].v)+'</span></div>').join('');
  document.getElementById('byAcd').innerHTML=Object.keys(byA).sort((a,b)=>byA[b].v-byA[a].v).map(k=>'<div class="row"><span><span class="pill" style="background:'+acdColor(k)+'">'+k+'</span></span><span class="v">'+byA[k].c+' · '+fmt(byA[k].v)+'</span></div>').join('');
  document.getElementById('byRegion').innerHTML=Object.keys(byR).sort((a,b)=>byR[b]-byR[a]).map(k=>'<div class="row"><span>'+k+'</span><span class="v">'+byR[k]+'</span></div>').join('');
}

function renderStats(){
  const rows=getFiltered();
  const tot=rows.reduce((s,r)=>s+r.usdACV,0);
  const accts=new Set(rows.map(r=>r.group)).size;
  const fr=rows.filter(r=>r.fedramp==='Yes').length;
  const acd=new Set(rows.map(r=>r.acd)).size;
  document.getElementById('stats').innerHTML=
    stat(rows.length,'Open Deals')+stat(accts,'Accounts')+stat(fmt(tot),'Total Pipeline ACV')+stat(fr,'FedRAMP Deals')+stat(acd,'Distinct ACD');
}
function stat(n,l){return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';}

function render(){renderStats();renderSide();renderTable();}

function initFilters(){
  const stages=[...new Set(DATA.map(r=>stageNum(r.stage)))].sort();
  const fS=document.getElementById('fStage');
  stages.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s+' · '+stageShort(DATA.find(r=>stageNum(r.stage)===s).stage);fS.appendChild(o);});
  const regs=[...new Set(DATA.map(r=>r.region).filter(Boolean))].sort();
  const fR=document.getElementById('fRegion');
  regs.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;fR.appendChild(o);});
  const acds=[...new Set(DATA.map(r=>r.acd))].sort();
  const fA=document.getElementById('fAcd');
  acds.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;fA.appendChild(o);});
  ['q','fStage','fRegion','fAcd'].forEach(id=>document.getElementById(id).addEventListener('input',render));
  document.querySelectorAll('th[data-k]').forEach(th=>{
    th.addEventListener('click',()=>{
      const k=th.getAttribute('data-k');
      if(sortKey!==k){sortKey=k;sortDir=1;}
      else if(sortDir===1){sortDir=-1;}
      else{sortKey=null;} // third click -> grouped
      document.querySelectorAll('th[data-k]').forEach(t=>t.textContent=t.textContent.replace(/[ ▲▼]+$/,''));
      if(sortKey===k)th.textContent=th.textContent.replace(/[ ▲▼]+$/,'')+(sortDir===1?' ▲':' ▼');
      render();
    });
  });
}
initFilters();
</script>
