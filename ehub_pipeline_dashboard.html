<style>
:root{--blue:#3694fc;--char:#21212b;--ind:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;--bg:#f4f6fa;--line:#e3e7ee;--mut:#6b7280}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--char);font-size:13px}
#gate{position:fixed;inset:0;background:#21212b;display:flex;align-items:center;justify-content:center;z-index:9999}
#gate .card{background:#fff;border-radius:12px;padding:32px 36px;width:340px;text-align:center}
#gate h2{margin:6px 0 4px;font-size:18px}
#gate .brand{font-weight:800;letter-spacing:2px;color:var(--blue);font-size:22px}
#gate input{width:100%;padding:10px;border:1px solid #cbd2dc;border-radius:6px;margin:14px 0 10px;font-size:14px}
#gate button{width:100%;padding:10px;background:var(--blue);color:#fff;border:0;border-radius:6px;font-size:14px;cursor:pointer}
#gate .err{color:#d33;font-size:12px;height:16px;margin-top:6px}
header{background:var(--char);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px}
header .brand{font-weight:800;letter-spacing:2px;color:var(--blue);font-size:20px}
header h1{font-size:17px;margin:0;font-weight:600}
header .upd{margin-left:auto;color:#9aa3b2;font-size:12px}
.stats{display:flex;gap:12px;padding:16px 24px 4px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:130px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.layout{display:flex;gap:16px;padding:12px 24px 40px;align-items:flex-start}
.side{width:250px;flex:none;display:flex;flex-direction:column;gap:12px}
.box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.box h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.box .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:12px}
.box .row i{font-style:normal;color:var(--mut)}
.main{flex:1;min-width:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input,.filters select{padding:7px 9px;border:1px solid #cbd2dc;border-radius:6px;font-size:13px;background:#fff}
.filters input{width:220px}
#cnt{color:var(--mut);font-size:12px;margin-left:4px}
.xl{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{background:#eef1f6;text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#4b5563;cursor:pointer;white-space:nowrap;user-select:none}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.grp td{background:#f7f9fc;font-weight:600;cursor:pointer}
tr.grp .tw{display:inline-block;width:14px;color:var(--mut)}
tr.deal td:first-child{padding-left:30px}
td.num,th.num{text-align:right}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.mut{color:var(--mut)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff;white-space:nowrap}
.sb{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;white-space:nowrap}
.sb b{font-size:13px}
.s0,.s1{background:#dbeafe;color:#1d4ed8}.s2,.s3{background:#fef3c7;color:#92400e}.s4{background:#ede9fe;color:#6d28d9}.s5{background:#dcfce7;color:#166534}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-left:5px;vertical-align:middle}
.t-fed{background:#7c3aed;color:#fff}.t-as{background:#36EAD0;color:#21212b}.t-cp{background:#FF5B8A;color:#fff}
.badges .pill{margin-right:3px}
@media(max-width:900px){.layout{flex-direction:column}.side{width:100%}}
</style>
</head>

async function checkPw(){
  const val=document.getElementById('pw').value;
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(val));
    const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    if(hex===HASH){try{sessionStorage.setItem('ehub_ok','1')}catch(e){}document.getElementById('gate').style.display='none';}
    else document.getElementById('gerr').textContent='Incorrect password';
  }catch(e){document.getElementById('gerr').textContent='Unable to verify (secure context required)';}
}

function cmp(a,b){let x=a[sk],y=b[sk];if(sk==='region'){x=reg(a);y=reg(b)}if(typeof x==='string')return x.localeCompare(y)*sd;return(x-y)*sd}
function groupsOf(rows){
  const m={};rows.forEach(d=>{(m[d.group]=m[d.group]||{name:d.group,deals:[],tot:0}).deals.push(d)});
  const g=Object.values(m);g.forEach(x=>{x.tot=x.deals.reduce((s,d)=>s+d.usd,0);x.deals.sort((a,b)=>a.close<b.close?-1:a.close>b.close?1:0)});

    const open=!collapsed.has(g.name),acds=[...new Set(g.deals.map(d=>d.acd))];
    h+='<tr class="grp" data-g="'+esc(g.name)+'" onclick="tg(this.dataset.g)"><td colspan="4"><span class="tw">'+(open?'▾':'▸')+'</span>'+esc(g.name)+' <span class="mut" style="font-weight:400">· '+g.deals.length+' deal'+(g.deals.length>1?'s':'')+'</span></td><td class="num">'+usd(g.tot)+'</td><td colspan="3" class="badges">'+acds.map(pill).join('')+'</td></tr>';
    if(open)g.deals.forEach(d=>h+=dealRow(d,false));
  });
  document.getElementById('tb').innerHTML=h;
  const acc=new Set(rows.map(d=>d.group)).size;
  document.getElementById('cnt').textContent=rows.length+' deals · '+acc+' accounts';
  stats(rows,acc);
}
function tg(n){collapsed.has(n)?collapsed.delete(n):collapsed.add(n);render()}
function stats(rows,acc){
  const tot=rows.reduce((s,d)=>s+d.usd,0);
  const S=[[rows.length,'Open Deals'],[acc,'Accounts'],[usd(tot),'Pipeline ACV (USD)'],[rows.filter(d=>d.fed).length,'FedRAMP'],[new Set(rows.map(d=>d.acd)).size,'Distinct ACDs'],[rows.filter(d=>d.as).length,'AutoSummary'],[rows.filter(d=>d.cp).length,'Copilot']];
  document.getElementById('stats').innerHTML=S.map(s=>'<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>').join('');
  const agg=(f)=>{const m={};rows.forEach(d=>{const k=f(d);(m[k]=m[k]||{n:0,a:0});m[k].n++;m[k].a+=d.usd});return Object.entries(m)};
  const box=(t,arr,money)=>'<div class="box"><h3>'+t+'</h3>'+arr.map(([k,v])=>'<div class="row"><span>'+k+'</span><i>'+v.n+(money?' · '+usd(v.a):'')+'</i></div>').join('')+'</div>';
  document.getElementById('side').innerHTML=
    box('By Stage',agg(d=>d.stage).sort((a,b)=>a[0]-b[0]).map(([k,v])=>[stBadge(+k),v]),true)+
    box('By ACD',agg(d=>d.acd).sort((a,b)=>b[1].a-a[1].a).map(([k,v])=>[pill(k),v]),true)+
    box('By Region',agg(d=>d.region).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>[esc(k),v]),false);
}
function exportXl(){
  if(typeof XLSX==='undefined'){alert('Excel library failed to load (check network).');return;}
  let rows=filtered();
  if(sk)rows=[...rows].sort(cmp);
  else rows=groupsOf(rows).flatMap(g=>g.deals);
  const yn=b=>b?'Yes':'No';
  const json=rows.map(d=>({'Account Group':d.group,'Opportunity':d.name,'Opportunity Link':SF+d.id+'/view','Account':d.acct,'Stage':d.stage+' - '+STL[d.stage],'Close Date':d.close,'ACV (USD)':d.usd,'Native ACV':d.native,'Currency':d.cur,'ACD':d.acd,'FedRAMP':yn(d.fed),'AutoSummary':yn(d.as),'Copilot':yn(d.cp),'Region':d.region,'Territory':d.terr,'Owner':d.owner}));
  const ws=XLSX.utils.json_to_sheet(json);
  ws['!cols']=[28,60,14,36,32,12,14,14,9,22,9,12,9,14,22,22].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'eHub Pipeline');
  XLSX.writeFile(wb,'ehub_pipeline_2026-10-20.xlsx');
}
render();
</script>
