<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
  :root {
    --blue: #3694fc;
    --charcoal: #21212b;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --border: #e2e5ec;
    --text: #21212b;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, -apple-system, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  /* Password gate */
  #gate {
    position: fixed; inset: 0; background: #21212b;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 40px 36px;
    width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #gate .logo { font-weight: 700; font-size: 22px; color: var(--indigo); margin-bottom: 4px; letter-spacing: 0.5px;}
  #gate .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; margin-bottom: 14px; outline: none;
  }
  #gate input:focus { border-color: var(--blue); }
  #gate button {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: var(--blue); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  #gate button:hover { background: var(--indigo); }
  #gate .err { color: var(--coral); font-size: 12px; margin-top: 10px; min-height: 14px; }

  #app { display: none; max-width: 1500px; margin: 0 auto; padding: 24px 20px 60px; }
  header.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; flex-wrap: wrap; gap: 8px;}
  header.top h1 { font-size: 22px; margin: 0; color: var(--charcoal); }
  header.top .meta { color: var(--text-muted); font-size: 12px; }

  .stats-bar { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card {
    background: var(--card-bg); border-radius: 10px; padding: 14px 18px;
    flex: 1; min-width: 150px; border: 1px solid var(--border);
  }
  .stat-card .val { font-size: 22px; font-weight: 700; color: var(--indigo); }
  .stat-card .lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .sidebar { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); padding: 16px; }
  .sidebar h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin: 0 0 10px; }
  .sidebar .group { margin-bottom: 18px; }
  .sidebar .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid #f1f2f6; }
  .sidebar .row .name { color: var(--text); }
  .sidebar .row .num { color: var(--text-muted); font-weight: 600; white-space:nowrap; margin-left: 8px;}

  .main { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
  .filters { display: flex; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
  .filters input[type=text] {
    flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px;
  }
  .filters select {
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff;
  }
  .filters .count { font-size: 12px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; background: #f8f9fc; color: var(--text-muted);
    font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.3px;
    border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none;
  }
  thead th:hover { color: var(--indigo); }
  thead th .arrow { font-size: 10px; margin-left: 3px; }

  tbody tr.account-row { background: #f3f0ff; cursor: pointer; }
  tbody tr.account-row:hover { background: #ece6ff; }
  tbody tr.account-row td { padding: 9px 12px; font-weight: 700; color: var(--charcoal); border-bottom: 1px solid var(--border); }
  tbody tr.deal-row td { padding: 8px 12px; border-bottom: 1px solid #f1f2f6; vertical-align: middle; }
  tbody tr.deal-row:hover { background: #fafafe; }
  tbody tr.deal-row.hidden-collapsed { display: none; }

  a.opp-link { color: var(--blue); text-decoration: none; font-weight: 500; }
  a.opp-link:hover { text-decoration: underline; }

  .muted-account { color: var(--text-muted); font-size: 12px; }

  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px;
    font-weight: 600; color: #fff; white-space: nowrap;
  }
  .stage-badge {
    display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 600; color: #fff; white-space: nowrap;
  }
  .fedramp-badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 700;
    background: #6100FF; color: #fff; margin-left: 6px;
  }
  .chev { display: inline-block; width: 14px; transition: transform 0.15s; }
  .chev.collapsed { transform: rotate(-90deg); }

  .acv-cell { font-weight: 600; }
  .acc-total { color: var(--indigo); }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <div class="sub">eHub Pipeline Dashboard</div>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>eHub Pipeline Dashboard</h1>
    <div class="meta">Engagement Hub (Real-Time Recording) open pipeline &middot; rebuilt <span id="buildDate"></span></div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>

    <div class="main">
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search opportunity, account, owner...">
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <select id="acdFilter"><option value="">All ACDs</option></select>
        <span class="count" id="resultCount"></span>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th data-key="Name">Opportunity</th>
            <th data-key="GroupName">Account</th>
            <th data-key="StageNum">Stage</th>
            <th data-key="CloseDate">Close Date</th>
            <th data-key="usdACV">ACV</th>
            <th data-key="ACD">ACD</th>
            <th data-key="RegionDisplay">Region / Territory</th>
            <th data-key="OwnerName">Owner</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      </div>
    </div>
  </div>
</div>

async function checkPw(val) {
  const enc = new TextEncoder().encode(val);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  return hex === STORED_HASH;
}

function unlock() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initDashboard();
}

(function initGate(){
  try {
    if (sessionStorage.getItem('ehub_unlocked') === '1') {
      unlock();
      return;
    }
  } catch(e) {}

  document.getElementById('pwBtn').addEventListener('click', doCheck);
  document.getElementById('pwInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') doCheck();
  });

  async function doCheck() {
    const val = document.getElementById('pwInput').value;
    const ok = await checkPw(val);
    if (ok) {
      try { sessionStorage.setItem('ehub_unlocked', '1'); } catch(e) {}
      unlock();
    } else {
      document.getElementById('pwErr').textContent = 'Incorrect password.';
    }
  }
})();

function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[dt.getMonth()] + " " + dt.getDate() + ", " + dt.getFullYear();
}

let sortState = { key: null, dir: 1, mode: 'grouped' }; // mode: 'grouped' | 'sorted'

function populateFilterOptions() {
  const stages = [...new Set(DATA.map(d => d.StageNum + " · " + d.StageLabel))].sort();
  const stageSel = document.getElementById('stageFilter');
  const stageNums = [...new Set(DATA.map(d => d.StageNum))].sort();
  stageNums.forEach(n => {
    const label = DATA.find(d => d.StageNum === n).StageLabel;
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n + " · " + label;
    stageSel.appendChild(opt);
  });

  const regions = [...new Set(DATA.map(d => d.Region).filter(Boolean))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const opt = document.createElement('option'); opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });

  const acds = [...new Set(DATA.map(d => d.ACD))].sort();
  const acdSel = document.getElementById('acdFilter');
  acds.forEach(a => {
    const opt = document.createElement('option'); opt.value = a; opt.textContent = a;
    acdSel.appendChild(opt);
  });
}

function getFiltered() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;
  return DATA.filter(d => {
    if (stage && d.StageNum !== stage) return false;
    if (region && d.Region !== region) return false;
    if (acd && d.ACD !== acd) return false;
    if (q) {
      const hay = (d.Name + " " + d.AccountName + " " + (d.OwnerName||"") + " " + d.GroupName).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

const collapsedAccounts = new Set();

function render() {
  const filtered = getFiltered();
  renderTable(filtered);
  renderStats(filtered);
  renderSidebar(filtered);
  const accountCount = new Set(filtered.map(d => d.GroupName)).size;
  document.getElementById('resultCount').textContent = filtered.length + " deals · " + accountCount + " accounts";
}

function renderTable(filtered) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = "";

  document.querySelectorAll('thead th').forEach(th => {
    th.querySelectorAll('.arrow').forEach(a => a.remove());
    if (sortState.mode === 'sorted' && th.dataset.key === sortState.key) {
      const span = document.createElement('span');
      span.className = 'arrow';
      span.textContent = sortState.dir === 1 ? '▲' : '▼';
      th.appendChild(span);
    }
  });

  if (sortState.mode === 'sorted') {
    const sorted = [...filtered].sort((a,b) => {
      let av = a[sortState.key], bv = b[sortState.key];
      if (sortState.key === 'usdACV' || sortState.key === 'StageNum') { av = Number(av); bv = Number(bv); }
      if (av === undefined || av === null) av = "";
      if (bv === undefined || bv === null) bv = "";
      if (av < bv) return -1 * sortState.dir;
      if (av > bv) return 1 * sortState.dir;
      return 0;
    });
    sorted.forEach(d => tbody.appendChild(buildDealRow(d, true)));
    return;
  }

  // grouped by account
  const groups = {};
  filtered.forEach(d => {
    if (!groups[d.GroupName]) groups[d.GroupName] = [];
    groups[d.GroupName].push(d);
  });
  const groupNames = Object.keys(groups).sort((a,b) => {
    const totalA = groups[a].reduce((s,d) => s + d.usdACV, 0);
    const totalB = groups[b].reduce((s,d) => s + d.usdACV, 0);
    return totalB - totalA;
  });

  groupNames.forEach(gname => {
    const deals = groups[gname].sort((a,b) => (a.CloseDate||"").localeCompare(b.CloseDate||""));
    const total = deals.reduce((s,d) => s + d.usdACV, 0);
    const acds = [...new Set(deals.map(d => d.ACD))];
    const collapsed = collapsedAccounts.has(gname);

    const hr = document.createElement('tr');
    hr.className = 'account-row';
    hr.dataset.group = gname;
    const pills = acds.map(a => `<span class="pill" style="background:${acdColor(a)}">${a}</span>`).join(' ');
    hr.innerHTML = `<td colspan="8">
        <span class="chev ${collapsed ? 'collapsed' : ''}">▾</span>
        ${gname} <span style="color:#6b7280;font-weight:500;">(${deals.length} deal${deals.length>1?'s':''})</span>
        &nbsp;&nbsp;${pills}
        <span class="acc-total" style="float:right;">${fmtUSD(total)}</span>
      </td>`;
    hr.addEventListener('click', () => {
      if (collapsedAccounts.has(gname)) collapsedAccounts.delete(gname);
      else collapsedAccounts.add(gname);
      render();
    });
    tbody.appendChild(hr);

    deals.forEach(d => {
      const row = buildDealRow(d, false, gname);
      if (collapsed) row.classList.add('hidden-collapsed');
      tbody.appendChild(row);
    });
  });
}

function buildDealRow(d, showAccount, groupName) {
  const row = document.createElement('tr');
  row.className = 'deal-row';
  const acctCell = showAccount
    ? `${d.GroupName}${d.AccountName !== d.GroupName ? `<br><span class="muted-account">${d.AccountName}</span>` : ''}`
    : (d.AccountName !== groupName ? `<span class="muted-account">${d.AccountName}</span>` : '');
  row.innerHTML = `
    <td><a class="opp-link" href="${SF_BASE}${d.Id}/view" target="_blank">${escapeHtml(d.Name)}</a>${d.FedRAMP === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : ''}</td>
    <td>${acctCell}</td>
    <td><span class="stage-badge" style="background:${stageColor(d.StageNum)}">${d.StageNum} · ${escapeHtml(d.StageLabel)}</span></td>
    <td>${fmtDate(d.CloseDate)}</td>
    <td class="acv-cell">${fmtUSD(d.usdACV)}${d.Currency !== 'USD' ? `<br><span class="muted-account">${d.NativeACV.toLocaleString()} ${d.Currency}</span>` : ''}</td>
    <td><span class="pill" style="background:${acdColor(d.ACD)}">${escapeHtml(d.ACD)}</span></td>
    <td>${escapeHtml(d.RegionDisplay || "—")}</td>
    <td>${escapeHtml(d.OwnerName || "—")}</td>
  `;
  return row;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderStats(filtered) {
  const totalACV = filtered.reduce((s,d) => s + d.usdACV, 0);
  const accountCount = new Set(filtered.map(d => d.GroupName)).size;
  const fedrampCount = filtered.filter(d => d.FedRAMP === 'Yes').length;
  const acdCount = new Set(filtered.map(d => d.ACD)).size;
  const stats = [
    { val: filtered.length, lbl: "Open Deals" },
    { val: accountCount, lbl: "Accounts" },
    { val: fmtUSD(totalACV), lbl: "Total Pipeline ACV (USD)" },
    { val: fedrampCount, lbl: "FedRAMP Deals" },
    { val: acdCount, lbl: "Distinct ACDs" },
  ];
  document.getElementById('statsBar').innerHTML = stats.map(s =>
    `<div class="stat-card"><div class="val">${s.val}</div><div class="lbl">${s.lbl}</div></div>`
  ).join('');
}

function renderSidebar(filtered) {
  const byStage = {};
  const byACD = {};
  const byRegion = {};
  filtered.forEach(d => {
    const sk = d.StageNum + " · " + d.StageLabel;
    byStage[sk] = byStage[sk] || { count: 0, acv: 0 };
    byStage[sk].count++; byStage[sk].acv += d.usdACV;

    byACD[d.ACD] = byACD[d.ACD] || { count: 0, acv: 0 };
    byACD[d.ACD].count++; byACD[d.ACD].acv += d.usdACV;

    const rk = d.Region || "Unspecified";
    byRegion[rk] = byRegion[rk] || { count: 0 };
    byRegion[rk].count++;
  });

  function section(title, obj, showACV) {
    const keys = Object.keys(obj).sort((a,b) => obj[b].acv !== undefined ? obj[b].acv - obj[a].acv : obj[b].count - obj[a].count);
    const rows = keys.map(k => `<div class="row"><span class="name">${escapeHtml(k)}</span><span class="num">${obj[k].count}${showACV ? ' · ' + fmtUSD(obj[k].acv) : ''}</span></div>`).join('');
    return `<div class="group"><h3>${title}</h3>${rows}</div>`;
  }

  document.getElementById('sidebar').innerHTML =
    section("By Stage", byStage, true) +
    section("By ACD", byACD, true) +
    section("By Region", byRegion, false);
}

function initDashboard() {
  document.getElementById('buildDate').textContent = new Date().toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  populateFilterOptions();

  document.getElementById('searchBox').addEventListener('input', render);
  document.getElementById('stageFilter').addEventListener('change', render);
  document.getElementById('regionFilter').addEventListener('change', render);
  document.getElementById('acdFilter').addEventListener('change', render);

  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortState.mode !== 'sorted' || sortState.key !== key) {
        sortState = { key, dir: 1, mode: 'sorted' };
      } else if (sortState.dir === 1) {
        sortState.dir = -1;
      } else {
        sortState = { key: null, dir: 1, mode: 'grouped' };
      }
      render();
    });
  });

  render();
}
</script>
</body>
</html>
