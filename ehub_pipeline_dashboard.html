<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
  :root {
    --nice-blue: #3694fc;
    --charcoal: #21212b;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
    --bg: #f4f6fa;
    --card-bg: #ffffff;
    --border: #e2e5ec;
    --text-main: #21212b;
    --text-muted: #7a7d8c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-main);
  }

  /* Password gate */
  #pwGate {
    position: fixed; inset: 0; background: var(--charcoal);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  #pwCard {
    background: #fff; border-radius: 12px; padding: 40px 36px;
    width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #pwCard .logo {
    font-size: 22px; font-weight: 700; color: var(--nice-blue); margin-bottom: 4px;
  }
  #pwCard .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  #pwCard input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; margin-bottom: 12px; outline: none;
  }
  #pwCard input:focus { border-color: var(--nice-blue); }
  #pwCard button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
    background: var(--nice-blue); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  #pwCard button:hover { background: #237ce0; }
  #pwError { color: var(--coral); font-size: 12px; margin-top: 10px; min-height: 14px; }

  #app { display: none; padding: 24px; max-width: 1500px; margin: 0 auto; }

  header.top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  header.top h1 { font-size: 22px; margin: 0 0 4px 0; color: var(--charcoal); }
  header.top .meta { color: var(--text-muted); font-size: 13px; }
  header.top .brand { color: var(--nice-blue); font-weight: 700; }

  .stats-bar {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 20px;
  }
  .stat-card {
    background: var(--card-bg); border-radius: 10px; padding: 16px 18px;
    border: 1px solid var(--border);
  }
  .stat-card .val { font-size: 24px; font-weight: 700; color: var(--charcoal); }
  .stat-card .lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: start; }
  .sidebar { display: flex; flex-direction: column; gap: 14px; }
  .side-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .side-card h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); margin: 0 0 10px 0;
  }
  .side-row {
    display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0;
    border-bottom: 1px solid #f0f1f5;
  }
  .side-row:last-child { border-bottom: none; }
  .side-row .name { color: var(--text-main); }
  .side-row .num { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .main-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }

  .filters {
    display: flex; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; align-items: center;
  }
  .filters input[type=text] {
    flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 13px; outline: none;
  }
  .filters select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px;
    background: #fff; outline: none;
  }
  .filters .count { margin-left: auto; font-size: 12px; color: var(--text-muted); white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; background: #fafbfd; color: var(--text-muted);
    font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em;
    cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  thead th:hover { color: var(--charcoal); }
  thead th .arrow { font-size: 10px; margin-left: 3px; color: var(--nice-blue); }

  tbody tr.deal-row td { padding: 9px 12px; border-bottom: 1px solid #f2f3f7; vertical-align: middle; }
  tbody tr.deal-row:hover { background: #f8fafe; }
  tbody tr.group-row td {
    padding: 11px 12px; background: #eef4fe; font-weight: 600; cursor: pointer;
    border-bottom: 1px solid var(--border); border-top: 1px solid var(--border);
  }
  tbody tr.group-row:hover td { background: #e3edfd; }
  tbody tr.group-row .chev { display: inline-block; margin-right: 6px; transition: transform 0.15s; color: var(--nice-blue); }
  tbody tr.group-row.collapsed .chev { transform: rotate(-90deg); }
  tbody tr.deal-row.hidden-group { display: none; }

  a.opp-link { color: var(--nice-blue); text-decoration: none; font-weight: 500; }
  a.opp-link:hover { text-decoration: underline; }
  .muted-acct { color: var(--text-muted); font-size: 12px; }

  .pill {
    display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
    color: #fff; white-space: nowrap;
  }
  .stage-badge {
    display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
    color: #fff; margin-right: 6px;
  }
  .stage-label { font-size: 12px; color: var(--text-main); }

  .fedramp-badge {
    display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700;
    background: var(--indigo); color: #fff; margin-left: 6px;
  }

  .acv-cell { font-variant-numeric: tabular-nums; font-weight: 600; }
  .native-sub { display: block; font-size: 11px; color: var(--text-muted); font-weight: 400; }

  .group-summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .group-name { color: var(--charcoal); }
  .group-count { color: var(--text-muted); font-weight: 400; font-size: 12px; }
  .group-acds { display: flex; gap: 4px; flex-wrap: wrap; }
  .group-total { margin-left: auto; font-weight: 700; color: var(--charcoal); }

  footer.note { text-align: center; color: var(--text-muted); font-size: 11px; margin-top: 18px; }

  @media (max-width: 1100px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="pwGate">
  <div id="pwCard">
    <div class="logo">NiCE</div>
    <div class="sub">eHub Pipeline Dashboard</div>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
    <button id="pwBtn">Access Dashboard</button>
    <div id="pwError"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <h1><span class="brand">NiCE</span> &middot; Engagement Hub Pipeline Dashboard</h1>
      <div class="meta" id="generatedMeta"></div>
    </div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>

    <div class="main-panel">
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search opportunity or account...">
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <select id="acdFilter"><option value="">All ACDs</option></select>
        <span class="count" id="resultCount"></span>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr id="headerRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer class="note">eHub Pipeline Dashboard &middot; Rebuilt automatically each day from Salesforce CPQ data &middot; Open stages 0&ndash;5 only</footer>
</div>

// ---------- Password Gate ----------
async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function checkPw() {
  const val = document.getElementById("pwInput").value;
  const hash = await sha256Hex(val);
  if (hash === STORED_HASH) {
    sessionStorage.setItem("ehub_auth", "1");
    document.getElementById("pwGate").style.display = "none";
    document.getElementById("app").style.display = "block";
    initApp();
  } else {
    document.getElementById("pwError").textContent = "Incorrect password.";
  }
}
document.getElementById("pwBtn").addEventListener("click", checkPw);
document.getElementById("pwInput").addEventListener("keydown", e => { if (e.key === "Enter") checkPw(); });

if (sessionStorage.getItem("ehub_auth") === "1") {
  document.getElementById("pwGate").style.display = "none";
  document.getElementById("app").style.display = "block";
  initApp();
}

function populateFilterOptions() {
  const stages = [...new Set(DEALS.map(d => d.stageNum))].sort();
  const stageSel = document.getElementById("stageFilter");
  stages.forEach(s => {
    const d = DEALS.find(x => x.stageNum === s);
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s + " \u00b7 " + (d ? d.stageLabel : "");
    stageSel.appendChild(opt);
  });

  const regions = [...new Set(DEALS.map(d => d.region || "Unspecified"))].sort();
  const regionSel = document.getElementById("regionFilter");
  regions.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });

  const acds = [...new Set(DEALS.map(d => d.acd))].sort();
  const acdSel = document.getElementById("acdFilter");
  acds.forEach(a => {

    opt.value = a; opt.textContent = a;
    acdSel.appendChild(opt);
  });

      const k = keyFn(d) || "Unspecified";
      if (!map.has(k)) map.set(k, { count: 0, acv: 0 });
      map.get(k).count++;
      map.get(k).acv += d.usdACV;
    });
    return map;
  }

  const byStage = groupBy(d => d.stageNum + " \u00b7 " + d.stageLabel);
  const stageEntries = [...byStage.entries()].sort((a, b) => a[0].localeCompare(b[0]));

  const byAcd = groupBy(d => d.acd);
  const acdEntries = [...byAcd.entries()].sort((a, b) => b[1].acv - a[1].acv);

  const byRegion = groupBy(d => d.region);
  const regionEntries = [...byRegion.entries()].sort((a, b) => b[1].count - a[1].count);

  function section(title, entries, showAcv) {
    const rows = entries.map(([name, v]) =>
      `<div class="side-row"><span class="name">${escapeHtml(name)}</span><span class="num">${v.count}${showAcv ? " \u00b7 " + fmtUSD(v.acv) : ""}</span></div>`
    ).join("");
    return `<div class="side-card"><h3>${title}</h3>${rows}</div>`;
  }

  document.getElementById("sidebar").innerHTML =
    section("By Stage", stageEntries, true) +
    section("By ACD", acdEntries, true) +
    section("By Region", regionEntries, false);
}

function renderHeader() {
  const row = document.getElementById("headerRow");
  row.innerHTML = COLUMNS.map(c => {
    let arrow = "";
    if (sortColumn === c.key) arrow = `<span class="arrow">${sortDir === "asc" ? "\u25B2" : "\u25BC"}</span>`;
    return `<th data-key="${c.key}">${c.label}${arrow}</th>`;
  }).join("");
  [...row.children].forEach(th => {
    th.addEventListener("click", () => onSort(th.dataset.key));
  });
}

function onSort(key) {
  if (sortColumn !== key) {
    sortColumn = key; sortDir = "asc";
  } else if (sortDir === "asc") {
    sortDir = "desc";
  } else {
    sortColumn = null; sortDir = null;
  }
  renderHeader();
  render();
}

function escapeHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function matchesFilters(d, search, stage, region, acd) {
  if (stage && d.stageNum !== stage) return false;
  if (region && (d.region || "Unspecified") !== region) return false;
  if (acd && d.acd !== acd) return false;
  if (search) {
    const s = search.toLowerCase();
    if (!d.name.toLowerCase().includes(s) && !(d.account || "").toLowerCase().includes(s) && !(d.groupAccount || "").toLowerCase().includes(s)) {
      return false;
    }
  }
  return true;
}

function dealCell(d, key) {
  switch (key) {
    case "name":
      return `<a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank" rel="noopener">${escapeHtml(d.name)}</a>${d.fedramp === "Yes" ? '<span class="fedramp-badge">FedRAMP</span>' : ''}`;
    case "account":
      return escapeHtml(d.account || "");
    case "stageNum":
      return `<span class="stage-badge" style="background:${stageColor(d.stageNum)}">${d.stageNum}</span><span class="stage-label">${escapeHtml(d.stageLabel)}</span>`;
    case "closeDate":
      return fmtDate(d.closeDate);
    case "usdACV":
      let sub = "";
      if (d.currency !== "USD") sub = `<span class="native-sub">${d.currency} ${Math.round(d.nativeACV).toLocaleString("en-US")}</span>`;
      return `<span class="acv-cell">${fmtUSD(d.usdACV)}</span>${sub}`;
    case "acd":
      return `<span class="pill" style="background:${acdColor(d.acd)}">${escapeHtml(d.acd)}</span>`;
    case "region":
      return escapeHtml([d.region, d.territory].filter(Boolean).join(" / ") || "Unspecified");
    case "owner":
      return escapeHtml(d.owner || "");
    default:
      return "";
  }
}

function render() {
  const search = document.getElementById("searchInput").value.trim();
  const stage = document.getElementById("stageFilter").value;
  const region = document.getElementById("regionFilter").value;
  const acd = document.getElementById("acdFilter").value;

  const filtered = DEALS.filter(d => matchesFilters(d, search, stage, region, acd));

  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  const accountsSet = new Set(filtered.map(d => d.groupAccount));
  document.getElementById("resultCount").textContent = `${filtered.length} deals \u00b7 ${accountsSet.size} accounts`;

  if (sortColumn) {
    // Flat sorted view
    const sorted = [...filtered].sort((a, b) => {
      let av = a[sortColumn], bv = b[sortColumn];
      if (sortColumn === "usdACV") { av = a.usdACV; bv = b.usdACV; }
      if (sortColumn === "stageNum") { av = parseInt(a.stageNum); bv = parseInt(b.stageNum); }
      if (sortColumn === "closeDate") { av = a.closeDate || ""; bv = b.closeDate || ""; }
      if (typeof av === "string") av = av.toLowerCase();
      if (typeof bv === "string") bv = bv.toLowerCase();
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    sorted.forEach(d => {
      const tr = document.createElement("tr");
      tr.className = "deal-row";
      tr.innerHTML = COLUMNS.map(c => `<td>${dealCell(d, c.key)}</td>`).join("");
      tbody.appendChild(tr);
    });
    return;
  }

  // Grouped-by-account view
  const groups = new Map();
  filtered.forEach(d => {
    const k = d.groupAccount || "Unspecified";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(d);
  });

  const groupEntries = [...groups.entries()].map(([name, list]) => {
    const totalAcv = list.reduce((s, d) => s + d.usdACV, 0);
    const acds = [...new Set(list.map(d => d.acd))];
    const sortedList = [...list].sort((a, b) => (a.closeDate || "").localeCompare(b.closeDate || ""));
    return { name, list: sortedList, totalAcv, acds };
  }).sort((a, b) => b.totalAcv - a.totalAcv);

  groupEntries.forEach(g => {
    const groupId = "grp_" + g.name.replace(/[^a-zA-Z0-9]/g, "_");
    const isCollapsed = collapsedGroups.has(g.name);
    const gTr = document.createElement("tr");
    gTr.className = "group-row" + (isCollapsed ? " collapsed" : "");
    const acdPills = g.acds.map(a => `<span class="pill" style="background:${acdColor(a)}">${escapeHtml(a)}</span>`).join(" ");
    gTr.innerHTML = `<td colspan="${COLUMNS.length}">
        <div class="group-summary">
          <span class="chev">\u25BC</span>
          <span class="group-name">${escapeHtml(g.name)}</span>
          <span class="group-count">${g.list.length} deal${g.list.length !== 1 ? "s" : ""}</span>
          <span class="group-acds">${acdPills}</span>
          <span class="group-total">${fmtUSD(g.totalAcv)}</span>
        </div>
      </td>`;
    gTr.addEventListener("click", () => {
      if (collapsedGroups.has(g.name)) collapsedGroups.delete(g.name);
      else collapsedGroups.add(g.name);
      render();
    });
    tbody.appendChild(gTr);

    g.list.forEach(d => {
      const tr = document.createElement("tr");
      tr.className = "deal-row" + (isCollapsed ? " hidden-group" : "");
      const cells = COLUMNS.map(c => {
        if (c.key === "account") {
          const differs = d.account && d.account !== g.name;
          return `<td>${differs ? `<span class="muted-acct">${escapeHtml(d.account)}</span>` : ""}</td>`;
        }
        return `<td>${dealCell(d, c.key)}</td>`;
      }).join("");
      tr.innerHTML = cells;
      tbody.appendChild(tr);
    });
  });
}
</script>
</body>
</html>
