<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
:root {
  --blue: #3694fc;
  --charcoal: #21212b;
  --indigo: #6100FF;
  --genesys-engage: #6100FF;
  --genesys-siprec: #9457ff;
  --genesys-cx: #43009e;
  --five9: #00a887;
  --bg: #f5f6f8;
  --card: #ffffff;
  --border: #e2e4ea;
  --text: #21212b;
  --muted: #70727e;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* Password gate */
#gate {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--charcoal);
  display: flex; align-items: center; justify-content: center;
}
#gate .card {
  background: #fff; border-radius: 12px; padding: 40px 36px; width: 340px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4); text-align: center;
}
#gate .logo { font-weight: 700; font-size: 22px; color: var(--indigo); margin-bottom: 4px; }
#gate .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
#gate input {
  width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; margin-bottom: 14px;
}
#gate button {
  width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--blue);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
}
#gate button:hover { background: #2a7ee0; }
#gate .err { color: #d6304a; font-size: 12px; min-height: 16px; margin-top: 8px; }

#app { display: none; }

header {
  background: var(--charcoal); color: #fff; padding: 18px 28px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
header h1 { font-size: 18px; margin: 0; font-weight: 700; }
header .meta { font-size: 12px; color: #b9bac3; }

.stats-bar {
  display: flex; gap: 14px; padding: 16px 28px; flex-wrap: wrap; background: var(--card);
  border-bottom: 1px solid var(--border);
}
.stat {
  flex: 1; min-width: 130px; background: var(--bg); border-radius: 10px; padding: 12px 16px;
}
.stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.stat .value { font-size: 20px; font-weight: 700; margin-top: 2px; }

.layout { display: flex; gap: 0; align-items: flex-start; }
.sidebar {
  width: 260px; flex-shrink: 0; padding: 18px; background: var(--card);
  border-right: 1px solid var(--border); min-height: calc(100vh - 140px);
}
.sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
.sidebar .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid #f0f1f4; }
.sidebar .row .n { color: var(--muted); }

.main { flex: 1; padding: 18px 24px; min-width: 0; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.filters input, .filters select {
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; background: #fff;
}
.filters input { flex: 1; min-width: 180px; }
.count-line { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }

table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
thead th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted);
  padding: 10px 12px; border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap;
}
thead th:hover { color: var(--blue); }
tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #f0f1f4; vertical-align: middle; }
tr.account-row { background: #f0f3fb; cursor: pointer; }
tr.account-row td { font-weight: 600; padding: 10px 12px; }
tr.account-row .chevron { display: inline-block; width: 14px; transition: transform .15s; }
tr.account-row.collapsed .chevron { transform: rotate(-90deg); }
tr.deal-row td.indent { padding-left: 28px; }
tr.deal-row.hidden-row, tr.account-row.hidden-row { display: none; }
a.opp-link { color: var(--blue); text-decoration: none; }
a.opp-link:hover { text-decoration: underline; }
.muted-acct { color: var(--muted); font-size: 12px; }

.pill {
  display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #fff;
  white-space: nowrap;
}
.stage-badge {
  display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 700; color: #fff;
}
.fedramp-badge {
  display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10.5px; font-weight: 700;
  background: #8e24ff; color: #fff; margin-left: 6px;
}
.sort-ind { font-size: 10px; margin-left: 3px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <div class="sub">eHub Pipeline Dashboard</div>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
<header>
  <h1>eHub Pipeline Dashboard</h1>
  <div class="meta">Engagement Hub (Real-Time Recording) open pipeline · Updated Oct 12, 2026</div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="filters">
      <input type="text" id="searchBox" placeholder="Search opportunity, account, owner...">
      <select id="stageFilter"><option value="">All Stages</option></select>
      <select id="regionFilter"><option value="">All Regions</option></select>
      <select id="acdFilter"><option value="">All ACDs</option></select>
    </div>
    <div class="count-line" id="countLine"></div>
    <table>
      <thead>
        <tr>
          <th data-key="name">Opportunity</th>
          <th data-key="account">Account</th>
          <th data-key="stage">Stage</th>
          <th data-key="closeDate">Close Date</th>
          <th data-key="usdACV">ACV</th>
          <th data-key="acd">ACD</th>
          <th data-key="region">Region / Territory</th>
          <th data-key="owner">Owner</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
</div>

const SFDC_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/{}/view";
const PASSWORD_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

const ACD_COLORS = {
  "Cisco Systems": "#4a4a4a",
  "Cisco": "#4a4a4a",
  "Avaya": "#d6304a",
  "NICE CXone Mpower": "#3694fc",
  "Genesys": "#8e24ff",
  "Genesys Engage": "#6100FF",
  "Genesys SIPREC": "#9457ff",
  "Genesys CX": "#43009e",
  "Amazon Connect": "#ff9900",
  "Five9": "#00a887",
  "MS Teams": "#5059c9",
  "UJET": "#009688",
  "Other": "#9e9e9e",
  "Unknown": "#9e9e9e"
};
function acdColor(acd) { return ACD_COLORS[acd] || "#607d8b"; }

function stageNum(stage) {
  const m = (stage || "").match(/^(\d)/);
  return m ? parseInt(m[1]) : -1;
}
function stageColor(n) {
  if (n <= 1) return "#3694fc";
  if (n <= 3) return "#e8a500";
  if (n === 4) return "#8e24ff";
  if (n === 5) return "#2e9e4f";
  return "#9e9e9e";
}
function stageShortLabel(stage) {
  const parts = (stage || "").split(" - ");
  return parts.length > 1 ? parts[1] : stage;
}
function fmtMoney(v) {
  return "$" + Number(v).toLocaleString(undefined, {maximumFractionDigits: 0});
}
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const errEl = document.getElementById('pwErr');
  try {
    const hash = await sha256Hex(val);
    if (hash === PASSWORD_HASH) {
      sessionStorage.setItem('ehub_auth', '1');
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initApp();
    } else {
      errEl.textContent = 'Incorrect password.';
    }
  } catch (e) {
    errEl.textContent = 'Error checking password.';
  }
}

document.getElementById('pwBtn').addEventListener('click', checkPw);
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

(function tryAutoAuth() {
  try {
    if (sessionStorage.getItem('ehub_auth') === '1') {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initApp();
    }
  } catch (e) {}
})();

let sortState = { key: null, dir: 1, stage: 0 }; // stage: 0=grouped,1=asc,2=desc

function regionTerritory(d) {
  if (d.region && d.territory) return d.region + " / " + d.territory;
  return d.region || d.territory || "—";
}

function populateFilters() {
  const stageSel = document.getElementById('stageFilter');
  const stages = [...new Set(DEALS.map(d => d.stage))].sort((a,b) => stageNum(a) - stageNum(b));
  stages.forEach(s => {
    const opt = document.createElement('option'); opt.value = s; opt.textContent = s; stageSel.appendChild(opt);
  });
  const regionSel = document.getElementById('regionFilter');
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  regions.forEach(r => { const opt = document.createElement('option'); opt.value = r; opt.textContent = r; regionSel.appendChild(opt); });
  const acdSel = document.getElementById('acdFilter');
  const acds = [...new Set(DEALS.map(d => d.acd).filter(Boolean))].sort();
  acds.forEach(a => { const opt = document.createElement('option'); opt.value = a; opt.textContent = a; acdSel.appendChild(opt); });
}

function renderStats() {
  const total = DEALS.reduce((s,d) => s + d.usdACV, 0);
  const accounts = new Set(DEALS.map(d => d.parent));
  const fedramp = DEALS.filter(d => d.fedramp === 'Yes').length;
  const acds = new Set(DEALS.map(d => d.acd));
  const bar = document.getElementById('statsBar');
  const stats = [
    ["Open Deals", DEALS.length],
    ["Accounts", accounts.size],
    ["Total Pipeline ACV", fmtMoney(total)],
    ["FedRAMP Deals", fedramp],
    ["Distinct ACDs", acds.size],
  ];
  bar.innerHTML = stats.map(([l,v]) => `<div class="stat"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');
}

function renderSidebar() {
  const byStage = {};
  const byAcd = {};
  const byRegion = {};
  DEALS.forEach(d => {
    byStage[d.stage] = byStage[d.stage] || {count:0, acv:0};
    byStage[d.stage].count++; byStage[d.stage].acv += d.usdACV;
    byAcd[d.acd] = byAcd[d.acd] || {count:0, acv:0};
    byAcd[d.acd].count++; byAcd[d.acd].acv += d.usdACV;
    const r = d.region || "Unspecified";
    byRegion[r] = byRegion[r] || {count:0};
    byRegion[r].count++;
  });
  function section(title, obj, showAcv) {
    const entries = Object.entries(obj).sort((a,b) => b[1].count - a[1].count);
    let rows = entries.map(([k,v]) => `<div class="row"><span>${k}</span><span class="n">${v.count}${showAcv ? ' · ' + fmtMoney(v.acv) : ''}</span></div>`).join('');
    return `<h3>${title}</h3>${rows}`;
  }
  const stageEntries = Object.entries(byStage).sort((a,b) => stageNum(a[0]) - stageNum(b[0]));
  let stageRows = stageEntries.map(([k,v]) => `<div class="row"><span>${k}</span><span class="n">${v.count} · ${fmtMoney(v.acv)}</span></div>`).join('');
  document.getElementById('sidebar').innerHTML =
    `<h3>By Stage</h3>${stageRows}` +
    section('By ACD', byAcd, true) +
    section('By Region', byRegion, false);
}

function getFiltered() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;
  return DEALS.filter(d => {
    if (stage && d.stage !== stage) return false;
    if (region && d.region !== region) return false;
    if (acd && d.acd !== acd) return false;
    if (q) {
      const hay = (d.name + " " + d.account + " " + (d.owner||"")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderTable() {
  const filtered = getFiltered();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (sortState.stage !== 0 && sortState.key) {
    const rows = [...filtered].sort((a,b) => {
      let av = a[sortState.key], bv = b[sortState.key];
      if (sortState.key === 'stage') { av = stageNum(a.stage); bv = stageNum(b.stage); }
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return -1 * sortState.dir;
      if (av > bv) return 1 * sortState.dir;
      return 0;
    });
    rows.forEach(d => tbody.appendChild(dealRow(d, true)));
    document.getElementById('countLine').textContent = `${filtered.length} deals`;
  } else {
    // grouped by account (parent)
    const groups = {};
    filtered.forEach(d => {
      groups[d.parent] = groups[d.parent] || [];
      groups[d.parent].push(d);
    });
    const groupArr = Object.entries(groups).map(([name, deals]) => {
      const acv = deals.reduce((s,x) => s + x.usdACV, 0);
      return {name, deals, acv};
    }).sort((a,b) => b.acv - a.acv);

    groupArr.forEach(g => {
      const acdSet = [...new Set(g.deals.map(d => d.acd))];
      const tr = document.createElement('tr');
      tr.className = 'account-row';
      tr.innerHTML = `<td colspan="8"><span class="chevron">▾</span> ${esc(g.name)}
        <span class="muted-acct">(${g.deals.length} deal${g.deals.length>1?'s':''})</span>
        ${acdSet.map(a => `<span class="pill" style="background:${acdColor(a)}">${esc(a)}</span>`).join(' ')}
        <span style="float:right; font-weight:700;">${fmtMoney(g.acv)}</span></td>`;
      tr.addEventListener('click', () => {
        tr.classList.toggle('collapsed');
        let sib = tr.nextElementSibling;
        while (sib && sib.classList.contains('deal-row')) {
          sib.classList.toggle('hidden-row');
          sib = sib.nextElementSibling;
        }
      });
      tbody.appendChild(tr);
      g.deals.sort((a,b) => (a.closeDate||"").localeCompare(b.closeDate||""))
        .forEach(d => tbody.appendChild(dealRow(d, false)));
    });
    document.getElementById('countLine').textContent = `${filtered.length} deals · ${groupArr.length} accounts`;
  }

  document.querySelectorAll('thead th').forEach(th => {
    th.querySelectorAll('.sort-ind').forEach(e => e.remove());
    if (sortState.stage !== 0 && th.dataset.key === sortState.key) {
      const ind = document.createElement('span');
      ind.className = 'sort-ind';
      ind.textContent = sortState.dir === 1 ? '▲' : '▼';
      th.appendChild(ind);
    }
  });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? "" : s; return d.innerHTML; }

function dealRow(d, showAccount) {
  const tr = document.createElement('tr');
  tr.className = 'deal-row';
  const n = stageNum(d.stage);
  const nativeNote = (d.currency && d.currency !== 'USD') ? ` <span class="muted-acct">(${d.nativeACV.toLocaleString()} ${d.currency})</span>` : '';
  tr.innerHTML = `
    <td class="indent"><a class="opp-link" href="${SFDC_BASE.replace('{}', d.id)}" target="_blank">${esc(d.name)}</a>${d.fedramp==='Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : ''}</td>
    <td>${showAccount ? esc(d.account) : ''}</td>
    <td><span class="stage-badge" style="background:${stageColor(n)}">${n} · ${esc(stageShortLabel(d.stage))}</span></td>
    <td>${fmtDate(d.closeDate)}</td>
    <td>${fmtMoney(d.usdACV)}${nativeNote}</td>
    <td><span class="pill" style="background:${acdColor(d.acd)}">${esc(d.acd)}</span></td>
    <td>${esc(regionTerritory(d))}</td>
    <td>${esc(d.owner)}</td>
  `;
  return tr;
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortState.key !== key) {
      sortState = { key, dir: 1, stage: 1 };
    } else {
      if (sortState.stage === 1) sortState.dir = -1, sortState.stage = 2;
      else if (sortState.stage === 2) sortState = { key: null, dir: 1, stage: 0 };
      else sortState = { key, dir: 1, stage: 1 };
    }
    renderTable();
  });
});

function initApp() {
  populateFilters();
  renderStats();
  renderSidebar();
  renderTable();
  ['searchBox','stageFilter','regionFilter','acdFilter'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderTable);
    document.getElementById(id).addEventListener('change', renderTable);
  });
}
</script>
