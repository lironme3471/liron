<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
  :root {
    --blue: #3694fc;
    --charcoal: #21212b;
    --indigo: #6100FF;
    --genesys-engage: #6100FF;
    --genesys-siprec: #9457ff;
    --genesys-cx: #43009e;
    --five9: #00a887;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    background: #f4f5f7;
    color: var(--charcoal);
  }

  /* Password gate */
  #gate {
    position: fixed; inset: 0; background: var(--charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 40px; width: 340px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #gate .card h1 { font-size: 20px; margin: 0 0 4px; color: var(--charcoal); }
  #gate .card .brand { color: var(--blue); font-weight: 700; }
  #gate .card p { color: #666; font-size: 13px; margin: 0 0 20px; }
  #gate input {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
    background: var(--blue); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  #gate button:hover { background: #2578d8; }
  #gate .err { color: #e0345c; font-size: 12px; margin-top: 8px; min-height: 14px; }

  #app { display: none; }

  header.topbar {
    background: var(--charcoal); color: #fff; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar h1 { font-size: 18px; margin: 0; }
  header.topbar .sub { font-size: 12px; color: #a9adba; margin-top: 2px; }

  .stats-bar {
    display: flex; gap: 16px; padding: 16px 24px; background: #fff;
    border-bottom: 1px solid #e5e7eb; flex-wrap: wrap;
  }
  .stat {
    flex: 1; min-width: 140px; background: #f9fafc; border-radius: 10px; padding: 12px 16px;
    border: 1px solid #edeef1;
  }
  .stat .val { font-size: 22px; font-weight: 700; color: var(--charcoal); }
  .stat .lbl { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }

  .layout { display: flex; gap: 0; }
  .sidebar {
    width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid #e5e7eb;
    padding: 16px; height: calc(100vh - 140px); overflow-y: auto;
  }
  .sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #888; margin: 16px 0 8px; }
  .sidebar .row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
  .sidebar .row .n { color: #888; font-size: 11px; }

  .main { flex: 1; padding: 16px 24px; min-width: 0; }

  .filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select {
    padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px;
  }
  .filters input { flex: 1; min-width: 180px; }
  .filters .count { font-size: 12px; color: #666; margin-left: auto; }
  #reset-sort {
    padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px;
    background: #fff; cursor: pointer; color: #555;
  }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 10px; font-size: 13px; text-align: left; border-bottom: 1px solid #f0f1f4; }
  th { background: #fafbfc; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: #888; cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--blue); }
  tr.acct-header { background: #eef4fe; cursor: pointer; }
  tr.acct-header:hover { background: #e2edfd; }
  tr.acct-header td { font-weight: 600; padding: 10px; }
  tr.deal-row td { }
  tr.deal-row.muted-acct { color: #999; }
  .collapse-icon { display: inline-block; width: 14px; }
  a.opp-link { color: var(--blue); text-decoration: none; }
  a.opp-link:hover { text-decoration: underline; }

  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px;
    font-weight: 600; color: #fff; white-space: nowrap;
  }
  .stage-badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
  }
  .fedramp-badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 700;
    background: #6100FF; color: #fff; margin-left: 6px;
  }
  .muted { color: #999; font-size: 12px; }
  .sort-arrow { font-size: 10px; margin-left: 3px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1><span class="brand">NiCE</span> eHub Dashboard</h1>
    <p>Enter password to access the pipeline dashboard</p>
    <input type="password" id="pw" placeholder="Password" />
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div>
      <h1>eHub Pipeline Dashboard</h1>
      <div class="sub">Engagement Hub Real-Time Recording pipeline — open opportunities, stages 0&ndash;5</div>
    </div>
    <div class="sub" id="genTime"></div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search opportunity, account, owner...">
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <select id="acdFilter"><option value="">All ACDs</option></select>
        <button id="reset-sort">Reset grouping</button>
        <span class="count" id="countLabel"></span>
      </div>
      <table id="dealsTable">
        <thead>
          <tr>
            <th data-key="name">Opportunity</th>
            <th data-key="account">Account</th>
            <th data-key="stageNum">Stage</th>
            <th data-key="closeDate">Close Date</th>
            <th data-key="usdACV">ACV</th>
            <th data-key="acd">ACD</th>
            <th data-key="regionDisplay">Region / Territory</th>
            <th data-key="owner">Owner</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

const PW_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";
const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

const ACD_COLORS = {
  "MS Teams": "#3694fc",
  "Amazon Connect": "#ff9900",
  "Cisco Systems": "#1ba0d7",
  "Genesys": "#6100FF",
  "Genesys Engage": "#6100FF",
  "Genesys SIPREC": "#9457ff",
  "Genesys CX": "#43009e",

  "Five9": "#00a887",
  "NICE CXone Mpower": "#21212B",
  "ShoreTel": "#7a8fa6",
  "UJET": "#00b3a4",
  "Unknown": "#9aa0ab",
};
function acdColor(acd) { return ACD_COLORS[acd] || "#9aa0ab"; }

const STAGE_COLORS = { 0: "#3694fc", 1: "#3694fc", 2: "#f2b705", 3: "#f2b705", 4: "#6100FF", 5: "#1e9e5a" };
function stageColor(n) { return STAGE_COLORS[n] || "#999"; }

function fmtUSD(n) {
  const sign = n < 0 ? "-" : "";
  n = Math.abs(n);
  return sign + "$" + n.toLocaleString(undefined, {maximumFractionDigits:0});
}

// ---------- Password gate ----------
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function checkPw() {
  const val = document.getElementById('pw').value;
  const hash = await sha256Hex(val);
  if (hash === PW_HASH) {
    sessionStorage.setItem('ehub_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}
document.getElementById('pwBtn').addEventListener('click', checkPw);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

if (sessionStorage.getItem('ehub_auth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.addEventListener('DOMContentLoaded', init);
}

// ---------- App logic ----------
let sortKey = null;
let sortDir = 1; // 1 asc, -1 desc

function populateFilters() {
  const stages = [...new Set(DATA.map(d => d.stageNum))].sort();
  const stageSel = document.getElementById('stageFilter');
  stages.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    const label = DATA.find(d => d.stageNum === s).stageLabel;
    opt.textContent = s + " · " + label;
    stageSel.appendChild(opt);
  });
  const regions = [...new Set(DATA.map(d => d.regionDisplay))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });
  const acds = [...new Set(DATA.map(d => d.acd))].sort();
  const acdSel = document.getElementById('acdFilter');
  acds.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    acdSel.appendChild(opt);
  });
}

function renderStats(filtered) {
  const totalACV = filtered.reduce((s,d) => s + d.usdACV, 0);
  const accts = new Set(filtered.map(d => d.topParent)).size;
  const fedramp = filtered.filter(d => d.fedramp === 'Yes').length;
  const acds = new Set(filtered.map(d => d.acd)).size;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="val">${filtered.length}</div><div class="lbl">Open Deals</div></div>
    <div class="stat"><div class="val">${accts}</div><div class="lbl">Accounts</div></div>
    <div class="stat"><div class="val">${fmtUSD(totalACV)}</div><div class="lbl">Total Pipeline ACV (USD)</div></div>
    <div class="stat"><div class="val">${fedramp}</div><div class="lbl">FedRAMP Deals</div></div>
    <div class="stat"><div class="val">${acds}</div><div class="lbl">Distinct ACDs</div></div>
  `;
}

function renderSidebar(filtered) {
  function groupBy(arr, key) {
    const m = {};
    arr.forEach(d => {
      const k = d[key];
      if (!m[k]) m[k] = { count: 0, acv: 0 };
      m[k].count++; m[k].acv += d.usdACV;
    });
    return m;
  }
  const byStage = groupBy(filtered, 'stageNum');
  const byACD = groupBy(filtered, 'acd');
  const byRegion = groupBy(filtered, 'regionDisplay');

  let html = '<h3>By Stage</h3>';
  Object.keys(byStage).sort((a,b)=>a-b).forEach(k => {
    const label = filtered.find(d => d.stageNum == k).stageLabel;
    html += `<div class="row"><span>${k} · ${label}</span><span class="n">${byStage[k].count} · ${fmtUSD(byStage[k].acv)}</span></div>`;
  });

  html += '<h3>By ACD</h3>';
  Object.keys(byACD).sort((a,b)=>byACD[b].acv-byACD[a].acv).forEach(k => {
    html += `<div class="row"><span><span class="pill" style="background:${acdColor(k)}">${k}</span></span><span class="n">${byACD[k].count} · ${fmtUSD(byACD[k].acv)}</span></div>`;
  });

  html += '<h3>By Region</h3>';
  Object.keys(byRegion).sort((a,b)=>byRegion[b].count-byRegion[a].count).forEach(k => {
    html += `<div class="row"><span>${k}</span><span class="n">${byRegion[k].count}</span></div>`;
  });

  document.getElementById('sidebar').innerHTML = html;
}

function dealRowHtml(d, showAccount) {
  const fed = d.fedramp === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : '';
  return `<tr class="deal-row">
    <td><a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank">${d.name}</a>${fed}</td>
    <td>${showAccount ? d.account : ''}</td>
    <td><span class="stage-badge" style="background:${stageColor(d.stageNum)}22;color:${stageColor(d.stageNum)}">${d.stageNum} · ${d.stageLabel}</span></td>
    <td>${d.closeDate || ''}</td>
    <td>${fmtUSD(d.usdACV)}${d.currency && d.currency !== 'USD' ? '<div class="muted">' + d.nativeACV.toLocaleString() + ' ' + d.currency + '</div>' : ''}</td>
    <td><span class="pill" style="background:${acdColor(d.acd)}">${d.acd}</span></td>
    <td>${d.regionDisplay}</td>
    <td>${d.owner || ''}</td>
  </tr>`;
}

const collapsedAccounts = new Set();

function renderGrouped(filtered) {
  const groups = {};
  filtered.forEach(d => {
    if (!groups[d.topParent]) groups[d.topParent] = [];
    groups[d.topParent].push(d);
  });
  const acctList = Object.keys(groups).map(name => {
    const deals = groups[name].slice().sort((a,b) => (a.closeDate||'').localeCompare(b.closeDate||''));
    const acv = deals.reduce((s,d) => s + d.usdACV, 0);
    const acds = [...new Set(deals.map(d => d.acd))];
    return { name, deals, acv, acds };
  }).sort((a,b) => b.acv - a.acv);

  let html = '';
  acctList.forEach(g => {
    const collapsed = collapsedAccounts.has(g.name);
    const badges = g.acds.map(a => `<span class="pill" style="background:${acdColor(a)}">${a}</span>`).join(' ');
    html += `<tr class="acct-header" data-acct="${g.name}">
      <td colspan="8"><span class="collapse-icon">${collapsed ? '▶' : '▼'}</span> ${g.name}
        <span class="muted"> — ${g.deals.length} deal${g.deals.length>1?'s':''}</span>
        &nbsp; ${badges}
        <span style="float:right">${fmtUSD(g.acv)}</span>
      </td>
    </tr>`;
    if (!collapsed) {
      g.deals.forEach(d => {
        const showAcct = d.account !== g.name;
        html += dealRowHtml(d, showAcct);
      });
    }
  });
  document.getElementById('tbody').innerHTML = html;

  document.querySelectorAll('tr.acct-header').forEach(tr => {
    tr.addEventListener('click', () => {
      const acct = tr.getAttribute('data-acct');
      if (collapsedAccounts.has(acct)) collapsedAccounts.delete(acct);
      else collapsedAccounts.add(acct);
      applyFilters();
    });
  });

  document.getElementById('countLabel').textContent = `${filtered.length} deals · ${acctList.length} accounts`;
}

function renderFlat(filtered) {
  const sorted = filtered.slice().sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });
  const html = sorted.map(d => dealRowHtml(d, true)).join('');
  document.getElementById('tbody').innerHTML = html;
  const accts = new Set(filtered.map(d => d.topParent)).size;
  document.getElementById('countLabel').textContent = `${filtered.length} deals · ${accts} accounts`;
}

function updateSortIndicators() {
  document.querySelectorAll('th[data-key]').forEach(th => {
    th.querySelectorAll('.sort-arrow').forEach(e => e.remove());
    if (th.getAttribute('data-key') === sortKey) {
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
  });
}

function applyFilters() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;

  let filtered = DATA.filter(d => {
    if (stage !== '' && String(d.stageNum) !== stage) return false;
    if (region !== '' && d.regionDisplay !== region) return false;
    if (acd !== '' && d.acd !== acd) return false;
    if (q) {
      const hay = (d.name + ' ' + d.account + ' ' + d.topParent + ' ' + (d.owner||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  renderStats(filtered);
  renderSidebar(filtered);

  if (sortKey) {
    renderFlat(filtered);
  } else {
    renderGrouped(filtered);
  }
  updateSortIndicators();
}

function init() {
  document.getElementById('genTime').textContent = 'Generated ' + new Date().toLocaleString();
  populateFilters();
  applyFilters();

  document.getElementById('searchBox').addEventListener('input', applyFilters);
  document.getElementById('stageFilter').addEventListener('change', applyFilters);
  document.getElementById('regionFilter').addEventListener('change', applyFilters);
  document.getElementById('acdFilter').addEventListener('change', applyFilters);
  document.getElementById('reset-sort').addEventListener('click', () => {
    sortKey = null; sortDir = 1; applyFilters();
  });

  document.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-key');
      if (sortKey !== key) {
        sortKey = key; sortDir = 1;
      } else if (sortDir === 1) {
        sortDir = -1;
      } else {
        sortKey = null; sortDir = 1;
      }
      applyFilters();
    });
  });
}
</script>
