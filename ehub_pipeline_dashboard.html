<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
:root{--blue:#3694fc;--charcoal:#21212b;--indigo:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f4f6fa;color:var(--charcoal);}
/* ---- password gate ---- */
#pwOverlay{position:fixed;inset:0;background:var(--charcoal);z-index:9999;display:flex;align-items:center;justify-content:center;}
#pwCard{background:#fff;border-radius:14px;padding:44px 48px;max-width:400px;width:92%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);}
#pwCard .logo{font-size:28px;font-weight:800;margin-bottom:6px;}
#pwCard .logo span{color:var(--blue);}
#pwCard h2{font-size:17px;font-weight:600;margin:14px 0 4px;}
#pwCard p{font-size:13px;color:#6b7280;margin-bottom:20px;}
#pwInput{width:100%;padding:12px 14px;border:2px solid #e5e7eb;border-radius:8px;font-size:15px;outline:none;}
#pwInput:focus{border-color:var(--blue);}
#pwBtn{width:100%;margin-top:14px;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
#pwBtn:hover{background:#1f7fe8;}
#pwErr{color:#dc2626;font-size:13px;margin-top:10px;min-height:18px;}
/* ---- header ---- */
header{background:var(--charcoal);color:#fff;padding:20px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
header .brand{font-size:22px;font-weight:800;}
header .brand span{color:var(--blue);}
header h1{font-size:18px;font-weight:600;flex:1;}
header .built{font-size:12px;color:#9ca3af;}
/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;padding:20px 28px 6px;}
.stat{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 1px 4px rgba(33,33,43,.08);border-top:3px solid var(--blue);}
.stat.fed{border-top-color:var(--indigo);}
.stat.acd{border-top-color:var(--teal);}
.stat .v{font-size:24px;font-weight:800;}
.stat .l{font-size:12px;color:#6b7280;margin-top:2px;}
/* ---- layout ---- */
.wrap{display:flex;gap:18px;padding:16px 28px 40px;align-items:flex-start;}
.main{flex:1;min-width:0;}
aside{width:270px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;}
.panel{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(33,33,43,.08);}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:10px;}
.srow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #f1f2f5;}
.srow:last-child{border-bottom:none;}
.srow .k{display:flex;align-items:center;gap:6px;}
.srow .amt{color:#6b7280;font-size:12px;}
/* ---- filters ---- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.filters input,.filters select{padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13.5px;background:#fff;outline:none;}
.filters input{flex:1;min-width:200px;}
.filters input:focus,.filters select:focus{border-color:var(--blue);}
#count{font-size:13px;color:#6b7280;white-space:nowrap;}
/* ---- table ---- */
.tblwrap{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(33,33,43,.08);overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:980px;}
thead th{position:sticky;top:0;background:var(--charcoal);color:#fff;text-align:left;padding:11px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none;white-space:nowrap;}
thead th:hover{background:#33333f;}
thead th .arr{color:var(--teal);margin-left:4px;}
tbody td{padding:9px 12px;border-bottom:1px solid #f1f2f5;vertical-align:middle;}
tr.acctHead{background:#eaf2fd;cursor:pointer;font-weight:700;}
tr.acctHead:hover{background:#ddebfc;}
tr.acctHead td{padding:10px 12px;border-bottom:1px solid #d8e6fa;}
tr.acctHead .car{display:inline-block;width:16px;transition:transform .15s;color:var(--blue);}
tr.acctHead.closed .car{transform:rotate(-90deg);}
tr.deal td:first-child{padding-left:34px;}
tr.deal.flat td:first-child{padding-left:12px;}
a.opp{color:var(--blue);text-decoration:none;font-weight:600;}
a.opp:hover{text-decoration:underline;}
.sub{font-size:11px;color:#9ca3af;}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:#fff;white-space:nowrap;}
.stg{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;}
.stg b{font-size:13px;}
.stg.s01{background:#e3f0fe;color:#1565c0;}
.stg.s23{background:#fff5da;color:#92600a;}
.stg.s4{background:#f0e6ff;color:var(--indigo);}
.stg.s5{background:#dcf7e8;color:#0d7a43;}
.fedb{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--indigo);color:#fff;font-size:10.5px;font-weight:700;}
.acv{font-weight:700;white-space:nowrap;}
.hdrPills .pill{margin-right:4px;font-size:10.5px;padding:2px 8px;}
.empty{padding:40px;text-align:center;color:#9ca3af;}
@media(max-width:1000px){.wrap{flex-direction:column;}aside{width:100%;flex-direction:row;flex-wrap:wrap;}aside .panel{flex:1;min-width:220px;}}
</style>
</head>

<script>
/* ---------- password gate ---------- */
const PW_HASH='0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621';
async function sha256hex(s){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkPw(){
  const val=document.getElementById('pwInput').value;
  const h=await sha256hex(val);
  if(h===PW_HASH){
    sessionStorage.setItem('ehub_auth','1');
    document.getElementById('pwOverlay').style.display='none';
  }else{
    document.getElementById('pwErr').textContent='Incorrect password. Try again.';
    document.getElementById('pwInput').value='';
  }
}
document.getElementById('pwBtn').addEventListener('click',checkPw);
document.getElementById('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')checkPw();});
if(sessionStorage.getItem('ehub_auth')==='1'){document.getElementById('pwOverlay').style.display='none';}
else{setTimeout(()=>document.getElementById('pwInput').focus(),50);}

/* ---------- data ---------- */
const DEALS=JSON.parse(document.getElementById('data').textContent);
const SF='https://niceincontact.lightning.force.com/lightning/r/Opportunity/';
const STAGE_SHORT={0:'Prospecting',1:'Identification / Qual',2:'Determining Problem',3:'Aligning Benefits',4:'Confirm Value',5:'Proposal / Negotiation'};
const ACD_COLORS={'Cisco Systems':'#049fd9','Avaya':'#c0392b','Genesys':'#ff4f1f','MS Teams':'#6264a7','Amazon Connect':'#e68a00','NICE CXone Mpower':'#3694fc','UJET':'#00a86b','Other':'#6b7280','Unknown':'#9ca3af'};
function acdColor(a){return ACD_COLORS[a]||'#6100FF';}
function stageNum(s){return parseInt(s,10);}
function stageCls(n){return n<=1?'s01':n<=3?'s23':n===4?'s4':'s5';}
const fmtUSD=v=>'$'+Math.round(v).toLocaleString('en-US');
const fmtNative=(v,c)=>c+' '+Math.round(v).toLocaleString('en-US');
function fmtDate(d){if(!d)return'—';const[y,m,dd]=d.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+dd)+', '+y;}
function regionDisp(d){return d.territory?d.region+' / '+d.territory:d.region;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---------- state ---------- */
let sortCol=null,sortDir=1;
const collapsed=new Set();
const COLS=[
 {k:'name',label:'Opportunity'},
 {k:'account',label:'Account'},
 {k:'stagen',label:'Stage'},
 {k:'close',label:'Close Date'},
 {k:'usd',label:'ACV'},
 {k:'acd',label:'ACD'},
 {k:'region',label:'Region / Territory'},
 {k:'owner',label:'Owner'}
];
function sortVal(d,k){
 if(k==='stagen')return stageNum(d.stage);
 if(k==='region')return regionDisp(d);
 if(k==='close')return d.close||'';
 const v=d[k];return typeof v==='string'?v.toLowerCase():v;
}

/* ---------- filters ---------- */
function filtered(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const fs=document.getElementById('fStage').value;
 const fr=document.getElementById('fRegion').value;
 const fa=document.getElementById('fAcd').value;
 return DEALS.filter(d=>{
  if(fs!==''&&String(stageNum(d.stage))!==fs)return false;
  if(fr&&d.region!==fr)return false;
  if(fa&&d.acd!==fa)return false;
  if(q){
   const hay=(d.name+' '+d.account+' '+(d.topParent||'')+' '+d.owner+' '+d.acd+' '+regionDisp(d)+' '+d.stage).toLowerCase();
   if(!hay.includes(q))return false;
  }
  return true;
 });
}

/* ---------- render pieces ---------- */
function stageBadge(d){
 const n=stageNum(d.stage);
 return '<span class="stg '+stageCls(n)+'"><b>'+n+'</b>·&nbsp;'+esc(STAGE_SHORT[n]||d.stage)+'</span>';
}
function acdPill(a){return '<span class="pill" style="background:'+acdColor(a)+'">'+esc(a)+'</span>';}
function dealRow(d,flat){
 const acvSub=d.cur&&d.cur!=='USD'?'<div class="sub">'+esc(fmtNative(d.native,d.cur))+'</div>':'';
 return '<tr class="deal'+(flat?' flat':'')+'">'
  +'<td><a class="opp" href="'+SF+d.id+'/view" target="_blank" rel="noopener">'+esc(d.name)+'</a>'
  +(d.fedramp?'<span class="fedb">FedRAMP</span>':'')+'</td>'
  +'<td>'+(flat?esc(d.account):'')+'</td>'
  +'<td>'+stageBadge(d)+'</td>'
  +'<td>'+fmtDate(d.close)+'</td>'
  +'<td class="acv">'+fmtUSD(d.usd)+acvSub+'</td>'
  +'<td>'+acdPill(d.acd)+'</td>'
  +'<td>'+esc(regionDisp(d))+'</td>'
  +'<td>'+esc(d.owner)+'</td></tr>';
}

function render(){
 const rows=filtered();
 /* header */
 document.getElementById('hdr').innerHTML=COLS.map((c,i)=>{
  const arr=(sortCol===c.k)?'<span class="arr">'+(sortDir===1?'▲':'▼')+'</span>':'';
  return '<th data-k="'+c.k+'">'+c.label+arr+'</th>';
 }).join('');
 document.querySelectorAll('#hdr th').forEach(th=>{
  th.addEventListener('click',()=>{
   const k=th.dataset.k;
   if(sortCol!==k){sortCol=k;sortDir=1;}
   else if(sortDir===1){sortDir=-1;}
   else{sortCol=null;sortDir=1;}
   render();
  });
 });
 /* body */
 const tb=document.getElementById('tb');
 let html='';
 if(rows.length===0){
  html='<tr><td colspan="8"><div class="empty">No deals match the current filters.</div></td></tr>';
 }else if(sortCol){
  const s=[...rows].sort((a,b)=>{
   const va=sortVal(a,sortCol),vb=sortVal(b,sortCol);
   return (va<vb?-1:va>vb?1:0)*sortDir;
  });
  html=s.map(d=>dealRow(d,true)).join('');
 }else{
  const groups={};
  rows.forEach(d=>{(groups[d.account]=groups[d.account]||[]).push(d);});
  const names=Object.keys(groups).sort((a,b)=>{
   const ta=groups[a].reduce((x,d)=>x+d.usd,0),tbv=groups[b].reduce((x,d)=>x+d.usd,0);
   return tbv-ta;
  });
  names.forEach(n=>{
   const g=groups[n].slice().sort((a,b)=>(a.close||'').localeCompare(b.close||''));
   const tot=g.reduce((x,d)=>x+d.usd,0);
   const acds=[...new Set(g.map(d=>d.acd))];
   const cl=collapsed.has(n);
   html+='<tr class="acctHead'+(cl?' closed':'')+'" data-acct="'+esc(n)+'">'
    +'<td colspan="3"><span class="car">▾</span> '+esc(n)
    +' <span class="sub" style="font-weight:400;">'+g.length+' deal'+(g.length>1?'s':'')+'</span></td>'
    +'<td colspan="2" class="acv">'+fmtUSD(tot)+'</td>'
    +'<td colspan="3" class="hdrPills">'+acds.map(acdPill).join('')+'</td></tr>';
   if(!cl)html+=g.map(d=>dealRow(d,false)).join('');
  });
 }
 tb.innerHTML=html;
 tb.querySelectorAll('tr.acctHead').forEach(tr=>{
  tr.addEventListener('click',()=>{
   const n=tr.dataset.acct;
   collapsed.has(n)?collapsed.delete(n):collapsed.add(n);
   render();
  });
 });
 /* count */
 const na=new Set(rows.map(d=>d.account)).size;
 document.getElementById('count').textContent=rows.length+' deals · '+na+' accounts';
 renderSidebar(rows);
}

/* ---------- stats + sidebar ---------- */
function renderStats(){
 const tot=DEALS.reduce((x,d)=>x+d.usd,0);
 const na=new Set(DEALS.map(d=>d.account)).size;
 const fed=DEALS.filter(d=>d.fedramp).length;
 const nacd=new Set(DEALS.map(d=>d.acd)).size;
 document.getElementById('stats').innerHTML=
  '<div class="stat"><div class="v">'+DEALS.length+'</div><div class="l">Open Deals</div></div>'
 +'<div class="stat"><div class="v">'+na+'</div><div class="l">Accounts</div></div>'
 +'<div class="stat"><div class="v">'+fmtUSD(tot)+'</div><div class="l">Total Pipeline ACV (USD)</div></div>'
 +'<div class="stat fed"><div class="v">'+fed+'</div><div class="l">FedRAMP Deals</div></div>'
 +'<div class="stat acd"><div class="v">'+nacd+'</div><div class="l">Distinct ACDs</div></div>';
}
function renderSidebar(rows){
 const byS={},byA={},byR={};
 rows.forEach(d=>{
  const n=stageNum(d.stage);
  (byS[n]=byS[n]||{c:0,v:0}).c++;byS[n].v+=d.usd;
  (byA[d.acd]=byA[d.acd]||{c:0,v:0}).c++;byA[d.acd].v+=d.usd;
  (byR[d.region]=byR[d.region]||{c:0}).c++;
 });
 document.getElementById('byStage').innerHTML=Object.keys(byS).sort().map(n=>
  '<div class="srow"><span class="k"><span class="stg '+stageCls(+n)+'" style="padding:1px 7px;"><b>'+n+'</b></span> '+esc(STAGE_SHORT[n])+'</span><span>'+byS[n].c+' <span class="amt">'+fmtUSD(byS[n].v)+'</span></span></div>').join('')||'<div class="srow">—</div>';
 document.getElementById('byAcd').innerHTML=Object.keys(byA).sort((a,b)=>byA[b].v-byA[a].v).map(a=>
  '<div class="srow"><span class="k"><span class="pill" style="background:'+acdColor(a)+';font-size:10px;padding:2px 7px;">'+esc(a)+'</span></span><span>'+byA[a].c+' <span class="amt">'+fmtUSD(byA[a].v)+'</span></span></div>').join('')||'<div class="srow">—</div>';
 document.getElementById('byRegion').innerHTML=Object.keys(byR).sort((a,b)=>byR[b].c-byR[a].c).map(r=>
  '<div class="srow"><span class="k">'+esc(r)+'</span><span>'+byR[r].c+'</span></div>').join('')||'<div class="srow">—</div>';
}

/* ---------- filter options ---------- */
function initFilters(){
 const fs=document.getElementById('fStage');
 [...new Set(DEALS.map(d=>stageNum(d.stage)))].sort().forEach(n=>{
  fs.insertAdjacentHTML('beforeend','<option value="'+n+'">'+n+' · '+STAGE_SHORT[n]+'</option>');
 });
 const fr=document.getElementById('fRegion');
 [...new Set(DEALS.map(d=>d.region))].sort().forEach(r=>fr.insertAdjacentHTML('beforeend','<option>'+esc(r)+'</option>'));
 const fa=document.getElementById('fAcd');
 [...new Set(DEALS.map(d=>d.acd))].sort().forEach(a=>fa.insertAdjacentHTML('beforeend','<option>'+esc(a)+'</option>'));
 ['q','fStage','fRegion','fAcd'].forEach(id=>document.getElementById(id).addEventListener('input',render));
}
renderStats();initFilters();render();
</script>
</body>
</html>
