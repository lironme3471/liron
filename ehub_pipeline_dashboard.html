const stg=d=>`<span class="sb" style="background:${SC[d.st]}22;color:${SC[d.st]}"><b>${d.st}</b> · ${SN[d.st]}</span>`;
const cols=[['n','Opportunity'],['a','Account'],['st','Stage'],['cd','Close Date'],['acv','ACV'],['acd','ACD'],['rt','Region / Territory'],['o','Owner']];
let sk=null,sd=1,coll={};
function opts(el,all,vals){el.innerHTML=`<option value="">${all}</option>`+vals.map(v=>`<option>${v}</option>`).join('')}
opts($('fs'),'All Stages',[0,1,2,3,4,5].map(i=>i+' · '+SN[i]));opts($('fr'),'All Regions',[...new Set(D.map(d=>d.reg))].sort());opts($('fa'),'All ACDs',[...new Set(D.map(d=>d.acd))].sort());
function filt(){const q=$('q').value.toLowerCase(),s=$('fs').value,r=$('fr').value,a=$('fa').value,t=$('ft').value;
return D.filter(d=>(!q||(d.n+d.a+d.g+d.o).toLowerCase().includes(q))&&(!s||d.st==s[0])&&(!r||d.reg===r)&&(!a||d.acd===a)&&(!t||d.tags.includes(t)))}
function row(d,flat){return `<tr class="deal"><td><a href="${BASE}${d.id}/view" target="_blank">${d.n}</a> ${tagH(d)}</td><td class="${flat?'':'muted'}">${flat||d.a!==d.g?d.a:''}</td><td>${stg(d)}</td><td>${d.cd}</td><td class="r">${usd(d.acv)}${d.cur!=='USD'?`<br><small class="muted">${Math.round(d.nat).toLocaleString()} ${d.cur}</small>`:''}</td><td>${pill(d.acd)}</td><td>${d.rt}</td><td>${d.o}</td></tr>`}
function render(){const F=filt();let h='';
$('hd').innerHTML=cols.map(([k,l])=>`<th onclick="srt('${k}')">${l}${sk===k?(sd>0?' ▲':' ▼'):''}</th>`).join('');
const gs={};F.forEach(d=>(gs[d.g]=gs[d.g]||[]).push(d));
if(sk){const L=[...F].sort((x,y)=>(x[sk]>y[sk]?1:x[sk]<y[sk]?-1:0)*sd);h=L.map(d=>row(d,true)).join('')}
else Object.entries(gs).map(([g,L])=>[g,L,L.reduce((s,d)=>s+d.acv,0)]).sort((a,b)=>b[2]-a[2]).forEach(([g,L,t])=>{h+=`<tr class="gh" onclick="tg(this.dataset.g)" data-g="${g.replace(/"/g,'&quot;')}"><td colspan="4">${coll[g]?'▸':'▾'} ${g} <span class="muted">· ${L.length} deal${L.length>1?'s':''}</span></td><td class="r">${usd(t)}</td><td colspan="3">${[...new Set(L.map(d=>d.acd))].map(pill).join('')}</td></tr>`;if(!coll[g])h+=L.sort((a,b)=>a.cd>b.cd?1:-1).map(d=>row(d,false)).join('')});
$('tb').innerHTML=h;$('cnt').textContent=`${F.length} deals · ${Object.keys(gs).length} accounts`;
const tot=F.reduce((s,d)=>s+d.acv,0);
$('stats').innerHTML=[['Open Deals',F.length],['Accounts',Object.keys(gs).length],['Pipeline ACV (USD)',usd(tot)],['FedRAMP',F.filter(d=>d.fed).length],['Distinct ACDs',new Set(F.map(d=>d.acd)).size],['AutoSummary',F.filter(d=>d.tags.includes('AutoSummary')).length],['Copilot',F.filter(d=>d.tags.includes('Copilot')).length]].map(([l,v])=>`<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('');
const grp=(k,f,acv)=>{const m={};F.forEach(d=>{const x=f(d);m[x]=m[x]||[0,0];m[x][0]++;m[x][1]+=d.acv});return Object.entries(m).sort().map(([x,[c,v]])=>`<div><span>${x}</span><span>${c}${acv?' · '+usd(v):''}</span></div>`).join('')};
$('side').innerHTML=`<div class="box"><h3>By Stage</h3>${grp('st',d=>d.st+' · '+SN[d.st],1)}</div><div class="box"><h3>By ACD</h3>${grp('acd',d=>d.acd,1)}</div><div class="box"><h3>By Region</h3>${grp('reg',d=>d.reg,0)}</div>`}
function exportXl(){
if(typeof XLSX==='undefined'){alert('Excel library failed to load (check network).');return}
let L=filt();
if(sk)L=[...L].sort((x,y)=>(x[sk]>y[sk]?1:x[sk]<y[sk]?-1:0)*sd);
else{const t={};L.forEach(d=>t[d.g]=(t[d.g]||0)+d.acv);L=[...L].sort((a,b)=>(t[b.g]-t[a.g])||(a.g>b.g?1:-1)||(a.cd>b.cd?1:-1))}
const rows=L.map(d=>({'Account Group':d.g,'Opportunity':d.n,'Opportunity Link':BASE+d.id+'/view','Account':d.a,'Stage':d.st+' - '+d.stl,'Close Date':d.cd,'ACV (USD)':d.acv,'Native ACV':d.nat,'Currency':d.cur,'ACD':d.acd,'FedRAMP':d.fed?'Yes':'No','AutoSummary':d.tags.includes('AutoSummary')?'Yes':'No','Copilot':d.tags.includes('Copilot')?'Yes':'No','Region':d.reg,'Territory':d.rt.includes(' / ')?d.rt.split(' / ').slice(1).join(' / '):(d.reg==='—'?d.rt:''),'Owner':d.o}));
const ws=XLSX.utils.json_to_sheet(rows);
ws['!cols']=[28,60,14,36,32,12,14,14,9,22,9,12,9,14,22,22].map(w=>({wch:w}));
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'eHub Pipeline');
XLSX.writeFile(wb,'ehub_pipeline_'+new Date().toISOString().slice(0,10)+'.xlsx')}
function srt(k){if(sk!==k){sk=k;sd=1}else if(sd===1)sd=-1;else{sk=null;sd=1}render()}
function tg(g){coll[g]=!coll[g];render()}
['q','fs','fr','fa','ft'].forEach(i=>$(i).addEventListener('input',render));render();
</script></body></html>
