<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
  :root {
    --nice-blue: #3694fc;
    --nice-charcoal: #21212b;
    --nice-indigo: #6100FF;
    --nice-teal: #36EAD0;
    --nice-coral: #FF5B8A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6fb;
    color: var(--nice-charcoal);
  }
  #gate {
    position: fixed; inset: 0; background: var(--nice-charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 40px 36px; width: 340px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #gate .card h1 { font-size: 20px; margin: 0 0 4px; color: var(--nice-charcoal); }
  #gate .card p { color: #6b6b76; font-size: 13px; margin: 0 0 20px; }
  #gate input {
    width: 100%; padding: 10px 12px; border: 1px solid #d7d9e3; border-radius: 8px;
    font-size: 14px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
    background: var(--nice-blue); color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  #gate button:hover { background: var(--nice-indigo); }
  #gate .err { color: var(--nice-coral); font-size: 12px; margin-top: 8px; min-height: 16px; }
  #app { display: none; }
  header {
    background: var(--nice-charcoal); color: #fff; padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: #b8b8c8; margin-top: 2px; }
  .stats-bar {
    display: flex; gap: 14px; padding: 16px 28px; flex-wrap: wrap; background: #fff;
    border-bottom: 1px solid #e6e8f0;
  }
  .stat {
    background: #f4f6fb; border-radius: 10px; padding: 12px 18px; min-width: 130px;
  }
  .stat .val { font-size: 20px; font-weight: 700; color: var(--nice-blue); }
  .stat .lbl { font-size: 11px; color: #6b6b76; text-transform: uppercase; letter-spacing: 0.03em; }
  .layout { display: flex; gap: 0; align-items: flex-start; }
  .sidebar {
    width: 260px; flex-shrink: 0; padding: 20px; background: #fff; border-right: 1px solid #e6e8f0;
    position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
  }
  .sidebar h3 { font-size: 12px; text-transform: uppercase; color: #6b6b76; margin: 18px 0 8px; letter-spacing: 0.04em; }
  .sidebar h3:first-child { margin-top: 0; }
  .side-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; border-bottom: 1px dashed #eee; }
  .side-row .n { color: #333; }
  .side-row .v { color: #6b6b76; }
  .main { flex: 1; padding: 20px 28px; min-width: 0; }
  .filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select {
    padding: 8px 10px; border: 1px solid #d7d9e3; border-radius: 8px; font-size: 13px; background: #fff;
  }
  .filters input { flex: 1; min-width: 200px; }
  .count-label { font-size: 12px; color: #6b6b76; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em;
    color: #6b6b76; padding: 10px 12px; border-bottom: 2px solid #e6e8f0; cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  thead th:hover { color: var(--nice-blue); }
  tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #f0f1f6; vertical-align: middle; }
  tr.account-row td {
    background: #eef2fb; font-weight: 600; cursor: pointer; padding-top: 10px; padding-bottom: 10px;
  }
  tr.account-row:hover td { background: #e2e9fa; }
  tr.deal-row td.opp-name { padding-left: 26px; }
  tr.deal-row.hidden { display: none; }
  a.opp-link { color: var(--nice-blue); text-decoration: none; }
  a.opp-link:hover { text-decoration: underline; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; color: #fff;
  }
  .stage-badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff;
  }
  .muted { color: #9a9aa8; font-size: 12px; }
  .fedramp-badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700;
    background: #6100FF; color: #fff;
  }
  .collapse-icon { display: inline-block; width: 14px; transition: transform 0.15s; }
  .collapsed .collapse-icon { transform: rotate(-90deg); }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>eHub Pipeline Dashboard</h1>
    <p>Enter password to continue</p>
    <input type="password" id="pw" placeholder="Password" />
    <button onclick="checkPw()">Access Dashboard</button>
    <div class="err" id="pwerr"></div>
  </div>
</div>

<div id="app">
  <header>
    <div>
      <h1>eHub Pipeline Dashboard</h1>
      <div class="sub">Engagement Hub Real-Time Recording pipeline &middot; open opportunities (stages 0&ndash;5)</div>
    </div>
    <div class="sub" id="genTime"></div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="filters">
        <input type="text" id="search" placeholder="Search opportunity or account..." oninput="render()" />
        <select id="stageFilter" onchange="render()"><option value="">All Stages</option></select>
        <select id="regionFilter" onchange="render()"><option value="">All Regions</option></select>
        <select id="acdFilter" onchange="render()"><option value="">All ACDs</option></select>
      </div>
      <div class="count-label" id="countLabel"></div>
      <table>
        <thead>
          <tr>
            <th data-key="Name">Opportunity</th>
            <th data-key="AccountName">Account</th>
            <th data-key="StageNum">Stage</th>
            <th data-key="CloseDate">Close Date</th>
            <th data-key="usdACV">ACV</th>
            <th data-key="ACD">ACD</th>
            <th data-key="RegionTerritory">Region / Territory</th>
            <th data-key="OwnerName">Owner</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

const ACD_COLORS = {"MS Teams": "#5558af", "Cisco Systems": "#00bceb", "Cisco": "#0d274d", "Amazon Connect": "#ff9900", "Avaya": "#da291c", "Genesys": "#ff4f1f", "Genesys Engage": "#6100FF", "Genesys SIPREC": "#9457ff", "Genesys CX": "#43009e", "Five9": "#00a887", "NICE CXone Mpower": "#3694fc", "UJET": "#7b61ff", "Unknown": "#8a8a99", "Other": "#8a8a99"};
const PW_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";
const STAGE_LABELS = {0:"Prospecting",1:"Identification / Qualification",2:"Determining Problem / Impact",3:"Aligning Benefits & Value",4:"Confirm Value & Agreement",5:"Proposal / Negotiation"};

async function checkPw() {
  const val = document.getElementById('pw').value;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hex === PW_HASH) {
    sessionStorage.setItem('ehub_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pwerr').textContent = 'Incorrect password';
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

if (sessionStorage.getItem('ehub_auth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.addEventListener('DOMContentLoaded', init);
}

function fmtUSD(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

function stageColor(num) {
  if (num <= 1) return '#3694fc';
  if (num <= 3) return '#e0a300';
  if (num === 4) return '#6100FF';
  return '#1fa971';
}

function acdColor(acd) {
  return ACD_COLORS[acd] || ACD_COLORS['Other'];
}

let sortState = { key: null, dir: 1 };
let collapsedAccounts = new Set();

function populateFilterOptions() {
  const stageSel = document.getElementById('stageFilter');
  const stages = [...new Set(DEALS.map(d => d.StageNum))].sort((a,b)=>a-b);
  stages.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s + ' · ' + STAGE_LABELS[s];
    stageSel.appendChild(opt);
  });
  const regionSel = document.getElementById('regionFilter');
  const regions = [...new Set(DEALS.map(d => d.Region).filter(Boolean))].sort();
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });
  const acdSel = document.getElementById('acdFilter');
  const acds = [...new Set(DEALS.map(d => d.ACD).filter(Boolean))].sort();
  acds.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    acdSel.appendChild(opt);
  });
}

function renderStats(filtered) {
  const bar = document.getElementById('statsBar');
  const accounts = new Set(filtered.map(d => d.GroupAccountName));
  const totalAcv = filtered.reduce((s,d) => s + (d.usdACV||0), 0);
  const fedramp = filtered.filter(d => d.FedRAMP === 'Yes').length;
  const acds = new Set(filtered.map(d => d.ACD));
  bar.innerHTML = `
    <div class="stat"><div class="val">${filtered.length}</div><div class="lbl">Open Deals</div></div>
    <div class="stat"><div class="val">${accounts.size}</div><div class="lbl">Accounts</div></div>
    <div class="stat"><div class="val">${fmtUSD(totalAcv)}</div><div class="lbl">Total Pipeline ACV</div></div>
    <div class="stat"><div class="val">${fedramp}</div><div class="lbl">FedRAMP</div></div>
    <div class="stat"><div class="val">${acds.size}</div><div class="lbl">Distinct ACDs</div></div>
  `;
}

function renderSidebar(filtered) {
  const sidebar = document.getElementById('sidebar');
  const byStage = {};
  const byAcd = {};
  const byRegion = {};
  filtered.forEach(d => {
    byStage[d.StageNum] = byStage[d.StageNum] || {count:0, acv:0};
    byStage[d.StageNum].count++; byStage[d.StageNum].acv += d.usdACV||0;
    byAcd[d.ACD] = byAcd[d.ACD] || {count:0, acv:0};
    byAcd[d.ACD].count++; byAcd[d.ACD].acv += d.usdACV||0;
    const r = d.Region || 'Unspecified';
    byRegion[r] = byRegion[r] || {count:0};
    byRegion[r].count++;
  });
  let html = '<h3>By Stage</h3>';
  Object.keys(byStage).sort((a,b)=>a-b).forEach(s => {
    html += `<div class="side-row"><span class="n">${s} · ${STAGE_LABELS[s]}</span><span class="v">${byStage[s].count} &middot; ${fmtUSD(byStage[s].acv)}</span></div>`;
  });
  html += '<h3>By ACD</h3>';
  Object.keys(byAcd).sort((a,b)=>byAcd[b].acv-byAcd[a].acv).forEach(a => {
    html += `<div class="side-row"><span class="n">${a}</span><span class="v">${byAcd[a].count} &middot; ${fmtUSD(byAcd[a].acv)}</span></div>`;
  });
  html += '<h3>By Region</h3>';
  Object.keys(byRegion).sort((a,b)=>byRegion[b].count-byRegion[a].count).forEach(r => {
    html += `<div class="side-row"><span class="n">${r}</span><span class="v">${byRegion[r].count}</span></div>`;
  });
  sidebar.innerHTML = html;
}

function matchesFilter(d, q, stage, region, acd) {
  if (stage && String(d.StageNum) !== stage) return false;
  if (region && d.Region !== region) return false;
  if (acd && d.ACD !== acd) return false;
  if (q) {
    const hay = (d.Name + ' ' + d.AccountName + ' ' + (d.GroupAccountName||'')).toLowerCase();
    if (!hay.includes(q.toLowerCase())) return false;
  }
  return true;
}

function render() {
  const q = document.getElementById('search').value.trim();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;

  const filtered = DEALS.filter(d => matchesFilter(d, q, stage, region, acd));
  renderStats(filtered);
  renderSidebar(filtered);

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  const accountSet = new Set(filtered.map(d => d.GroupAccountName));
  document.getElementById('countLabel').textContent = `${filtered.length} deals · ${accountSet.size} accounts`;

  if (sortState.key) {
    // flattened, globally sorted view
    const rows = [...filtered];
    rows.sort((a,b) => {
      let av = a[sortState.key], bv = b[sortState.key];
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (typeof av === 'string') { av = av.toLowerCase(); bv = (bv||'').toLowerCase(); }
      if (av < bv) return -1 * sortState.dir;
      if (av > bv) return 1 * sortState.dir;
      return 0;
    });
    rows.forEach(d => tbody.appendChild(dealRow(d, true)));
  } else {
    // grouped by account, sorted by total ACV desc
    const groups = {};
    filtered.forEach(d => {
      groups[d.GroupAccountName] = groups[d.GroupAccountName] || [];
      groups[d.GroupAccountName].push(d);
    });
    const groupKeys = Object.keys(groups).sort((a,b) => {
      const at = groups[a].reduce((s,d)=>s+(d.usdACV||0),0);
      const bt = groups[b].reduce((s,d)=>s+(d.usdACV||0),0);
      return bt - at;
    });
    groupKeys.forEach(gk => {
      const deals = groups[gk].slice().sort((a,b) => (a.CloseDate||'').localeCompare(b.CloseDate||''));
      const total = deals.reduce((s,d)=>s+(d.usdACV||0),0);
      const acds = [...new Set(deals.map(d=>d.ACD))];
      const acdBadges = acds.map(a => `<span class="pill" style="background:${acdColor(a)}">${a}</span>`).join(' ');
      const isCollapsed = collapsedAccounts.has(gk);
      const tr = document.createElement('tr');
      tr.className = 'account-row' + (isCollapsed ? ' collapsed' : '');
      tr.innerHTML = `<td colspan="4"><span class="collapse-icon">▾</span> ${gk} <span class="muted">(${deals.length})</span></td><td>${fmtUSD(total)}</td><td>${acdBadges}</td><td colspan="2"></td>`;
      tr.onclick = () => {
        if (collapsedAccounts.has(gk)) collapsedAccounts.delete(gk); else collapsedAccounts.add(gk);
        render();
      };
      tbody.appendChild(tr);
      if (!isCollapsed) {
        deals.forEach(d => tbody.appendChild(dealRow(d, false)));
      }
    });
  }
}

function dealRow(d, showAccount) {
  const tr = document.createElement('tr');
  tr.className = 'deal-row';
  const accountCell = showAccount
    ? d.AccountName
    : (d.AccountName !== d.GroupAccountName ? `<span class="muted">${d.AccountName}</span>` : '');
  tr.innerHTML = `
    <td class="opp-name"><a class="opp-link" href="${d.SFLink}" target="_blank" rel="noopener">${d.Name}</a>${d.FedRAMP==='Yes' ? ' <span class="fedramp-badge">FedRAMP</span>' : ''}</td>
    <td>${accountCell}</td>
    <td><span class="stage-badge" style="background:${stageColor(d.StageNum)}">${d.StageNum}</span> · ${d.StageShort}</td>
    <td>${d.CloseDate || ''}</td>
    <td>${fmtUSD(d.usdACV||0)}${d.CurrencyIsoCode && d.CurrencyIsoCode!=='USD' ? `<div class="muted">${(d.NativeACV||0).toLocaleString()} ${d.CurrencyIsoCode}</div>` : ''}</td>
    <td><span class="pill" style="background:${acdColor(d.ACD)}">${d.ACD}</span></td>
    <td>${d.RegionTerritory || ''}</td>
    <td>${d.OwnerName || ''}</td>
  `;
  return tr;
}

function setupSortHeaders() {
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortState.key === key) {
        if (sortState.dir === 1) { sortState.dir = -1; }
        else { sortState.key = null; sortState.dir = 1; }
      } else {
        sortState.key = key; sortState.dir = 1;
      }
      document.querySelectorAll('thead th').forEach(h => h.textContent = h.textContent.replace(/ ?[▲▼]$/, ''));
      if (sortState.key === key) {
        th.textContent = th.textContent + (sortState.dir === 1 ? ' ▲' : ' ▼');
      }
      render();
    });
  });
}

function init() {
  document.getElementById('genTime').textContent = 'Generated ' + new Date().toISOString().slice(0,10);
  populateFilterOptions();
  setupSortHeaders();
  render();
}

if (sessionStorage.getItem('ehub_auth') === '1') {
  init();
}
</script>
