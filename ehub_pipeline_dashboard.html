<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Pipeline Dashboard</title>
<style>
:root {
  --blue: #3694fc; --charcoal: #21212b; --indigo: #6100FF; --teal:#36EAD0; --coral:#FF5B8A;
}
* { box-sizing: border-box; }
body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background:#f4f6fb; color:var(--charcoal); }

#gate { position:fixed; inset:0; background:var(--charcoal); display:flex; align-items:center; justify-content:center; z-index:9999; }
#gate .card { background:#fff; border-radius:12px; padding:40px 48px; width:340px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
#gate h1 { font-size:20px; margin:0 0 4px; color:var(--charcoal); }
#gate p { color:#777; font-size:13px; margin:0 0 20px; }
#gate input { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:12px; }
#gate button { width:100%; padding:10px 12px; border:none; border-radius:8px; background:var(--blue); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
#gate button:hover { background:#227fe6; }
#gate .err { color:var(--coral); font-size:12px; height:16px; margin-bottom:4px; }
#gate .logo { font-weight:800; font-size:22px; color:var(--blue); margin-bottom:14px; letter-spacing:.5px; }

#app { display:none; padding:20px 28px 60px; max-width:1500px; margin:0 auto; }
header.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
header.top .brand { font-weight:800; font-size:20px; color:var(--charcoal); }
header.top .brand span { color:var(--blue); }
header.top .sub { color:#777; font-size:12.5px; margin-top:2px; }

.stats { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px; }
.stat { background:#fff; border-radius:10px; padding:14px 16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.stat .v { font-size:22px; font-weight:800; color:var(--charcoal); }
.stat .l { font-size:11.5px; color:#888; text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}

.layout { display:grid; grid-template-columns:1fr 260px; gap:18px; align-items:start; }
.panel { background:#fff; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.filters { display:flex; gap:10px; padding:14px 16px; flex-wrap:wrap; align-items:center; border-bottom:1px solid #eee; }
.filters input[type=text] { flex:1; min-width:180px; padding:8px 10px; border:1px solid #ddd; border-radius:8px; font-size:13px; }
.filters select { padding:8px 10px; border:1px solid #ddd; border-radius:8px; font-size:13px; background:#fff; }
.count { font-size:12px; color:#888; padding:10px 16px; }

table { width:100%; border-collapse:collapse; font-size:12.8px; }
th { text-align:left; padding:9px 10px; background:#f8f9fc; color:#555; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px; cursor:pointer; user-select:none; border-bottom:2px solid #eee; white-space:nowrap; }
th:hover { color:var(--blue); }
td { padding:8px 10px; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
tr.acct-row { background:#f8f9fc; cursor:pointer; }
tr.acct-row td { font-weight:700; padding:10px; }
tr.acct-row .chev { display:inline-block; margin-right:6px; transition:transform .15s; color:var(--blue); }
tr.acct-row.collapsed .chev { transform:rotate(-90deg); }
tr.deal-row td.acct-cell { color:#aaa; font-size:12px; }
tr.deal-row a { color:var(--blue); text-decoration:none; }
tr.deal-row a:hover { text-decoration:underline; }
tr.deal-row:hover { background:#fafcff; }

.badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; color:#fff; white-space:nowrap; }
.stage0, .stage1 { background:#3694fc; }
.stage2, .stage3 { background:#e0a800; }
.stage4 { background:#6100FF; }
.stage5 { background:#1ea672; }

.acd-pill { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; color:#fff; white-space:nowrap; }
.fedramp { background:#8a2be2; color:#fff; padding:2px 7px; border-radius:20px; font-size:10.5px; font-weight:700; margin-left:6px; }

.sidebar-section { padding:14px 16px; border-bottom:1px solid #eee; }
.sidebar-section h3 { font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:#888; margin:0 0 10px; }
.sb-row { display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px dashed #f0f0f0; }
.sb-row:last-child { border-bottom:none; }
.sb-row .n { color:#333; }
.sb-row .v { color:#888; font-weight:600; }

.sort-arrow { font-size:10px; margin-left:3px; color:var(--blue); }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <h1>eHub Pipeline Dashboard</h1>
    <p>Enter password to continue</p>
    <div class="err" id="gateErr"></div>
    <input type="password" id="pw" placeholder="Password" />
    <button id="gateBtn">Access Dashboard</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <div>
      <div class="brand">NiCE <span>eHub Pipeline Dashboard</span></div>
      <div class="sub">Engagement Hub (Real-Time Recording) open pipeline &middot; rebuilt daily from Salesforce</div>
    </div>
  </header>

  <div class="stats" id="statsBar"></div>

  <div class="layout">
    <div class="panel">
      <div class="filters">
        <input type="text" id="fSearch" placeholder="Search opportunity, account, owner..." />
        <select id="fStage"><option value="">All Stages</option></select>
        <select id="fRegion"><option value="">All Regions</option></select>
        <select id="fAcd"><option value="">All ACDs</option></select>
      </div>
      <div class="count" id="countLine"></div>
      <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th data-key="Name">Opportunity</th>
            <th data-key="Account">Account</th>
            <th data-key="Stage">Stage</th>
            <th data-key="CloseDate">Close Date</th>
            <th data-key="usdACV">ACV</th>
            <th data-key="ACD">ACD</th>
            <th data-key="Region">Region / Territory</th>
            <th data-key="Owner">Owner</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      </div>
    </div>

    <div class="panel">
      <div class="sidebar-section">
        <h3>By Stage</h3>
        <div id="sbStage"></div>
      </div>
      <div class="sidebar-section">
        <h3>By ACD</h3>
        <div id="sbAcd"></div>
      </div>
      <div class="sidebar-section">
        <h3>By Region</h3>
        <div id="sbRegion"></div>
      </div>
    </div>
  </div>
</div>

const SFBASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

  "Genesys Engage": "#6100FF",

  "Other": "#95a5a6",
  "Unknown": "#bbb"
};
function acdColor(a){ return ACD_COLORS[a] || "#607d8b"; }

async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pw').value;
  const hash = await sha256Hex(val);
  if (hash === STORED_HASH) {
    sessionStorage.setItem('ehub_ok','1');
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('gateErr').textContent = 'Incorrect password';
  }
}
document.getElementById('gateBtn').addEventListener('click', checkPw);
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') checkPw(); });

if (sessionStorage.getItem('ehub_ok') === '1') {
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  window.addEventListener('DOMContentLoaded', init);
}

let sortState = { key:null, dir:1 };
let currentFilter = { search:'', stage:'', region:'', acd:'' };

function fmtUSD(n){
  return '$' + Math.round(n).toLocaleString('en-US');
}

function populateFilterOptions(){
  const stages = [...new Set(DATA.map(d=>d.Stage))].sort((a,b)=>a-b);
  const stageSel = document.getElementById('fStage');
  stages.forEach(s=>{
    const o = document.createElement('option');
    o.value = s; o.textContent = s + ' · ' + STAGE_LABELS[s];
    stageSel.appendChild(o);
  });
  const regions = [...new Set(DATA.map(d=>d.Region).filter(Boolean))].sort();
  const regionSel = document.getElementById('fRegion');
  regions.forEach(r=>{
    const o = document.createElement('option'); o.value=r; o.textContent=r; regionSel.appendChild(o);
  });
  const acds = [...new Set(DATA.map(d=>d.ACD).filter(Boolean))].sort();
  const acdSel = document.getElementById('fAcd');
  acds.forEach(a=>{
    const o = document.createElement('option'); o.value=a; o.textContent=a; acdSel.appendChild(o);
  });
}

function applyFilter(rows){
  const s = currentFilter.search.toLowerCase();
  return rows.filter(r=>{
    if (currentFilter.stage !== '' && String(r.Stage) !== currentFilter.stage) return false;
    if (currentFilter.region !== '' && r.Region !== currentFilter.region) return false;
    if (currentFilter.acd !== '' && r.ACD !== currentFilter.acd) return false;
    if (s) {
      const hay = (r.Name+' '+r.Account+' '+r.TopParent+' '+r.Owner).toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });
}

function renderStats(rows){
  const total = rows.length;
  const accounts = new Set(rows.map(r=>r.TopParent)).size;
  const acv = rows.reduce((a,r)=>a+r.usdACV,0);
  const fedramp = rows.filter(r=>r.FedRAMP==='Yes').length;
  const acds = new Set(rows.map(r=>r.ACD)).size;
  const stats = [
    {v: total, l:'Open Deals'},
    {v: accounts, l:'Accounts'},
    {v: fmtUSD(acv), l:'Total Pipeline ACV'},
    {v: fedramp, l:'FedRAMP Deals'},
    {v: acds, l:'Distinct ACDs'},
  ];
  document.getElementById('statsBar').innerHTML = stats.map(s=>`<div class="stat"><div class="v">${s.v}</div><div class="l">${s.l}</div></div>`).join('');
}

function renderSidebar(rows){
  function groupBy(key){
    const m = {};
    rows.forEach(r=>{
      const k = key(r);
      if (!m[k]) m[k] = {count:0, acv:0};
      m[k].count++; m[k].acv += r.usdACV;
    });
    return m;
  }
  const byStage = groupBy(r=>r.Stage);
  const stageHtml = Object.keys(byStage).sort((a,b)=>a-b).map(k=>{
    return `<div class="sb-row"><span class="n">${k} · ${STAGE_LABELS[k]}</span><span class="v">${byStage[k].count} · ${fmtUSD(byStage[k].acv)}</span></div>`;
  }).join('');
  document.getElementById('sbStage').innerHTML = stageHtml;

  const byAcd = groupBy(r=>r.ACD);
  const acdHtml = Object.keys(byAcd).sort((a,b)=>byAcd[b].acv-byAcd[a].acv).map(k=>{
    return `<div class="sb-row"><span class="n">${k}</span><span class="v">${byAcd[k].count} · ${fmtUSD(byAcd[k].acv)}</span></div>`;
  }).join('');
  document.getElementById('sbAcd').innerHTML = acdHtml;

  const byRegion = groupBy(r=>r.Region||'—');
  const regionHtml = Object.keys(byRegion).sort((a,b)=>byRegion[b].count-byRegion[a].count).map(k=>{
    return `<div class="sb-row"><span class="n">${k}</span><span class="v">${byRegion[k].count}</span></div>`;
  }).join('');
  document.getElementById('sbRegion').innerHTML = regionHtml;
}

function stageBadge(r){
  return `<span class="badge stage${r.Stage}">${r.Stage} · ${STAGE_LABELS[r.Stage]}</span>`;
}
function acdPill(r){
  let html = `<span class="acd-pill" style="background:${acdColor(r.ACD)}">${r.ACD}</span>`;
  if (r.FedRAMP === 'Yes') html += `<span class="fedramp">FedRAMP</span>`;
  return html;
}
function regionCell(r){
  if (r.Region && r.Territory) return r.Region + ' / ' + r.Territory;
  return r.Region || r.Territory || '—';
}

function dealRowHtml(r, showAccount){
  const acctCell = showAccount ? `<td>${r.Account}${r.Account!==r.TopParent ? ' <span style="color:#bbb;font-size:11px">('+r.TopParent+')</span>' : ''}</td>` : `<td class="acct-cell">${r.Account !== r.TopParent ? r.Account : ''}</td>`;
  return `<tr class="deal-row">
    <td><a href="${SFBASE}${r.Id}/view" target="_blank" rel="noopener">${r.Name}</a></td>
    ${acctCell}
    <td>${stageBadge(r)}</td>
    <td>${r.CloseDate || ''}</td>
    <td>${fmtUSD(r.usdACV)}${r.currency!=='USD' ? ' <span style="color:#aaa;font-size:11px">('+r.nativeACV.toLocaleString()+' '+r.currency+')</span>' : ''}</td>
    <td>${acdPill(r)}</td>
    <td>${regionCell(r)}</td>
    <td>${r.Owner || ''}</td>
  </tr>`;
}

let collapsedAccounts = new Set();

function render(){
  const filtered = applyFilter(DATA);
  const tbody = document.getElementById('tbody');
  let html = '';

  if (sortState.key) {
    const sorted = [...filtered].sort((a,b)=>{
      let av = a[sortState.key], bv = b[sortState.key];
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return -1*sortState.dir;
      if (av > bv) return 1*sortState.dir;
      return 0;
    });
    sorted.forEach(r=>{ html += dealRowHtml(r, true); });
    document.getElementById('countLine').textContent = `${filtered.length} deals (sorted)`;
  } else {
    const groups = {};
    filtered.forEach(r=>{
      const k = r.TopParent;
      if (!groups[k]) groups[k] = [];
      groups[k].push(r);
    });
    const accountList = Object.keys(groups).map(k=>{
      const deals = groups[k];
      const acv = deals.reduce((a,d)=>a+d.usdACV,0);
      return {name:k, deals, acv};
    }).sort((a,b)=>b.acv-a.acv);

    accountList.forEach(acct=>{
      const collapsed = collapsedAccounts.has(acct.name);
      const acds = [...new Set(acct.deals.map(d=>d.ACD))];
      const acdBadges = acds.map(a=>`<span class="acd-pill" style="background:${acdColor(a)}">${a}</span>`).join(' ');
      html += `<tr class="acct-row ${collapsed?'collapsed':''}" data-acct="${acct.name.replace(/"/g,'&quot;')}">
        <td colspan="8"><span class="chev">▼</span>${acct.name} &nbsp; <span style="color:#999;font-weight:500;font-size:12px;">${acct.deals.length} deal${acct.deals.length>1?'s':''} &middot; ${acdBadges} &middot; ${fmtUSD(acct.acv)}</span></td>
      </tr>`;
      if (!collapsed) {
        const dealsSorted = [...acct.deals].sort((a,b)=> (a.CloseDate||'').localeCompare(b.CloseDate||''));
        dealsSorted.forEach(d=>{ html += dealRowHtml(d, false); });
      }
    });
    document.getElementById('countLine').textContent = `${filtered.length} deals · ${accountList.length} accounts`;
  }

  tbody.innerHTML = html;

  document.querySelectorAll('tr.acct-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const name = row.getAttribute('data-acct');
      if (collapsedAccounts.has(name)) collapsedAccounts.delete(name);
      else collapsedAccounts.add(name);
      render();
    });
  });

  renderStats(filtered);
  renderSidebar(filtered);

  document.querySelectorAll('th').forEach(th=>{
    th.querySelector('.sort-arrow')?.remove();
    if (sortState.key === th.getAttribute('data-key')) {
      const arrow = document.createElement('span');
      arrow.className='sort-arrow';
      arrow.textContent = sortState.dir===1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
  });
}

function init(){
  populateFilterOptions();

  document.getElementById('fSearch').addEventListener('input', e=>{ currentFilter.search = e.target.value; render(); });
  document.getElementById('fStage').addEventListener('change', e=>{ currentFilter.stage = e.target.value; render(); });
  document.getElementById('fRegion').addEventListener('change', e=>{ currentFilter.region = e.target.value; render(); });
  document.getElementById('fAcd').addEventListener('change', e=>{ currentFilter.acd = e.target.value; render(); });

  document.querySelectorAll('th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.getAttribute('data-key');
      if (sortState.key !== key) { sortState.key = key; sortState.dir = 1; }
      else if (sortState.dir === 1) { sortState.dir = -1; }
      else { sortState.key = null; sortState.dir = 1; }
      render();
    });
  });

  render();
}
</script>
