<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
  :root {
    --nice-blue: #3694fc;
    --nice-charcoal: #21212b;
    --nice-indigo: #6100FF;
    --nice-teal: #36EAD0;
    --nice-coral: #FF5B8A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6fb;
    color: var(--nice-charcoal);
  }

  /* ===== Password Gate ===== */
  #pwGate {
    position: fixed; inset: 0;
    background: var(--nice-charcoal);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  #pwGate .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 44px;
    width: 360px;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  #pwGate .logo {
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--nice-charcoal);
    margin-bottom: 4px;
  }
  #pwGate .logo span { color: var(--nice-blue); }
  #pwGate .subtitle {
    color: #6b6b76;
    font-size: 13px;
    margin-bottom: 24px;
  }
  #pwGate input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid #dcdfe6;
    font-size: 14px;
    margin-bottom: 14px;
    outline: none;
  }
  #pwGate input:focus { border-color: var(--nice-blue); }
  #pwGate button {
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: 8px;
    background: var(--nice-blue);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #pwGate button:hover { background: #237bdb; }
  #pwGate .err {
    color: var(--nice-coral);
    font-size: 12.5px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* ===== App shell ===== */
  #app { display: none; }
  header.topbar {
    background: var(--nice-charcoal);
    color: #fff;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header.topbar h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
  }
  header.topbar h1 span { color: var(--nice-blue); }
  header.topbar .sub { font-size: 12px; color: #9a9aa6; margin-top: 2px; }

  .stats-bar {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    padding: 18px 28px 6px 28px;
  }
  .stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 18px;
    min-width: 150px;
    flex: 1;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid #eceef4;
  }
  .stat-card .val { font-size: 22px; font-weight: 800; color: var(--nice-charcoal); }
  .stat-card .lbl { font-size: 11.5px; color: #8a8a96; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }

  .layout {
    display: flex;
    gap: 18px;
    padding: 14px 28px 36px 28px;
    align-items: flex-start;
  }
  aside.sidebar {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .side-card {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #eceef4;
    padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .side-card h3 {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8a8a96;
    margin: 0 0 10px 0;
  }
  .side-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 5px 0;
    border-bottom: 1px dashed #eef0f5;
  }
  .side-row:last-child { border-bottom: none; }
  .side-row .name { color: var(--nice-charcoal); font-weight: 600; }
  .side-row .meta { color: #8a8a96; font-size: 11.5px; }

  main.content { flex: 1; min-width: 0; }

  .filters {
    background: #fff;
    border-radius: 12px;
    border: 1px solid #eceef4;
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 12px;
  }
  .filters input[type=text] {
    flex: 1;
    min-width: 180px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1.5px solid #dcdfe6;
    font-size: 13px;
    outline: none;
  }
  .filters select {
    padding: 9px 10px;
    border-radius: 8px;
    border: 1.5px solid #dcdfe6;
    font-size: 13px;
    background: #fff;
    outline: none;
  }
  .filters .count {
    font-size: 12.5px;
    color: #6b6b76;
    margin-left: auto;
    white-space: nowrap;
  }

  table.deals {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    border: 1px solid #eceef4;
  }
  table.deals th {
    background: #f8f9fc;
    text-align: left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: #6b6b76;
    padding: 10px 12px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    border-bottom: 1px solid #eceef4;
  }
  table.deals th:hover { color: var(--nice-blue); }
  table.deals td {
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid #f2f3f7;
    vertical-align: middle;
  }
  table.deals tr.deal-row:hover { background: #f8faff; }
  table.deals a.opp-link { color: var(--nice-blue); text-decoration: none; font-weight: 600; }
  table.deals a.opp-link:hover { text-decoration: underline; }
  .muted { color: #a5a5b0; font-size: 12px; }

  tr.account-header {
    background: #eef2fb;
    cursor: pointer;
  }
  tr.account-header:hover { background: #e3ebfb; }
  tr.account-header td {
    padding: 11px 12px;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--nice-charcoal);
  }
  tr.account-header .caret {
    display: inline-block;
    width: 14px;
    transition: transform 0.15s;
    color: var(--nice-blue);
  }
  tr.account-header.collapsed .caret { transform: rotate(-90deg); }
  tr.account-header .acc-meta {
    font-weight: 400;
    color: #6b6b76;
    font-size: 12px;
    margin-left: 8px;
  }

  .pill {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
  }
  .stage-badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
  }
  .fedramp-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 700;
    background: #6100FF;
    color: #fff;
    margin-left: 6px;
  }
  .sort-arrow { font-size: 10px; margin-left: 3px; color: var(--nice-blue); }

  footer.foot {
    text-align: center;
    font-size: 11.5px;
    color: #9a9aa6;
    padding: 10px 0 30px 0;
  }

  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    aside.sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .side-card { flex: 1; min-width: 220px; }
  }
</style>
</head>
<body>

<div id="pwGate">
  <div class="card">
    <div class="logo">NiC<span>E</span></div>
    <div class="subtitle">eHub Pipeline Dashboard</div>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div>
      <h1>eHub <span>Pipeline</span> Dashboard</h1>
      <div class="sub">Engagement Hub (Real-Time Recording) open pipeline &middot; generated 2026-08-16</div>
    </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-card">
        <h3>By Stage</h3>
        <div id="byStage"></div>
      </div>
      <div class="side-card">
        <h3>By ACD</h3>
        <div id="byACD"></div>
      </div>
      <div class="side-card">
        <h3>By Region</h3>
        <div id="byRegion"></div>
      </div>
    </aside>

    <main class="content">
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search opportunity, account, owner...">
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <select id="acdFilter"><option value="">All ACD</option></select>
        <span class="count" id="resultCount"></span>
      </div>
      <table class="deals">
        <thead>
          <tr id="tableHead"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </main>
  </div>

  <footer class="foot">NiCE &middot; eHub Pipeline Dashboard &middot; data from Salesforce CPQ</footer>
</div>

<script>
const STORED_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const hash = await sha256Hex(val);
  if (hash === STORED_HASH) {
    sessionStorage.setItem('ehub_ok', '1');
    document.getElementById('pwGate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}

document.getElementById('pwBtn').addEventListener('click', checkPw);
document.getElementById('pwInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') checkPw();
});

if (sessionStorage.getItem('ehub_ok') === '1') {
  document.getElementById('pwGate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.addEventListener('DOMContentLoaded', initApp);
}

const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

const STAGE_COLORS = { 0:'#3694fc', 1:'#3694fc', 2:'#f5b400', 3:'#f5b400', 4:'#6100FF', 5:'#1ec98a' };
const ACD_COLORS = {
  'Cisco Systems': '#049fd9',
  'Genesys': '#ff4f1f',
  'Avaya': '#e2231a',
  'Amazon Connect': '#ff9900',
  'MS Teams': '#5059c9',
  'NICE CXone Mpower': '#3694fc',
  'UJET': '#8a2be2',
  'Mitel': '#0072ce',
  'Other': '#8a8a96',
};

const COLUMNS = [
  { key: 'name', label: 'Opportunity' },
  { key: 'accountName', label: 'Account' },
  { key: 'stageNum', label: 'Stage' },
  { key: 'closeDate', label: 'Close Date' },
  { key: 'usdACV', label: 'ACV' },
  { key: 'acd', label: 'ACD' },
  { key: 'region', label: 'Region / Territory' },
  { key: 'owner', label: 'Owner' },
];

let sortState = { col: null, dir: 1 }; // dir: 1 asc, -1 desc, 0 = grouped(default)
let collapsedAccounts = new Set();

function fmtUSD(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

function acdColor(acd) {
  return ACD_COLORS[acd] || '#8a8a96';
}

function stageBadge(stageNum, stageLabel) {
  const color = STAGE_COLORS[stageNum] ?? '#8a8a96';
  return `<span class="stage-badge" style="background:${color}">${stageNum} &middot; ${stageLabel}</span>`;
}

function regionTerr(r) {
  if (r.territory && r.territory.trim()) return `${r.region} / ${r.territory}`;
  return r.region || '';
}

function getFiltered() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;
  return DATA.filter(d => {
    if (stage !== '' && String(d.stageNum) !== stage) return false;
    if (region !== '' && d.region !== region) return false;
    if (acd !== '' && d.acd !== acd) return false;
    if (q) {
      const hay = `${d.name} ${d.accountName} ${d.groupAccount} ${d.owner}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function populateFilterOptions() {
  const stages = [...new Set(DATA.map(d => d.stageNum))].sort((a,b)=>a-b);
  const stageSel = document.getElementById('stageFilter');
  stages.forEach(s => {
    const label = DATA.find(d => d.stageNum === s).stageLabel;
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = `${s} - ${label}`;
    stageSel.appendChild(opt);
  });
  const regions = [...new Set(DATA.map(d => d.region))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });
  const acds = [...new Set(DATA.map(d => d.acd))].sort();
  const acdSel = document.getElementById('acdFilter');
  acds.forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    acdSel.appendChild(opt);
  });
}

function renderHead() {
  const tr = document.getElementById('tableHead');
  tr.innerHTML = '';
  COLUMNS.forEach(col => {
    const th = document.createElement('th');
    let arrow = '';
    if (sortState.col === col.key && sortState.dir !== 0) {
      arrow = `<span class="sort-arrow">${sortState.dir === 1 ? '▲' : '▼'}</span>`;
    }
    th.innerHTML = `${col.label}${arrow}`;
    th.addEventListener('click', () => onSort(col.key));
    tr.appendChild(th);
  });
}

function onSort(key) {
  if (sortState.col !== key) {
    sortState.col = key;
    sortState.dir = 1;
  } else if (sortState.dir === 1) {
    sortState.dir = -1;
  } else {
    sortState.col = null;
    sortState.dir = 0;
  }
  renderHead();
  renderTable();
}

function dealRowHtml(d, showAccount) {
  const acctCell = showAccount
    ? (d.accountName === d.groupAccount ? (d.accountName||'') : `<span class="muted">${d.accountName||''}</span>`)
    : '';
  const fed = d.fedramp === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : '';
  return `<tr class="deal-row">
    <td><a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank" rel="noopener">${d.name}</a>${fed}</td>
    <td>${acctCell}</td>
    <td>${stageBadge(d.stageNum, d.stageLabel)}</td>
    <td>${d.closeDate || ''}</td>
    <td>${fmtUSD(d.usdACV)}${d.currency && d.currency !== 'USD' ? `<div class="muted">${d.nativeACV.toLocaleString()} ${d.currency}</div>` : ''}</td>
    <td><span class="pill" style="background:${acdColor(d.acd)}">${d.acd}</span></td>
    <td>${regionTerr(d)}</td>
    <td>${d.owner || ''}</td>
  </tr>`;
}

function renderTable() {
  const filtered = getFiltered();
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  if (sortState.col && sortState.dir !== 0) {
    const key = sortState.col, dir = sortState.dir;
    const sorted = [...filtered].sort((a,b) => {
      let av = a[key], bv = b[key];
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
    sorted.forEach(d => tbody.insertAdjacentHTML('beforeend', dealRowHtml(d, true)));
    document.getElementById('resultCount').textContent = `${filtered.length} deals`;
    return;
  }

  // grouped by account, sorted by total ACV desc
  const groups = {};
  filtered.forEach(d => {
    if (!groups[d.groupAccount]) groups[d.groupAccount] = [];
    groups[d.groupAccount].push(d);
  });
  const groupNames = Object.keys(groups).sort((a,b) => {
    const totalA = groups[a].reduce((s,d)=>s+d.usdACV,0);
    const totalB = groups[b].reduce((s,d)=>s+d.usdACV,0);
    return totalB - totalA;
  });

  groupNames.forEach(name => {
    const deals = groups[name].sort((a,b) => new Date(a.closeDate) - new Date(b.closeDate));
    const total = deals.reduce((s,d)=>s+d.usdACV,0);
    const acds = [...new Set(deals.map(d=>d.acd))];
    const isCollapsed = collapsedAccounts.has(name);
    const headerRow = document.createElement('tr');
    headerRow.className = 'account-header' + (isCollapsed ? ' collapsed' : '');
    headerRow.innerHTML = `<td colspan="8">
      <span class="caret">&#9660;</span> ${name}
      <span class="acc-meta">${deals.length} deal${deals.length>1?'s':''} &middot; ${acds.map(a=>`<span class="pill" style="background:${acdColor(a)}">${a}</span>`).join(' ')} &middot; ${fmtUSD(total)}</span>
    </td>`;
    headerRow.addEventListener('click', () => {
      if (collapsedAccounts.has(name)) collapsedAccounts.delete(name);
      else collapsedAccounts.add(name);
      renderTable();
    });
    tbody.appendChild(headerRow);
    if (!isCollapsed) {
      deals.forEach(d => tbody.insertAdjacentHTML('beforeend', dealRowHtml(d, false)));
    }
  });

  document.getElementById('resultCount').textContent = `${filtered.length} deals · ${groupNames.length} accounts`;
}

function renderStats() {
  const total = DATA.length;
  const accounts = new Set(DATA.map(d => d.groupAccount)).size;
  const totalACV = DATA.reduce((s,d) => s+d.usdACV, 0);
  const fedramp = DATA.filter(d => d.fedramp === 'Yes').length;
  const acds = new Set(DATA.map(d => d.acd)).size;

  const stats = [
    { val: total, lbl: 'Open Deals' },
    { val: accounts, lbl: 'Accounts' },
    { val: fmtUSD(totalACV), lbl: 'Total Pipeline ACV (USD)' },
    { val: fedramp, lbl: 'FedRAMP Deals' },
    { val: acds, lbl: 'Distinct ACD' },
  ];
  const bar = document.getElementById('statsBar');
  bar.innerHTML = stats.map(s => `<div class="stat-card"><div class="val">${s.val}</div><div class="lbl">${s.lbl}</div></div>`).join('');
}

function renderSidebar() {
  function groupBy(fn) {
    const m = {};
    DATA.forEach(d => {
      const k = fn(d);
      if (!m[k]) m[k] = { count: 0, acv: 0 };
      m[k].count++; m[k].acv += d.usdACV;
    });
    return m;
  }

  const byStage = groupBy(d => `${d.stageNum} · ${d.stageLabel}`);
  const stageKeys = Object.keys(byStage).sort((a,b) => parseInt(a) - parseInt(b));
  document.getElementById('byStage').innerHTML = stageKeys.map(k => `
    <div class="side-row"><span class="name">${k}</span><span class="meta">${byStage[k].count} · ${fmtUSD(byStage[k].acv)}</span></div>
  `).join('');

  const byACD = groupBy(d => d.acd);
  const acdKeys = Object.keys(byACD).sort((a,b) => byACD[b].acv - byACD[a].acv);
  document.getElementById('byACD').innerHTML = acdKeys.map(k => `
    <div class="side-row"><span class="name">${k}</span><span class="meta">${byACD[k].count} · ${fmtUSD(byACD[k].acv)}</span></div>
  `).join('');

  const byRegion = groupBy(d => d.region);
  const regionKeys = Object.keys(byRegion).sort((a,b) => byRegion[b].count - byRegion[a].count);
  document.getElementById('byRegion').innerHTML = regionKeys.map(k => `
    <div class="side-row"><span class="name">${k}</span><span class="meta">${byRegion[k].count}</span></div>
  `).join('');
}

function initApp() {
  populateFilterOptions();
  renderStats();
  renderSidebar();
  renderHead();
  renderTable();

  document.getElementById('searchBox').addEventListener('input', renderTable);
  document.getElementById('stageFilter').addEventListener('change', renderTable);
  document.getElementById('regionFilter').addEventListener('change', renderTable);
  document.getElementById('acdFilter').addEventListener('change', renderTable);
}
</script>
</body>
</html>
