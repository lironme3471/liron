<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Be Vietnam Pro', -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f4f6fa; color: #21212b; }
a { color: #3694fc; text-decoration: none; }
a:hover { text-decoration: underline; }
/* Password gate */
#pw-overlay { position: fixed; inset: 0; background: #21212b; z-index: 1000; display: flex; align-items: center; justify-content: center; }
.pw-card { background: #fff; border-radius: 14px; padding: 40px 44px; width: 380px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.pw-logo { font-size: 30px; font-weight: 800; margin-bottom: 4px; }
.pw-logo .n1 { color: #21212b; } .pw-logo .n2 { color: #3694fc; }
.pw-card h2 { font-size: 17px; font-weight: 600; margin: 10px 0 2px; }
.pw-card p { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
#pw-input { width: 100%; padding: 11px 14px; border: 1.5px solid #d6dbe4; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
#pw-input:focus { outline: none; border-color: #3694fc; }
#pw-btn { width: 100%; padding: 11px; background: #3694fc; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
#pw-btn:hover { background: #2280e8; }
#pw-err { display: none; color: #d6002a; font-size: 12.5px; margin-top: 10px; }
/* Header */
.topbar { background: #21212b; color: #fff; padding: 16px 28px; display: flex; align-items: baseline; gap: 16px; }
.topbar .logo { font-size: 22px; font-weight: 800; }
.topbar .logo .n2 { color: #3694fc; }
.topbar h1 { font-size: 16px; font-weight: 500; color: #d8dce5; }
.topbar .updated { margin-left: auto; font-size: 12.5px; color: #9aa0ae; }
/* Stats */
.stats { display: flex; gap: 14px; padding: 18px 28px 0; flex-wrap: wrap; }
.stat { background: #fff; border-radius: 12px; padding: 14px 22px; box-shadow: 0 1px 4px rgba(33,33,43,.07); min-width: 150px; }
.stat .v { font-size: 24px; font-weight: 700; color: #21212b; }
.stat .l { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; margin-top: 2px; }
.stat.acv .v { color: #3694fc; }
.stat.fed .v { color: #6100FF; }
/* Layout */
.main { display: flex; gap: 18px; padding: 18px 28px 40px; align-items: flex-start; }
.table-wrap { flex: 1; background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(33,33,43,.07); overflow: hidden; min-width: 0; }
#sidebar { width: 290px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
.side-block { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(33,33,43,.07); }
.side-block h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: #6b7280; margin-bottom: 10px; }
.side-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12.5px; gap: 8px; }
.side-val { font-weight: 600; white-space: nowrap; color: #21212b; }
.stage-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
/* Filters */
.filters { display: flex; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #e8ebf1; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { padding: 8px 11px; border: 1.5px solid #d6dbe4; border-radius: 8px; font-size: 13px; background: #fff; }
.filters input:focus, .filters select:focus { outline: none; border-color: #3694fc; }
#f-search { width: 240px; }
#count-line { margin-left: auto; font-size: 12.5px; color: #6b7280; font-weight: 500; }
/* Table */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { position: sticky; top: 0; background: #fafbfd; text-align: left; padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; border-bottom: 2px solid #e8ebf1; cursor: pointer; user-select: none; white-space: nowrap; }
thead th:hover { color: #3694fc; }
.arr { color: #3694fc; font-size: 10px; }
tbody td { padding: 9px 12px; border-bottom: 1px solid #f0f2f7; vertical-align: top; }
.deal-row:hover { background: #f7faff; }
.deal-row.indented td:first-child { padding-left: 34px; }
.acct-row { background: #eef3fb; cursor: pointer; }
.acct-row:hover { background: #e4edfa; }
.acct-row td { padding: 8px 12px; border-bottom: 1px solid #dfe7f3; }
.acct-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.caret { color: #3694fc; font-size: 12px; width: 12px; }
.acct-name { font-weight: 700; font-size: 13.5px; }
.acct-count { font-size: 12px; color: #6b7280; }
.acct-acds { display: flex; gap: 4px; flex-wrap: wrap; }
.acct-total { margin-left: auto; font-weight: 700; color: #3694fc; }
.opp-cell { max-width: 340px; }
.acv-cell { font-weight: 600; white-space: nowrap; }
.acv-sub { font-size: 11px; color: #9aa0ae; font-weight: 400; }
.muted-sub { color: #9aa0ae; font-size: 11.5px; }
.nowrap { white-space: nowrap; }
.stage-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11.5px; white-space: nowrap; }
.stage-badge b { font-size: 12px; }
.acd-pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
.fed-badge { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; background: #6100FF; color: #fff; vertical-align: 1px; }
.empty { text-align: center; color: #9aa0ae; padding: 30px !important; }
@media (max-width: 1100px){ .main { flex-direction: column; } #sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; } .side-block { flex: 1; min-width: 240px; } }
</style>
</head>

function fmtDate(s){
  if (!s) return '—';

  const val = el.value;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hex === PW_HASH){
    sessionStorage.setItem('ehub_auth','1');
    document.getElementById('pw-overlay').style.display = 'none';
  } else {
    document.getElementById('pw-err').style.display = 'block';
    el.value = ''; el.focus();
  }
}
function initGate(){
  if (sessionStorage.getItem('ehub_auth') === '1'){
    document.getElementById('pw-overlay').style.display = 'none';
  } else {
    document.getElementById('pw-input').focus();
  }
}

// ---------- State ----------
let sortCol = null, sortDir = 1;
const collapsed = new Set();
const COLS = [
  {key:'name',    label:'Opportunity'},
  {key:'group',   label:'Account'},
  {key:'stage',   label:'Stage'},
  {key:'close',   label:'Close Date'},
  {key:'usd',     label:'ACV'},
  {key:'acd',     label:'ACD'},
  {key:'regt',    label:'Region / Territory'},
  {key:'owner',   label:'Owner'}
];
function sortVal(d, key){
  if (key === 'regt') return regionDisplay(d).toLowerCase();
  const v = d[key];
  return (typeof v === 'string') ? v.toLowerCase() : v;
}

function filtered(){
  const q = document.getElementById('f-search').value.trim().toLowerCase();
  const st = document.getElementById('f-stage').value;
  const rg = document.getElementById('f-region').value;
  const ac = document.getElementById('f-acd').value;
  return DATA.filter(d => {
    if (st !== '' && String(d.stage) !== st) return false;
    if (rg !== '' && (d.region || '—') !== rg) return false;
    if (ac !== '' && d.acd !== ac) return false;
    if (q){
      const hay = (d.name + ' ' + d.acct + ' ' + d.group + ' ' + d.owner + ' ' + d.acd).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function stageBadge(d){
  const c = STAGE_COLORS[d.stage];
  return '<span class="stage-badge" style="background:' + c + '1a;color:' + c + ';border:1px solid ' + c + '55">' +
         '<b>' + d.stage + '</b>&nbsp;·&nbsp;' + esc(d.stageLabel) + '</span>';
}
function acdPill(a){
  const c = acdColor(a);
  return '<span class="acd-pill" style="background:' + c + '">' + esc(a) + '</span>';
}
function fedBadge(){ return '<span class="fed-badge">FedRAMP</span>'; }

function dealRow(d, showAcct, groupName, indent){
  const acctCell = showAcct
    ? '<td>' + esc(d.group) + (d.acct !== d.group ? ' <span class="muted-sub">' + esc(d.acct) + '</span>' : '') + '</td>'
    : '<td class="muted-cell">' + (d.acct !== groupName ? '<span class="muted-sub">' + esc(d.acct) + '</span>' : '') + '</td>';
  const sub = d.cur !== 'USD' ? '<div class="acv-sub">' + esc(fmtNative(d.native, d.cur)) + '</div>' : '';
  return '<tr class="deal-row' + (indent ? ' indented' : '') + '">' +
    '<td class="opp-cell"><a href="' + SF_BASE + d.id + '/view" target="_blank" rel="noopener">' + esc(d.name) + '</a>' + (d.fed ? ' ' + fedBadge() : '') + '</td>' +
    acctCell +
    '<td>' + stageBadge(d) + '</td>' +
    '<td class="nowrap">' + fmtDate(d.close) + '</td>' +
    '<td class="acv-cell">' + fmtUSD(d.usd) + sub + '</td>' +
    '<td>' + acdPill(d.acd) + '</td>' +
    '<td>' + esc(regionDisplay(d)) + '</td>' +
    '<td>' + esc(d.owner) + '</td></tr>';
}

function render(){
  const rows = filtered();
  // header sort indicators
  COLS.forEach((c, i) => {
    const th = document.getElementById('th-' + i);
    th.innerHTML = esc(c.label) + (sortCol === i ? (sortDir === 1 ? ' <span class="arr">▲</span>' : ' <span class="arr">▼</span>') : '');
  });
  let html = '';
  if (sortCol === null){
    // grouped by account
    const groups = new Map();
    rows.forEach(d => {
      if (!groups.has(d.group)) groups.set(d.group, []);
      groups.get(d.group).push(d);
    });
    const order = [...groups.entries()].map(([g, ds]) => ({g, ds, tot: ds.reduce((s,d)=>s+d.usd,0)}));
    order.sort((a,b) => b.tot - a.tot);
    order.forEach(({g, ds, tot}) => {
      ds.sort((a,b) => a.close < b.close ? -1 : a.close > b.close ? 1 : 0);
      const acds = [...new Set(ds.map(d=>d.acd))];
      const isCol = collapsed.has(g);
      html += '<tr class="acct-row" data-group="' + esc(g) + '"><td colspan="8"><div class="acct-line">' +
        '<span class="caret">' + (isCol ? '▸' : '▾') + '</span>' +
        '<span class="acct-name">' + esc(g) + '</span>' +
        '<span class="acct-count">' + ds.length + ' deal' + (ds.length>1?'s':'') + '</span>' +
        '<span class="acct-acds">' + acds.map(acdPill).join(' ') + '</span>' +
        '<span class="acct-total">' + fmtUSD(tot) + '</span></div></td></tr>';
      if (!isCol) ds.forEach(d => { html += dealRow(d, false, g, true); });
    });
  } else {
    const key = COLS[sortCol].key;
    const sorted = [...rows].sort((a,b) => {
      const va = sortVal(a,key), vb = sortVal(b,key);
      if (va < vb) return -sortDir;
      if (va > vb) return sortDir;
      return 0;
    });
    sorted.forEach(d => { html += dealRow(d, true, null, false); });
  }
  document.getElementById('tbody').innerHTML = html || '<tr><td colspan="8" class="empty">No deals match the current filters</td></tr>';
  document.querySelectorAll('.acct-row').forEach(tr => {
    tr.addEventListener('click', () => {
      const g = tr.getAttribute('data-group');
      if (collapsed.has(g)) collapsed.delete(g); else collapsed.add(g);
      render();
    });
  });
  // counts + stats + sidebar
  const gset = new Set(rows.map(d=>d.group));
  document.getElementById('count-line').textContent = rows.length + ' deals · ' + gset.size + ' accounts';
  document.getElementById('st-deals').textContent = rows.length;
  document.getElementById('st-accts').textContent = gset.size;
  document.getElementById('st-acv').textContent = fmtUSD(rows.reduce((s,d)=>s+d.usd,0));
  document.getElementById('st-fed').textContent = rows.filter(d=>d.fed).length;
  document.getElementById('st-acdn').textContent = new Set(rows.map(d=>d.acd)).size;
  renderSidebar(rows);
}

function sideBlock(title, entries){
  let h = '<div class="side-block"><h3>' + esc(title) + '</h3>';
  entries.forEach(e => {
    h += '<div class="side-row"><span class="side-label">' + e.label + '</span><span class="side-val">' + e.val + '</span></div>';
  });
  return h + '</div>';
}
function renderSidebar(rows){
  // By stage
  const byStage = new Map();
  rows.forEach(d => {
    const k = d.stage;
    if (!byStage.has(k)) byStage.set(k, {n:0, acv:0, label:d.stageLabel});
    const o = byStage.get(k); o.n++; o.acv += d.usd;
  });
  const stEntries = [...byStage.entries()].sort((a,b)=>a[0]-b[0]).map(([k,o]) => ({
    label: '<span class="stage-dot" style="background:' + STAGE_COLORS[k] + '"></span>' + k + ' · ' + esc(o.label),
    val: o.n + ' · ' + fmtUSD(o.acv)
  }));
  // By ACD
  const byAcd = new Map();
  rows.forEach(d => {
    if (!byAcd.has(d.acd)) byAcd.set(d.acd, {n:0, acv:0});
    const o = byAcd.get(d.acd); o.n++; o.acv += d.usd;
  });
  const acdEntries = [...byAcd.entries()].sort((a,b)=>b[1].acv-a[1].acv).map(([k,o]) => ({
    label: acdPill(k), val: o.n + ' · ' + fmtUSD(o.acv)
  }));
  // By region
  const byReg = new Map();
  rows.forEach(d => {
    const k = d.region || '—';
    byReg.set(k, (byReg.get(k)||0)+1);
  });
  const regEntries = [...byReg.entries()].sort((a,b)=>b[1]-a[1]).map(([k,n]) => ({label: esc(k), val: n}));
  document.getElementById('sidebar').innerHTML =
    sideBlock('By Stage', stEntries) + sideBlock('By ACD', acdEntries) + sideBlock('By Region', regEntries);
}

function initFilters(){
  const regs = [...new Set(DATA.map(d=>d.region || '—'))].sort();
  const acds = [...new Set(DATA.map(d=>d.acd))].sort();
  const rsel = document.getElementById('f-region');
  regs.forEach(r => { const o=document.createElement('option'); o.value=r; o.textContent=r; rsel.appendChild(o); });
  const asel = document.getElementById('f-acd');
  acds.forEach(a => { const o=document.createElement('option'); o.value=a; o.textContent=a; asel.appendChild(o); });
  ['f-search','f-stage','f-region','f-acd'].forEach(id => {
    document.getElementById(id).addEventListener(id==='f-search'?'input':'change', render);
  });
  COLS.forEach((c,i) => {
    document.getElementById('th-'+i).addEventListener('click', () => {
      if (sortCol === i){
        if (sortDir === 1) sortDir = -1;
        else { sortCol = null; sortDir = 1; }
      } else { sortCol = i; sortDir = 1; }
      render();
    });
  });
}

document.addEventListener('DOMContentLoaded', () => {
  initGate();
  document.getElementById('pw-btn').addEventListener('click', checkPw);
  document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
  initFilters();
  render();
});

</script>
