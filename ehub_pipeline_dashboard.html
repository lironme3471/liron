<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
:root {
  --nice-blue: #3694fc;
  --nice-charcoal: #21212b;
  --nice-indigo: #6100FF;
  --nice-teal: #36EAD0;
  --nice-coral: #FF5B8A;
  --bg: #f4f6fb;
  --card-bg: #ffffff;
  --border: #e3e6ee;
  --text: #21212b;
  --text-muted: #6b6f80;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* Password gate */
#gate {
  position: fixed; inset: 0; background: var(--nice-charcoal);
  display: flex; align-items: center; justify-content: center; z-index: 9999;
}
#gate .card {
  background: #fff; border-radius: 14px; padding: 40px 36px; width: 340px;
  text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
#gate .logo { font-weight: 800; font-size: 22px; color: var(--nice-charcoal); margin-bottom: 4px; }
#gate .logo span { color: var(--nice-blue); }
#gate .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
#gate input {
  width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
  font-size: 14px; margin-bottom: 12px; outline: none;
}
#gate input:focus { border-color: var(--nice-blue); }
#gate button {
  width: 100%; padding: 11px; border-radius: 8px; border: none;
  background: var(--nice-blue); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
}
#gate button:hover { background: #237ddb; }
#gate .err { color: var(--nice-coral); font-size: 12.5px; margin-top: 10px; min-height: 14px; }

#app { display: none; }

header.top {
  background: var(--nice-charcoal); color: #fff; padding: 18px 28px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
header.top h1 { font-size: 18px; margin: 0; font-weight: 700; }
header.top h1 span { color: var(--nice-blue); }
header.top .meta { font-size: 12px; color: #a9acc0; }

.stats-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px; padding: 18px 28px; background: #fff; border-bottom: 1px solid var(--border);
}
.stat {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 16px;
}
.stat .label { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.stat .value { font-size: 22px; font-weight: 700; color: var(--nice-charcoal); margin-top: 4px; }

.layout { display: flex; gap: 20px; padding: 20px 28px 40px; align-items: flex-start; }
.main { flex: 1; min-width: 0; }
.sidebar { width: 280px; flex-shrink: 0; }

.filters {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center;
}
.filters input[type=text], .filters select {
  padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
  font-size: 13.5px; background: #fff;
}
.filters input[type=text] { flex: 1; min-width: 200px; }
.filters .count { font-size: 12.5px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }

table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
thead th {
  text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em;
  color: var(--text-muted); padding: 10px 12px; border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none; white-space: nowrap;
}
thead th:hover { color: var(--nice-blue); }
tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #f0f1f6; vertical-align: middle; }
tr.acct-header { background: #f7f8fc; cursor: pointer; }
tr.acct-header td { font-weight: 700; padding: 11px 12px; }
tr.acct-header:hover { background: #eef1fa; }
tr.acct-header .chevron { display:inline-block; width: 14px; transition: transform .15s; }
tr.acct-header.collapsed .chevron { transform: rotate(-90deg); }
tr.deal-row td.acct-cell { color: var(--text-muted); font-size: 12px; }
a.opp-link { color: var(--nice-blue); text-decoration: none; font-weight: 500; }
a.opp-link:hover { text-decoration: underline; }

.pill {
  display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px;
  font-weight: 600; color: #fff; white-space: nowrap;
}
.stage-badge {
  display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 600;
}
.stage-0, .stage-1 { background: #e3f1ff; color: #1465c0; }
.stage-2, .stage-3 { background: #fff4d6; color: #93660a; }
.stage-4 { background: #efe2ff; color: #5c17c7; }
.stage-5 { background: #dff7ea; color: #1b7a44; }
.fedramp-badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700;
  background: #efe2ff; color: #5c17c7; margin-left: 6px;
}
.sort-arrow { font-size: 10px; margin-left: 3px; }

.side-card {
  background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px;
}
.side-card h3 { font-size: 13px; margin: 0 0 12px; color: var(--nice-charcoal); }
.side-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid #f3f4f8; }
.side-row:last-child { border-bottom: none; }
.side-row .l { color: var(--text); display: flex; align-items: center; gap: 6px; }
.side-row .r { color: var(--text-muted); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.muted { color: var(--text-muted); font-size: 12.5px; }
.hidden { display: none !important; }

@media (max-width: 860px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; }
}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiC<span>E</span></div>
    <div class="sub">eHub Pipeline Dashboard</div>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>eHub <span>Pipeline</span> Dashboard</h1>
    <div class="meta" id="genMeta"></div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="layout">
    <div class="main">
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search opportunity, account, owner...">
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <select id="acdFilter"><option value="">All ACDs</option></select>
        <span class="count" id="resultCount"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th data-key="name">Opportunity</th>
            <th data-key="accountName">Account</th>
            <th data-key="stageNum">Stage</th>
            <th data-key="closeDate">Close Date</th>
            <th data-key="usdACV">ACV</th>
            <th data-key="acd">ACD</th>
            <th data-key="region">Region / Territory</th>
            <th data-key="owner">Owner</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="sidebar">
      <div class="side-card">
        <h3>By Stage</h3>
        <div id="sideStage"></div>
      </div>
      <div class="side-card">
        <h3>By ACD</h3>
        <div id="sideAcd"></div>
      </div>
      <div class="side-card">
        <h3>By Region</h3>
        <div id="sideRegion"></div>
      </div>
    </div>
  </div>
</div>

async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const hash = await sha256Hex(val);
  if (hash === STORED_HASH) {
    try { sessionStorage.setItem('ehub_auth', '1'); } catch(e) {}
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}

function fmtUSD(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function acdColor(acd) {
  return ACD_COLORS[acd] || ACD_DEFAULT;
}
function stageClass(num) {

function renderStats() {
  const s = DATA.stats;
  const items = [
    ['Open Deals', s.dealCount],
    ['Accounts', s.accountCount],
    ['Total Pipeline ACV', fmtUSD(s.totalACV)],
    ['FedRAMP', s.fedrampCount],
    ['Distinct ACDs', s.acdCount],
  ];
  document.getElementById('statsBar').innerHTML = items.map(([label, val]) =>
    `<div class="stat"><div class="label">${label}</div><div class="value">${val}</div></div>`
  ).join('');
}

function renderSidebar() {
  const stageEntries = Object.entries(DATA.byStage).sort((a,b) => a[0].localeCompare(b[0]));
  document.getElementById('sideStage').innerHTML = stageEntries.map(([label, v]) =>
    `<div class="side-row"><span class="l">${label}</span><span class="r">${v.count} &middot; ${fmtUSD(v.acv)}</span></div>`
  ).join('');

  const acdEntries = Object.entries(DATA.byAcd).sort((a,b) => b[1].acv - a[1].acv);

  ).join('');

  ).join('');
}

function populateFilters() {
  const stageSel = document.getElementById('stageFilter');
  const stages = [...new Set(DATA.rows.map(r => r.stageLabel))].sort();
  stages.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; stageSel.appendChild(o); });

  const regionSel = document.getElementById('regionFilter');
  const regions = [...new Set(DATA.rows.map(r => (r.region||'').split(' / ')[0]).filter(Boolean))].sort();
  regions.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; regionSel.appendChild(o); });

  const acdSel = document.getElementById('acdFilter');
  const acds = [...new Set(DATA.rows.map(r => r.acd))].sort();
  acds.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; acdSel.appendChild(o); });
}

function attachFilterHandlers() {
  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('stageFilter').addEventListener('change', render);
  document.getElementById('regionFilter').addEventListener('change', render);
  document.getElementById('acdFilter').addEventListener('change', render);
}

function attachSortHandlers() {
  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-key');
      if (sortKey === key) {
        sortClickCount++;
        if (sortClickCount === 1) { sortDir = -1; }
        else { sortKey = null; sortClickCount = 0; }
      } else {
        sortKey = key; sortDir = 1; sortClickCount = 0;
      }
      render();
    });
  });
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;

  return DATA.rows.filter(r => {
    if (stage && r.stageLabel !== stage) return false;
    if (acd && r.acd !== acd) return false;
    if (region && (r.region||'').split(' / ')[0] !== region) return false;
    if (q) {
      const hay = (r.name + ' ' + r.accountName + ' ' + (r.owner||'') + ' ' + r.topParent).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function dealRowHtml(r, showAccount) {
  const link = SF_BASE.replace('__ID__', r.id);
  const fedBadge = r.fedramp === 'Yes' ? '<span class="fedramp-badge">FedRAMP</span>' : '';
  const acctCell = showAccount ? `<td>${escapeHtml(r.accountName)}</td>` : `<td class="acct-cell">${r.accountName !== r.topParent ? escapeHtml(r.accountName) : ''}</td>`;
  return `<tr class="deal-row">
    <td><a class="opp-link" href="${link}" target="_blank" rel="noopener">${escapeHtml(r.name)}</a>${fedBadge}</td>
    ${acctCell}
    <td><span class="stage-badge ${stageClass(r.stageNum)}">${escapeHtml(r.stageLabel)}</span></td>
    <td>${fmtDate(r.closeDate)}</td>
    <td>${fmtUSD(r.usdACV)}${r.currency !== 'USD' ? `<div class="muted">${r.nativeACV.toLocaleString()} ${r.currency}</div>` : ''}</td>
    <td><span class="pill" style="background:${acdColor(r.acd)}">${escapeHtml(r.acd)}</span></td>
    <td>${escapeHtml(r.region||'')}</td>
    <td>${escapeHtml(r.owner||'')}</td>
  </tr>`;
}

function escapeHtml(s) {
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

    const dir = sortDir;
    const sorted = [...filtered].sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === 'stageNum') { av = Number(av); bv = Number(bv); }
      if (sortKey === 'usdACV') { av = Number(av); bv = Number(bv); }
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
    tbody.innerHTML = sorted.map(r => dealRowHtml(r, true)).join('');
    updateSortIndicators();
  } else {
    // grouped by account, sorted by total ACV desc
    const groups = {};
    filtered.forEach(r => {
      if (!groups[r.topParent]) groups[r.topParent] = [];
      groups[r.topParent].push(r);
    });
    const groupList = Object.entries(groups).map(([name, rs]) => {
      const total = rs.reduce((s,r) => s + r.usdACV, 0);
      rs.sort((a,b) => (a.closeDate||'').localeCompare(b.closeDate||''));
      return { name, rs, total };
    }).sort((a,b) => b.total - a.total);

    let html = '';
    groupList.forEach((g, gi) => {
      const acds = [...new Set(g.rs.map(r => r.acd))];
      const pills = acds.map(a => `<span class="pill" style="background:${acdColor(a)}">${escapeHtml(a)}</span>`).join(' ');
      html += `<tr class="acct-header" data-group="${gi}">
        <td colspan="4"><span class="chevron">&#9660;</span> ${escapeHtml(g.name)} <span class="muted">(${g.rs.length} deal${g.rs.length>1?'s':''})</span></td>
        <td>${fmtUSD(g.total)}</td>
        <td colspan="3">${pills}</td>
      </tr>`;
      g.rs.forEach(r => { html += dealRowHtml(r, false); });
    });
    tbody.innerHTML = html;
    updateSortIndicators();
    attachGroupToggles();
  }

  const accountCount = sortKey ? new Set(filtered.map(r => r.topParent)).size : new Set(filtered.map(r => r.topParent)).size;
  document.getElementById('resultCount').textContent = `${filtered.length} deals · ${accountCount} accounts`;
}

function attachGroupToggles() {
  document.querySelectorAll('tr.acct-header').forEach(headerRow => {
    headerRow.addEventListener('click', () => {
      headerRow.classList.toggle('collapsed');
      let next = headerRow.nextElementSibling;
      while (next && next.classList.contains('deal-row')) {
        next.classList.toggle('hidden');
        next = next.nextElementSibling;
      }
    });
  });
}

function updateSortIndicators() {
  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.querySelectorAll('.sort-arrow').forEach(e => e.remove());
    if (sortKey && th.getAttribute('data-key') === sortKey) {
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
  });
}
</script>
</body>
</html>
