<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
  :root {
    --blue: #3694fc;
    --charcoal: #21212b;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    margin: 0;
    background: #f4f5f8;
    color: var(--charcoal);
  }

  /* Password gate */
  #gate {
    position: fixed; inset: 0; background: var(--charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 40px 36px; width: 320px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #gate .logo { font-weight: 800; font-size: 22px; color: var(--indigo); margin-bottom: 4px; }
  #gate .sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 14px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
    background: var(--blue); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #gate button:hover { background: var(--indigo); }
  #gate .err { color: var(--coral); font-size: 12px; margin-top: 8px; min-height: 16px; }

  #app { display: none; }

  header {
    background: var(--charcoal); color: #fff; padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  header .title { font-size: 19px; font-weight: 700; }
  header .title span { color: var(--blue); }
  header .meta { font-size: 12px; color: #a0a3ad; }

  .stats-bar {
    display: flex; gap: 14px; padding: 16px 28px; flex-wrap: wrap; background: #fff;
    border-bottom: 1px solid #e5e7eb;
  }
  .stat {
    background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 18px;
    min-width: 130px;
  }
  .stat .label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 20px; font-weight: 700; color: var(--charcoal); margin-top: 2px; }

  .layout { display: flex; gap: 0; align-items: flex-start; }
  .sidebar {
    width: 260px; flex-shrink: 0; background: #fff; border-right: 1px solid #e5e7eb;
    padding: 18px 16px; min-height: calc(100vh - 140px);
  }
  .sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; margin: 18px 0 8px; }
  .sidebar h3:first-child { margin-top: 0; }
  .sb-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: #374151; }
  .sb-row .n { color: #9ca3af; font-size: 11px; }

  .main { flex: 1; padding: 18px 28px; min-width: 0; }

  .controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .controls input[type=text] {
    padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; width: 220px;
  }
  .controls select {
    padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; background: #fff;
  }
  .count-label { font-size: 12px; color: #6b7280; margin-left: auto; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .03em;
    color: #6b7280; padding: 10px 12px; border-bottom: 2px solid #e5e7eb; cursor: pointer; white-space: nowrap;
    background: #fafbfc;
  }
  thead th:hover { color: var(--blue); }
  tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #f0f1f3; vertical-align: middle; }
  tbody tr.deal-row:hover { background: #f7f9ff; }

  tr.acct-header { background: #eef2ff; cursor: pointer; }
  tr.acct-header td { font-weight: 700; padding: 10px 12px; }
  tr.acct-header .acct-name { display: flex; align-items: center; gap: 8px; }
  tr.acct-header .chev { display: inline-block; transition: transform .15s; font-size: 11px; color: #6b7280; }
  tr.acct-header.collapsed .chev { transform: rotate(-90deg); }
  tr.deal-row.hidden { display: none; }

  a.opp-link { color: var(--blue); text-decoration: none; font-weight: 500; }
  a.opp-link:hover { text-decoration: underline; }

  .muted { color: #9ca3af; font-size: 12px; }

  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
    color: #fff; white-space: nowrap;
  }
  .badge-fedramp {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700;
    background: #8b5cf6; color: #fff; margin-left: 6px;
  }
  .stage-badge {
    display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff;
  }
  .sort-arrow { font-size: 10px; margin-left: 4px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <div class="sub">eHub Pipeline Dashboard</div>
    <input type="password" id="pw" placeholder="Password" autofocus>
    <button onclick="checkPw()">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="title">eHub Pipeline Dashboard <span>&middot; NiCE</span></div>
    <div class="meta">Engagement Hub Real-Time Recording pipeline &middot; open stages 0&ndash;5 &middot; built 2026-09-28</div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="controls">
        <input type="text" id="searchBox" placeholder="Search opportunity, account, owner...">
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <select id="acdFilter"><option value="">All ACDs</option></select>
        <span class="count-label" id="countLabel"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th data-key="name">Opportunity</th>
            <th data-key="groupAccount">Account</th>
            <th data-key="stage">Stage</th>
            <th data-key="closeDate">Close Date</th>
            <th data-key="usdACV">ACV</th>
            <th data-key="acd">ACD</th>
            <th data-key="region">Region / Territory</th>
            <th data-key="owner">Owner</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

const ACD_COLORS = {
  "Genesys": "#a78bfa",
  "Genesys Engage": "#6100FF",
  "Genesys SIPREC": "#9457ff",
  "Genesys CX": "#43009e",
  "Five9": "#00a887",
  "MS Teams": "#6264A7",
  "MS Teams / Cisco Systems": "#4a6fa5",
  "Cisco Systems": "#049fd9",
  "Amazon Connect": "#FF9900",
  "Avaya": "#e2231a",
  "Unknown": "#9ca3af"
};
function acdColor(a) { return ACD_COLORS[a] || "#6b7280"; }

const STAGE_COLORS = { 0: "#3694fc", 1: "#3694fc", 2: "#f5a623", 3: "#f5a623", 4: "#6100FF", 5: "#22c55e" };
const STAGE_LABELS = {
  0: "Prospecting", 1: "Identification / Qualification", 2: "Determining Problem / Impact",
  3: "Aligning Benefits & Value", 4: "Confirm Value & Agreement", 5: "Proposal / Negotiation"
};

// ---- Password gate ----
const STORED_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";
async function checkPw() {
  const val = document.getElementById('pw').value;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hex === STORED_HASH) {
    sessionStorage.setItem('ehub_ok', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
if (sessionStorage.getItem('ehub_ok') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.addEventListener('DOMContentLoaded', init);
}

// ---- State ----
let sortKey = null;   // null = grouped by account
let sortDir = 1;
let collapsedAccounts = new Set();

function fmtUSD(n) {
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined, {maximumFractionDigits: 0});
}

function filteredDeals() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;
  return DEALS.filter(d => {
    if (stage !== "" && String(d.stage) !== stage) return false;
    if (region !== "" && (d.region || "") !== region) return false;
    if (acd !== "" && d.acd !== acd) return false;
    if (q) {
      const hay = (d.name + " " + d.account + " " + d.groupAccount + " " + (d.owner||"")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function regionDisplay(d) {
  if (d.region && d.territory) return d.region + " / " + d.territory;
  if (d.region) return d.region;
  if (d.territory) return d.territory;
  return "—";
}

function renderStats(deals) {
  const totalACV = deals.reduce((s,d)=>s+d.usdACV,0);
  const accts = new Set(deals.map(d=>d.groupAccount));
  const fed = deals.filter(d=>d.fedramp==="Yes").length;
  const acds = new Set(deals.map(d=>d.acd));
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `
    <div class="stat"><div class="label">Open Deals</div><div class="value">${deals.length}</div></div>
    <div class="stat"><div class="label">Accounts</div><div class="value">${accts.size}</div></div>
    <div class="stat"><div class="label">Total Pipeline ACV</div><div class="value">${fmtUSD(totalACV)}</div></div>
    <div class="stat"><div class="label">FedRAMP</div><div class="value">${fed}</div></div>
    <div class="stat"><div class="label">Distinct ACDs</div><div class="value">${acds.size}</div></div>
  `;
}

function renderSidebar(deals) {
  const byStage = {};
  const byAcd = {};
  const byRegion = {};
  deals.forEach(d => {
    byStage[d.stage] = byStage[d.stage] || {n:0, acv:0};
    byStage[d.stage].n++; byStage[d.stage].acv += d.usdACV;
    byAcd[d.acd] = byAcd[d.acd] || {n:0, acv:0};
    byAcd[d.acd].n++; byAcd[d.acd].acv += d.usdACV;
    const r = d.region || "Unspecified";
    byRegion[r] = (byRegion[r]||0) + 1;
  });
  let stageHtml = Object.keys(byStage).sort().map(s => {
    const v = byStage[s];
    return `<div class="sb-row"><span>${s} &middot; ${STAGE_LABELS[s]}</span><span class="n">${v.n} &middot; ${fmtUSD(v.acv)}</span></div>`;
  }).join('');
  let acdHtml = Object.keys(byAcd).sort((a,b)=>byAcd[b].acv-byAcd[a].acv).map(a => {
    const v = byAcd[a];
    return `<div class="sb-row"><span><span class="pill" style="background:${acdColor(a)};padding:1px 7px;font-size:10px;">${a}</span></span><span class="n">${v.n} &middot; ${fmtUSD(v.acv)}</span></div>`;
  }).join('');
  let regionHtml = Object.keys(byRegion).sort((a,b)=>byRegion[b]-byRegion[a]).map(r => {
    return `<div class="sb-row"><span>${r}</span><span class="n">${byRegion[r]}</span></div>`;
  }).join('');
  document.getElementById('sidebar').innerHTML = `
    <h3>By Stage</h3>${stageHtml}
    <h3>By ACD</h3>${acdHtml}
    <h3>By Region</h3>${regionHtml}
  `;
}

function populateDropdowns() {
  const stageSel = document.getElementById('stageFilter');
  [0,1,2,3,4,5].forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s + " · " + STAGE_LABELS[s];
    stageSel.appendChild(o);
  });
  const regions = [...new Set(DEALS.map(d=>d.region).filter(Boolean))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const o = document.createElement('option'); o.value = r; o.textContent = r;
    regionSel.appendChild(o);
  });
  const acds = [...new Set(DEALS.map(d=>d.acd))].sort();
  const acdSel = document.getElementById('acdFilter');
  acds.forEach(a => {
    const o = document.createElement('option'); o.value = a; o.textContent = a;
    acdSel.appendChild(o);
  });
}

function dealRowHtml(d, showAccount) {
  const stageColor = STAGE_COLORS[d.stage] || "#6b7280";
  const fed = d.fedramp === "Yes" ? `<span class="badge-fedramp">FedRAMP</span>` : "";
  const acctCell = showAccount
    ? (d.account !== d.groupAccount ? `<span class="muted">${escapeHtml(d.account)}</span>` : escapeHtml(d.account))
    : (d.account !== d.groupAccount ? `<span class="muted">${escapeHtml(d.account)}</span>` : "");
  return `
    <tr class="deal-row" data-id="${d.id}">
      <td><a class="opp-link" href="${SF_BASE}${d.id}/view" target="_blank">${escapeHtml(d.name)}</a>${fed}</td>
      <td>${acctCell}</td>
      <td><span class="stage-badge" style="background:${stageColor}">${d.stage} &middot; ${d.stageLabel}</span></td>
      <td>${d.closeDate || ""}</td>
      <td>${fmtUSD(d.usdACV)}${d.currency && d.currency!=="USD" ? `<div class="muted">${d.nativeACV.toLocaleString()} ${d.currency}</div>` : ""}</td>
      <td><span class="pill" style="background:${acdColor(d.acd)}">${escapeHtml(d.acd)}</span></td>
      <td>${escapeHtml(regionDisplay(d))}</td>
      <td>${escapeHtml(d.owner||"")}</td>
    </tr>
  `;
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render() {
  const deals = filteredDeals();
  renderStats(deals);
  renderSidebar(deals);
  const tbody = document.getElementById('tbody');

  if (sortKey === null) {
    // grouped by account
    const groups = {};
    deals.forEach(d => {
      groups[d.groupAccount] = groups[d.groupAccount] || [];
      groups[d.groupAccount].push(d);
    });
    const groupNames = Object.keys(groups).sort((a,b) => {
      const sa = groups[a].reduce((s,d)=>s+d.usdACV,0);
      const sb = groups[b].reduce((s,d)=>s+d.usdACV,0);
      return sb - sa;
    });
    let rows = '';
    groupNames.forEach(g => {
      const gdeals = groups[g].slice().sort((a,b) => (a.closeDate||"").localeCompare(b.closeDate||""));
      const gAcv = gdeals.reduce((s,d)=>s+d.usdACV,0);
      const acds = [...new Set(gdeals.map(d=>d.acd))];
      const acdPills = acds.map(a => `<span class="pill" style="background:${acdColor(a)};font-size:10px;">${escapeHtml(a)}</span>`).join(' ');
      const collapsed = collapsedAccounts.has(g);
      rows += `<tr class="acct-header ${collapsed?'collapsed':''}" data-group="${escapeHtml(g)}">
        <td colspan="8">
          <div class="acct-name">
            <span class="chev">&#9660;</span>
            <span>${escapeHtml(g)}</span>
            <span class="muted">${gdeals.length} deal${gdeals.length>1?'s':''}</span>
            ${acdPills}
            <span style="margin-left:auto;font-weight:700;">${fmtUSD(gAcv)}</span>
          </div>
        </td>
      </tr>`;
      gdeals.forEach(d => {
        rows += (collapsed ? dealRowHtml(d,false).replace('class="deal-row"','class="deal-row hidden"') : dealRowHtml(d,false));
      });
    });
    tbody.innerHTML = rows;
    document.querySelectorAll('tr.acct-header').forEach(tr => {
      tr.addEventListener('click', () => {
        const g = tr.getAttribute('data-group');
        if (collapsedAccounts.has(g)) collapsedAccounts.delete(g); else collapsedAccounts.add(g);
        render();
      });
    });
    document.getElementById('countLabel').textContent = `${deals.length} deals · ${groupNames.length} accounts`;
  } else {
    const sorted = deals.slice().sort((a,b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string") av = (av||"").toLowerCase();
      if (typeof bv === "string") bv = (bv||"").toLowerCase();
      if (av < bv) return -1 * sortDir;
      if (av > bv) return 1 * sortDir;
      return 0;
    });
    tbody.innerHTML = sorted.map(d => dealRowHtml(d, true)).join('');
    const accts = new Set(deals.map(d=>d.groupAccount));
    document.getElementById('countLabel').textContent = `${deals.length} deals · ${accts.size} accounts`;
  }

  // update sort arrows
  document.querySelectorAll('thead th').forEach(th => {
    th.querySelectorAll('.sort-arrow').forEach(a=>a.remove());
    const key = th.getAttribute('data-key');
    if (key === sortKey) {
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
  });
}

function initSortHeaders() {
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-key');
      if (sortKey !== key) {
        sortKey = key; sortDir = 1;
      } else if (sortDir === 1) {
        sortDir = -1;
      } else {
        sortKey = null; sortDir = 1;
      }
      render();
    });
  });
}

function init() {
  populateDropdowns();
  initSortHeaders();
  document.getElementById('searchBox').addEventListener('input', render);
  document.getElementById('stageFilter').addEventListener('change', render);
  document.getElementById('regionFilter').addEventListener('change', render);
  document.getElementById('acdFilter').addEventListener('change', render);
  render();
}
</script>
</body>
