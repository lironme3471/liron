function tags(d){return (d.f==='Yes'?'<span class="badge" style="background:#6100FF">FedRAMP</span>':'')+(d.au?'<span class="badge" style="background:#36EAD0;color:#21212b">AutoSummary</span>':'')+(d.co?'<span class="badge" style="background:#FF5B8A">Copilot</span>':'')}
function init(){const u=(k,l)=>['<option value="">'+l+'</option>',...[...new Set(DATA.map(d=>d[k]))].sort().map(x=>`<option>${esc(x)}</option>`)].join('');
document.getElementById('fs').innerHTML='<option value="">All Stages</option>'+[0,1,2,3,4,5].map(i=>`<option value="${i}">${i} · ${DATA.find(d=>d.s==i)?.sl||''}</option>`).join('');
document.getElementById('fr').innerHTML=u('rg','All Regions');document.getElementById('fa').innerHTML=u('d','All ACDs');
document.getElementById('th').innerHTML=COLS.map(c=>`<th onclick="srt('${c[0]}')">${c[1]}<span id="ar_${c[0]}"></span></th>`).join('');render()}
function srt(k){if(sk!==k){sk=k;sd=1}else if(sd===1)sd=-1;else{sk=null;sd=1}render()}
function val(d,k){return k==='rt'?rt(d):d[k]}
function render(){const q=document.getElementById('q').value.toLowerCase(),fs=document.getElementById('fs').value,fr=document.getElementById('fr').value,fa=document.getElementById('fa').value,ft=document.getElementById('ft').value;
let L=DATA.filter(d=>(!q||(d.n+d.a+d.p+d.o+d.d+rt(d)).toLowerCase().includes(q))&&(fs===''||d.s==fs)&&(!fr||d.rg===fr)&&(!fa||d.d===fa)&&(!ft||(ft==='AutoSummary'?d.au:d.co)));
COLS.forEach(c=>document.getElementById('ar_'+c[0]).textContent=sk===c[0]?(sd===1?' ▲':' ▼'):'');
const row=(d,showAcct)=>`<tr class="d"><td><a href="${BASE}${d.id}/view" target="_blank">${esc(d.n)}</a> ${tags(d)}</td><td class="${showAcct?'':'muted'}">${showAcct?esc(d.a):(d.a!==d.p?esc(d.a):'')}</td><td><span class="sb" style="background:${SC[d.s]};color:${d.s==2||d.s==3?'#21212b':'#fff'}">${d.s} · ${esc(d.sl.split(' / ')[0])}</span></td><td>${d.c}</td><td class="num">${f$(d.v)}</td><td>${pill(d.d)}</td><td>${esc(rt(d))}</td><td>${esc(d.o)}</td></tr>`;
let h='';
if(sk){L=[...L].sort((a,b)=>{const x=val(a,sk),y=val(b,sk);return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*sd});h=L.map(d=>row(d,true)).join('')}
else{const G={};L.forEach(d=>(G[d.p]=G[d.p]||[]).push(d));Object.entries(G).map(([p,a])=>[p,a,a.reduce((s,d)=>s+d.v,0)]).sort((a,b)=>b[2]-a[2]).forEach(([p,a,t])=>{const c=coll[p];const ac=[...new Set(a.map(d=>d.d))];
h+=`<tr class="g" onclick="coll[${JSON.stringify(p).replace(/"/g,'&quot;')}]=!coll[${JSON.stringify(p).replace(/"/g,'&quot;')}];render()"><td>${c?'▸':'▾'} ${esc(p)} <span class="muted">(${a.length} deal${a.length>1?'s':''})</span></td><td></td><td></td><td></td><td class="num">${f$(t)}</td><td colspan="3">${ac.map(pill).join('')}</td></tr>`;
if(!c)h+=[...a].sort((x,y)=>x.c.localeCompare(y.c)).map(d=>row(d,false)).join('')})}
document.getElementById('tb').innerHTML=h;
const ac=new Set(L.map(d=>d.p));document.getElementById('cnt').textContent=L.length+' deals · '+ac.size+' accounts';
const tot=L.reduce((s,d)=>s+d.v,0);
document.getElementById('stats').innerHTML=[[L.length,'Open deals'],[ac.size,'Accounts'],[f$(tot),'Pipeline ACV (USD)'],[L.filter(d=>d.f==='Yes').length,'FedRAMP'],[new Set(L.map(d=>d.d)).size,'Distinct ACDs'],[L.filter(d=>d.au).length,'AutoSummary'],[L.filter(d=>d.co).length,'Copilot']].map(x=>`<div class="stat"><b>${x[0]}</b><small>${x[1]}</small></div>`).join('');
const by=(fn,money)=>{const m={};L.forEach(d=>{const k=fn(d);m[k]=m[k]||[0,0];m[k][0]++;m[k][1]+=d.v});return Object.entries(m).sort((a,b)=>b[1][1]-a[1][1]||b[1][0]-a[1][0])};
const box=(t,e,money)=>`<div class="card2"><h3>${t}</h3>${e.map(([k,v])=>`<div><span>${esc(k)}</span><span>${v[0]}${money?' · '+f$(v[1]):''}</span></div>`).join('')}</div>`;
document.getElementById('side').innerHTML=box('By Stage',by(d=>d.s+' · '+d.sl.split(' / ')[0]).sort((a,b)=>a[0].localeCompare(b[0])),1)+box('By ACD',by(d=>d.d),1)+box('By Region',by(d=>d.rg||'Unassigned'),0)}
</script></body></html>
