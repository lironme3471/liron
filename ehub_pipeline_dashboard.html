<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Pipeline Dashboard</title>
<style>
  :root {
    --nice-blue: #3694fc;
    --nice-charcoal: #21212b;
    --nice-indigo: #6100FF;
    --nice-teal: #36EAD0;
    --nice-coral: #FF5B8A;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --border: #e2e5ee;
    --text: #21212b;
    --text-muted: #6b6f80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Password gate */
  #gate {
    position: fixed; inset: 0; background: #21212b;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 16px; padding: 40px 36px;
    width: 360px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #gate .logo {
    font-weight: 800; font-size: 22px; color: var(--nice-indigo); margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  #gate .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
  #gate input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 14px; margin-bottom: 14px; outline: none;
  }
  #gate input:focus { border-color: var(--nice-blue); }
  #gate button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: var(--nice-blue); color: #fff; font-weight: 600; font-size: 14px;
    cursor: pointer; transition: background 0.15s;
  }
  #gate button:hover { background: #2578d4; }
  #gate .err { color: var(--nice-coral); font-size: 12px; margin-top: 10px; min-height: 16px; }

  #app { display: none; }

  header.topbar {
    background: var(--nice-charcoal); color: #fff; padding: 18px 28px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header.topbar .meta { font-size: 12px; color: #a9adc0; }

  .stats-bar {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
    padding: 20px 28px; background: var(--card-bg); border-bottom: 1px solid var(--border);
  }
  .stat {
    background: var(--bg); border-radius: 10px; padding: 14px 16px;
    border: 1px solid var(--border);
  }
  .stat .val { font-size: 22px; font-weight: 800; color: var(--nice-charcoal); }
  .stat .lbl { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 20px 28px; align-items: start; }

  .sidebar { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; }
  .side-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .side-card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); margin: 0 0 10px; }
  .side-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--border); }
  .side-row:last-child { border-bottom: none; }
  .side-row .name { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .side-row .num { color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .main { min-width: 0; }
  .filters {
    display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
  }
  .filters input[type=text] {
    flex: 1; min-width: 200px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px;
  }
  .filters select {
    padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; background: #fff;
  }
  .result-count { font-size: 12px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }

  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px;
    color: var(--text-muted); padding: 10px 12px; border-bottom: 2px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--nice-blue); }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tbody tr.deal-row:hover { background: #f8faff; }

  tr.account-header td {
    background: #eef2fb; font-weight: 700; cursor: pointer; padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  tr.account-header .acct-name { display: flex; align-items: center; gap: 8px; }
  tr.account-header .chevron { transition: transform 0.15s; display: inline-block; font-size: 10px; color: var(--text-muted); }
  tr.account-header.collapsed .chevron { transform: rotate(-90deg); }
  tr.account-header .acct-count { font-weight: 400; color: var(--text-muted); font-size: 12px; }
  tr.account-header .acct-acv { float: right; font-weight: 800; }
  tr.account-header .acd-badges { display: inline-flex; gap: 4px; margin-left: 10px; flex-wrap: wrap; }

  a.opp-link { color: var(--nice-blue); text-decoration: none; font-weight: 600; }
  a.opp-link:hover { text-decoration: underline; }

  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #fff;
    white-space: nowrap;
  }
  .badge-fedramp { background: #6100FF; }
  .stage-badge { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap; }
  .stage-01 { background: #3694fc; }
  .stage-23 { background: #e3a008; }
  .stage-4 { background: #6100FF; }
  .stage-5 { background: #17a673; }

  .muted { color: var(--text-muted); font-size: 12px; }
  .sort-arrow { font-size: 10px; margin-left: 4px; }
  .hidden { display: none !important; }
  footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <div class="sub">eHub Pipeline Dashboard</div>
    <input type="password" id="pw" placeholder="Password" autocomplete="off">
    <button id="pwBtn" onclick="tryUnlock()">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <h1>eHub Pipeline Dashboard</h1>
    <div class="meta" id="genMeta"></div>
  </header>

  <div class="stats-bar" id="statsBar"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="filters">
        <input type="text" id="searchBox" placeholder="Search opportunity or account...">
        <select id="stageFilter"><option value="">All Stages</option></select>
        <select id="regionFilter"><option value="">All Regions</option></select>
        <select id="acdFilter"><option value="">All ACDs</option></select>
        <span class="result-count" id="resultCount"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th data-key="name">Opportunity</th>
            <th data-key="accountName">Account</th>
            <th data-key="stage">Stage</th>
            <th data-key="closeDate">Close Date</th>
            <th data-key="usdACV">ACV</th>
            <th data-key="acd">ACD</th>
            <th data-key="region">Region / Territory</th>
            <th data-key="owner">Owner</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer>NiCE CXone &middot; Engagement Hub Pipeline &middot; Internal use only</footer>
</div>

<script>
const PASSWORD_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pw').value;
  const hash = await sha256Hex(val);
  return hash === PASSWORD_HASH;
}

async function tryUnlock() {
  const ok = await checkPw();
  if (ok) {
    sessionStorage.setItem('ehub_unlocked', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}
document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

if (sessionStorage.getItem('ehub_unlocked') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.addEventListener('DOMContentLoaded', initDashboard);
}

const ACD_COLORS = {"MS Teams": "#3694fc", "NICE CXone Mpower": "#21212b", "Cisco Systems": "#1BA0D7", "Cisco": "#1BA0D7", "Avaya": "#CC0000", "Amazon Connect": "#FF9900", "Genesys": "#6100FF", "Genesys Engage": "#6100FF", "Genesys SIPREC": "#9457ff", "Genesys CX": "#43009e", "Five9": "#00a887", "UJET": "#36EAD0", "Unknown": "#8a8a99", "Other": "#8a8a99"};
const STAGE_LABELS = {"0": "Prospecting", "1": "Identification / Qualification", "2": "Determining Problem / Impact", "3": "Aligning Benefits & Value", "4": "Confirm Value & Agreement", "5": "Proposal / Negotiation"};
const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

let sortState = { key: null, dir: 1 }; // dir: 1 asc, -1 desc, 0 -> grouped
let collapsedAccounts = new Set();

function fmtUSD(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}

function stageBadgeClass(stage) {
  if (stage <= 1) return 'stage-01';
  if (stage <= 3) return 'stage-23';
  if (stage === 4) return 'stage-4';
  return 'stage-5';
}

function acdColor(acd) {
  return ACD_COLORS[acd] || '#8a8a99';
}

function regionDisplay(d) {
  if (d.region && d.territory) return d.region + ' / ' + d.territory;
  return d.region || d.territory || '—';
}

function initDashboard() {
  document.getElementById('genMeta').textContent = 'Generated ' + new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });

  // Populate filter dropdowns
  const stageSel = document.getElementById('stageFilter');
  Object.keys(STAGE_LABELS).sort((a,b)=>a-b).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s + ' · ' + STAGE_LABELS[s];
    stageSel.appendChild(opt);
  });
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const opt = document.createElement('option'); opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });
  const acds = [...new Set(DEALS.map(d => d.acd))].sort();
  const acdSel = document.getElementById('acdFilter');
  acds.forEach(a => {
    const opt = document.createElement('option'); opt.value = a; opt.textContent = a;
    acdSel.appendChild(opt);
  });

  document.getElementById('searchBox').addEventListener('input', render);
  stageSel.addEventListener('change', render);
  regionSel.addEventListener('change', render);
  acdSel.addEventListener('change', render);

  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-key');
      if (sortState.key !== key) {
        sortState = { key, dir: 1 };
      } else if (sortState.dir === 1) {
        sortState.dir = -1;
      } else {
        sortState = { key: null, dir: 0 };
      }
      render();
    });
  });

  renderStats();
  renderSidebar();
  render();
}

function getFiltered() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const stage = document.getElementById('stageFilter').value;
  const region = document.getElementById('regionFilter').value;
  const acd = document.getElementById('acdFilter').value;
  return DEALS.filter(d => {
    if (q && !((d.name||'').toLowerCase().includes(q) || (d.accountName||'').toLowerCase().includes(q) || (d.topParentName||'').toLowerCase().includes(q))) return false;
    if (stage !== '' && String(d.stage) !== stage) return false;
    if (region && d.region !== region) return false;
    if (acd && d.acd !== acd) return false;
    return true;
  });
}

function renderStats() {
  const accounts = new Set(DEALS.map(d => d.topParentName));
  const totalACV = DEALS.reduce((s,d) => s + d.usdACV, 0);
  const fedrampCount = DEALS.filter(d => d.fedramp === 'Yes').length;
  const acdCount = new Set(DEALS.map(d => d.acd)).size;
  const stats = [
    { val: DEALS.length, lbl: 'Open Deals' },
    { val: accounts.size, lbl: 'Accounts' },
    { val: fmtUSD(totalACV), lbl: 'Total Pipeline ACV' },
    { val: fedrampCount, lbl: 'FedRAMP Deals' },
    { val: acdCount, lbl: 'Distinct ACDs' },
  ];
  document.getElementById('statsBar').innerHTML = stats.map(s =>
    '<div class="stat"><div class="val">' + s.val + '</div><div class="lbl">' + s.lbl + '</div></div>'
  ).join('');
}

function renderSidebar() {
  const byStage = {};
  const byAcd = {};
  const byRegion = {};
  DEALS.forEach(d => {
    byStage[d.stage] = byStage[d.stage] || { count: 0, acv: 0 };
    byStage[d.stage].count++; byStage[d.stage].acv += d.usdACV;
    byAcd[d.acd] = byAcd[d.acd] || { count: 0, acv: 0 };
    byAcd[d.acd].count++; byAcd[d.acd].acv += d.usdACV;
    const r = d.region || 'Unspecified';
    byRegion[r] = byRegion[r] || { count: 0 };
    byRegion[r].count++;
  });

  function block(title, obj, showAcv, colorFn) {
    const entries = Object.entries(obj).sort((a,b) => (b[1].acv||b[1].count) - (a[1].acv||a[1].count));
    let rows = entries.map(([k,v]) => {
      const dot = colorFn ? '<span class="dot" style="background:' + colorFn(k) + '"></span>' : '';
      const label = title === 'By Stage' ? (k + ' · ' + (STAGE_LABELS[k]||'')) : k;
      const right = showAcv ? fmtUSD(v.acv) : v.count;
      return '<div class="side-row"><span class="name">' + dot + label + '</span><span class="num">' + (showAcv ? v.count + ' · ' + right : right) + '</span></div>';
    }).join('');
    return '<div class="side-card"><h3>' + title + '</h3>' + rows + '</div>';
  }

  document.getElementById('sidebar').innerHTML =
    block('By Stage', byStage, true, null) +
    block('By ACD', byAcd, true, acdColor) +
    block('By Region', byRegion, false, null);
}

function render() {
  const filtered = getFiltered();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  const accountsInFiltered = new Set(filtered.map(d => d.topParentName));
  document.getElementById('resultCount').textContent = filtered.length + ' deals · ' + accountsInFiltered.size + ' accounts';

  if (sortState.key) {
    const rows = [...filtered].sort((a,b) => {
      let av = a[sortState.key], bv = b[sortState.key];
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av < bv) return -1 * sortState.dir;
      if (av > bv) return 1 * sortState.dir;
      return 0;
    });
    renderFlat(rows);
  } else {
    renderGrouped(filtered);
  }
  updateSortIndicators();
}

function dealRowHtml(d, showAccount) {
  const link = SF_BASE + d.id + '/view';
  const acctCell = showAccount ? (d.accountName !== d.topParentName ? '<span class="muted">' + (d.accountName||'') + '</span>' : (d.accountName||'')) : '';
  return '<tr class="deal-row">' +
    '<td><a class="opp-link" href="' + link + '" target="_blank" rel="noopener">' + escapeHtml(d.name) + '</a>' + (d.fedramp === 'Yes' ? ' <span class="badge badge-fedramp">FedRAMP</span>' : '') + '</td>' +
    '<td>' + acctCell + '</td>' +
    '<td><span class="stage-badge ' + stageBadgeClass(d.stage) + '">' + d.stage + ' · ' + (STAGE_LABELS[d.stage]||'').split(' ').slice(0,2).join(' ') + '</span></td>' +
    '<td>' + (d.closeDate||'') + '</td>' +
    '<td>' + fmtUSD(d.usdACV) + (d.currency && d.currency !== 'USD' ? '<div class="muted">' + d.nativeACV.toLocaleString('en-US',{maximumFractionDigits:0}) + ' ' + d.currency + '</div>' : '') + '</td>' +
    '<td><span class="badge" style="background:' + acdColor(d.acd) + '">' + escapeHtml(d.acd) + '</span></td>' +
    '<td>' + escapeHtml(regionDisplay(d)) + '</td>' +
    '<td>' + escapeHtml(d.owner||'') + '</td>' +
    '</tr>';
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderFlat(rows) {
  document.getElementById('tbody').innerHTML = rows.map(d => dealRowHtml(d, true)).join('');
}

function renderGrouped(filtered) {
  const groups = {};
  filtered.forEach(d => {
    const key = d.topParentName || 'Unknown';
    groups[key] = groups[key] || [];
    groups[key].push(d);
  });
  const groupEntries = Object.entries(groups).map(([name, deals]) => {
    const acv = deals.reduce((s,d)=>s+d.usdACV,0);
    deals.sort((a,b) => (a.closeDate||'').localeCompare(b.closeDate||''));
    return { name, deals, acv };
  }).sort((a,b) => b.acv - a.acv);

  let html = '';
  groupEntries.forEach(g => {
    const acds = [...new Set(g.deals.map(d => d.acd))];
    const collapsed = collapsedAccounts.has(g.name);
    html += '<tr class="account-header' + (collapsed ? ' collapsed' : '') + '" data-acct="' + escapeHtml(g.name) + '">' +
      '<td colspan="8">' +
      '<span class="acct-name"><span class="chevron">▼</span>' + escapeHtml(g.name) +
      ' <span class="acct-count">' + g.deals.length + ' deal' + (g.deals.length>1?'s':'') + '</span>' +
      '<span class="acd-badges">' + acds.map(a => '<span class="badge" style="background:' + acdColor(a) + '">' + escapeHtml(a) + '</span>').join('') + '</span>' +
      '</span>' +
      '<span class="acct-acv">' + fmtUSD(g.acv) + '</span>' +
      '</td></tr>';
    if (!collapsed) {
      g.deals.forEach(d => { html += dealRowHtml(d, d.accountName !== g.name); });
    }
  });
  document.getElementById('tbody').innerHTML = html;

  document.querySelectorAll('tr.account-header').forEach(tr => {
    tr.addEventListener('click', () => {
      const acct = tr.getAttribute('data-acct');
      if (collapsedAccounts.has(acct)) collapsedAccounts.delete(acct);
      else collapsedAccounts.add(acct);
      render();
    });
  });
}

function updateSortIndicators() {
  document.querySelectorAll('thead th[data-key]').forEach(th => {
    th.querySelectorAll('.sort-arrow').forEach(el => el.remove());
    if (sortState.key === th.getAttribute('data-key')) {
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = sortState.dir === 1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
  });
}
</script>
</body>
</html>
